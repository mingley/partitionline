[package]
name = "partitionline-broker"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false
description = "Experimental Rust Kafka broker; production qualification tracked in KL11"

[features]
default = []
tls = ["dep:rustls", "dep:tokio-rustls"]
sasl = ["dep:base64", "dep:hmac", "dep:pbkdf2", "dep:sha2", "dep:zeroize"]
oidc = ["sasl", "tls", "dep:ring", "dep:serde", "dep:serde_json", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:http"]
codecs = ["dep:flate2", "dep:lz4_flex", "dep:snap", "dep:zstd-rs"]

[dependencies]
ring = { version = "0.17.14", optional = true }
serde = { version = "1.0.228", optional = true, default-features = false, features = ["std"] }
serde_json = { version = "1.0.151", optional = true }
hyper = { version = "1", optional = true, default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", optional = true, default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1", optional = true }
http = { version = "1", optional = true }
flate2 = { version = "1", optional = true, default-features = false, features = ["rust_backend", "runtime_detection"] }
lz4_flex = { version = "0.14", optional = true }
snap = { version = "1", optional = true }
zstd-rs = { version = "=0.1.0", optional = true }
zeroize = { version = "1.9", optional = true, default-features = false, features = ["alloc"] }
base64 = { version = "0.23", optional = true }
hmac = { version = "0.13", optional = true, features = ["zeroize"] }
pbkdf2 = { version = "0.13", optional = true, default-features = false, features = ["hmac"] }
sha2 = { version = "0.11", optional = true, features = ["zeroize"] }
bytes = "1"
crc32c = "0.6"
getrandom = "0.4"
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
