[package]
name = "partitionline-compaction-peer"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace]

[features]
default = ["partitionline/zlib-rs"]
tracing = ["partitionline/tracing"]

[dependencies]
partitionline = { path = "../../../../../../..", default-features = false }
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"
unused_results = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
