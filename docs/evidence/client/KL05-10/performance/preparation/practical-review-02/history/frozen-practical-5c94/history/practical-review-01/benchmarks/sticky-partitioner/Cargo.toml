[package]
name = "partitionline-sticky-benchmark"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

# Standalone adopter: this does not change partitionline's dependencies/workspace.
[workspace]

[features]
default = []
tracing = ["partitionline/tracing"]

[dependencies]
partitionline = { path = "../.." }
bytes = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
sha2 = "=0.11.0"
serde_json = "=1.0.149"
