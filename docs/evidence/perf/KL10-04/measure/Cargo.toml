[package]
name = "kl10-04-measure"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"
description = "KL10-04 gzip feed-overhead measurements (analysis only)"

[workspace]

[dependencies]
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["runtime_detection"] }
partitionline = { path = "../../../../../", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["zlib-rs"]
zlib-rs = ["partitionline/zlib-rs", "flate2/zlib-rs"]
miniz = ["flate2/rust_backend"]

[lints.clippy]
disallowed_methods = "allow"
disallowed_types = "allow"
