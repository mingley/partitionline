[package]
name = "partitionline-live-schema-kafka"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
apache-avro = { version = "=0.22.0", default-features = false }
partitionline = { path = "../../.." }
partitionline-schema = { path = "../..", features = ["avro"] }
serde_json = "1"
tokio = { version = "1.53.3", default-features = false, features = ["macros", "rt"] }

[[test]]
name = "avro_roundtrip"
path = "avro_roundtrip.rs"
