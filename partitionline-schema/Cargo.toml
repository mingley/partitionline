[package]
name = "partitionline-schema"
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "Schema Registry lookups and Confluent-compatible schema framing for Kafka."
readme = "README.md"
publish = false
keywords = ["kafka", "schema-registry", "confluent"]
categories = ["encoding", "network-programming"]

[features]
default = ["registry"]
# Explicit schema selection and bounded Avro framing/codec contract. The
# application supplies its serialization library; this feature adds no deps.
avro = []
# Versioned Draft 2020-12 profile and bounded JSON Schema framing/codec
# contract; validation and serialization are caller-selected, with no deps.
json-schema = []
# Bounded Schema Registry lookup client (GET-only HTTP/1.1 over tokio +
# rustls with webpki roots). It is a default feature so the card's plain
# `cargo test` exercises it, and stays optional so
# `default-features = false` keeps the dep-free wire-framing core.
# This companion does not depend on the core client crate.
registry = [
    "dep:base64",
    "dep:rustls",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:webpki-roots",
]

[dependencies]
# Wire framing needs no dependencies. Registry lookups use Tokio and rustls.
base64 = { version = "0.22", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio = { version = "1", default-features = false, features = ["io-util", "net", "time", "sync"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
# Test runtime only; the library itself needs no executor macros.
# (`sync` for tokio::sync::Mutex in the mock harness: the repo clippy.toml
# forbids std::sync::Mutex anywhere clippy runs, tests included.)
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "test-util"] }

# Selected production codec for offline conformance tests only. It is not
# selected by the library's avro feature or added to its runtime graph.
apache-avro = { version = "=0.22.0", default-features = false }
serde_json = "1"
# Explicit offline Draft 2020-12 validator in conformance tests only.
jsonschema = { version = "=0.33.0", default-features = false }
