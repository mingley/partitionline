[package]
name = "partitionline-rust-rdkafka-peer"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"
description = "Isolated benchmark-only rust-rdkafka comparison driver"

[workspace]

[dependencies]
rdkafka = { version = "=0.39.0", default-features = false, features = ["dynamic-linking"] }
# Lock records 4.10.0+2.12.1 (binding headers), not the actual dynamic library.
rdkafka-sys = { version = "=4.10.0", default-features = false, features = ["dynamic-linking"] }
futures-executor = "=0.3.31"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
