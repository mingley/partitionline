[package]
name = "codec"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[dependencies]
partitionline = { version = "0.1.0", path = "../.." }
bytes = "1"
serde_json = "1"
sha2 = "0.10"
crc32c = "0.6"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "codec"
harness = false

[[bin]]
name = "codec-preflight"
path = "src/main.rs"

[lints.clippy]
# Sync-only bench harness: no async runtime exists here, so the workspace's
# async-oriented disallowed lists (picked up from the root clippy.toml)
# do not apply. Explicit allow beats the config-implied enable.
disallowed_methods = "allow"
disallowed_types = "allow"
