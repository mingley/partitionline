name: Read retained Admin slot-index mock samples
on:
  push:
    branches: [qualification/admin-dtp-slot-readout-20261108]
permissions:
  contents: read
  actions: read
jobs:
  readout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify original retained artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13620353243" > "$RUNNER_TEMP/slot-metadata.json"
          python3 - "$RUNNER_TEMP/slot-metadata.json" <<'PY'
          import json, sys
          a=json.load(open(sys.argv[1]))
          assert a['id'] == 13620353243
          assert a['name'] == 'admin-slot-index-paired-mock'
          assert a['workflow_run']['id'] == 42488154421
          assert a['workflow_run']['head_sha'] == 'a0e5d97bcd0f850d846cb0c88d5575f5b6203763'
          assert a['digest'] == 'sha256:7ce6c0e4954891bb54ab1d2fa680088d8d1f09190fb61734180d4b74f8a563e0'
          assert not a['expired']
          print(json.dumps({'artifact_id':a['id'],'run_id':a['workflow_run']['id'],'digest':a['digest']}))
          PY
      - name: Download only that retained artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: 13620353243
          run-id: 42488154421
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/slot-index-retained
          digest-mismatch: error
      - name: Verify binary pins and print retained sample data
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/slot-index-retained" <<'PY'
          import csv, collections, statistics, sys
          from pathlib import Path
          p=Path(sys.argv[1])
          assert p.joinpath('baseline.binary-sha256').read_text().split()[0] == '8c42a6bc0cec63df2b7d89dbcb254082dd1eed15de56dcfca2375a73ff2579b1'
          assert p.joinpath('candidate.binary-sha256').read_text().split()[0] == '17103bf438c7c3783471ead48f7548ad39b0d49167bc201682536a540f0dd309'
          data=list(csv.DictReader(p.joinpath('samples.csv').open()))
          assert len(data) == 384
          by_case=collections.defaultdict(dict)
          for r in data:
              key=(r['kind'], int(r['count']), int(r['unique']), int(r['iteration']))
              assert r['arm'] in ('baseline','candidate')
              assert r['arm'] not in by_case[key]
              by_case[key][r['arm']]=r
          assert all(set(v) == {'baseline','candidate'} for v in by_case.values())
          groups=collections.defaultdict(list)
          for (kind, count, unique, iteration), v in by_case.items():
              groups[kind,count,unique].append(v)
          assert len(groups)==20 and len(by_case)==192
          for key, pairs in sorted(groups.items()):
              ratios=[int(p['candidate']['total_ns'])/int(p['baseline']['total_ns']) for p in pairs]
              print('PAIR_DISTRIBUTION',*key,'n=',len(pairs),'min=',min(ratios),'median=',statistics.median(ratios),'max=',max(ratios))
          print('SLOT_SAMPLES_BEGIN')
          print(p.joinpath('samples.csv').read_text(), end='')
          print('SLOT_SAMPLES_END')
          PY
