name: Admin reservation same-lock growth comparison
on:
  push:
    branches: [qualification/admin-reservation-growth-20261108]
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          path: variant
      - uses: actions/checkout@v7
        with:
          ref: 28c779958274adf7101312be911bbe2f9b9e2574
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: de152e78ca6d85e6cd4ea5915058b2bb6141cf42
          path: baseline
      - name: Build the three sources with the same dependency lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admin-growth-evidence"
          rustc --version
          cargo --version
          uname -a
          lscpu
          sha256sum variant/qualification/admin-reservation/driver.rs variant/src/protocol/admin.rs candidate/src/protocol/admin.rs baseline/src/protocol/admin.rs
          for arm in baseline candidate variant; do
            git -C "$arm" rev-parse HEAD
            mkdir -p "$RUNNER_TEMP/growth-$arm/src"
            cp variant/qualification/admin-reservation/driver.rs "$RUNNER_TEMP/growth-$arm/src/main.rs"
            cat > "$RUNNER_TEMP/growth-$arm/Cargo.toml" <<EOF
          [package]
          name = "admin-reservation-probe"
          version = "0.0.0"
          edition = "2021"
          [workspace]
          [dependencies]
          partitionline = { path = "$GITHUB_WORKSPACE/$arm" }
          bytes = "1"
          tokio = { version = "1", features = ["rt", "net", "time"] }
          EOF
            if [ "$arm" = baseline ]; then
              cp baseline/Cargo.lock "$RUNNER_TEMP/growth-$arm/Cargo.lock"
              CARGO_TARGET_DIR="$RUNNER_TEMP/growth-target-$arm" cargo build --release --manifest-path "$RUNNER_TEMP/growth-$arm/Cargo.toml"
            else
              cp "$RUNNER_TEMP/growth-baseline/Cargo.lock" "$RUNNER_TEMP/growth-$arm/Cargo.lock"
              CARGO_TARGET_DIR="$RUNNER_TEMP/growth-target-$arm" cargo build --locked --release --manifest-path "$RUNNER_TEMP/growth-$arm/Cargo.toml"
            fi
            cp "$RUNNER_TEMP/growth-$arm/Cargo.lock" "$RUNNER_TEMP/admin-growth-evidence/$arm-Cargo.lock"
            cargo tree --locked --manifest-path "$RUNNER_TEMP/growth-$arm/Cargo.toml" > "$RUNNER_TEMP/admin-growth-evidence/$arm-tree.txt"
            cp "$RUNNER_TEMP/growth-target-$arm/release/admin-reservation-probe" "$RUNNER_TEMP/growth-$arm-bin"
            sha256sum "$RUNNER_TEMP/growth-$arm-bin"
          done
          cmp "$RUNNER_TEMP/admin-growth-evidence/baseline-Cargo.lock" "$RUNNER_TEMP/admin-growth-evidence/candidate-Cargo.lock"
          cmp "$RUNNER_TEMP/admin-growth-evidence/baseline-Cargo.lock" "$RUNNER_TEMP/admin-growth-evidence/variant-Cargo.lock"
      - name: Compare allocation and semantics
        shell: bash
        run: |
          set -euo pipefail
          for arm in baseline candidate variant; do
            "$RUNNER_TEMP/growth-$arm-bin" witness > "$RUNNER_TEMP/admin-growth-evidence/$arm-witness.txt"
            "$RUNNER_TEMP/growth-$arm-bin" valid-allocs | tee "$RUNNER_TEMP/admin-growth-evidence/$arm-allocations.txt"
            "$RUNNER_TEMP/growth-$arm-bin" corpus > "$RUNNER_TEMP/admin-growth-evidence/$arm-corpus.txt"
          done
          for arm in candidate variant; do
            diff -u "$RUNNER_TEMP/admin-growth-evidence/baseline-corpus.txt" "$RUNNER_TEMP/admin-growth-evidence/$arm-corpus.txt"
            python3 variant/qualification/admin-reservation/check_witness.py "$RUNNER_TEMP/admin-growth-evidence/baseline-witness.txt" "$RUNNER_TEMP/admin-growth-evidence/$arm-witness.txt"
            python3 variant/qualification/admin-reservation/check_valid.py "$RUNNER_TEMP/admin-growth-evidence/baseline-allocations.txt" "$RUNNER_TEMP/admin-growth-evidence/$arm-allocations.txt"
          done
      - name: Paired valid-response timings
        shell: bash
        run: |
          set -euo pipefail
          cpu="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          echo "Pinned logical CPU: $cpu"
          for pair in $(seq 0 7); do
            case "$((pair % 3))" in
              0) order=(baseline candidate variant) ;;
              1) order=(variant baseline candidate) ;;
              2) order=(candidate variant baseline) ;;
            esac
            for arm in "${order[@]}"; do
              taskset -c "$cpu" "$RUNNER_TEMP/growth-$arm-bin" bench > "$RUNNER_TEMP/admin-growth-evidence/bench-$pair-$arm.txt"
            done
          done
          python3 variant/qualification/admin-reservation/summarize_three.py "$RUNNER_TEMP/admin-growth-evidence" | tee "$RUNNER_TEMP/admin-growth-evidence/bench-summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-growth-evidence
          path: ${{ runner.temp }}/admin-growth-evidence/
          if-no-files-found: warn
