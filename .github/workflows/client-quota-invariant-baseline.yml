name: Client quota structural invariant baseline
on:
  push:
    branches: [qualification/client-quota-invariant-baseline-20261110]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Control-field corruption baseline
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib internal_control_corruption_fails_every_client_bucket_closed -- --nocapture
      - name: Missing charge size baseline
        if: always()
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib missing_charge_length_fails_every_client_bucket_closed -- --nocapture
