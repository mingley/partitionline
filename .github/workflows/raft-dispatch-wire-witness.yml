name: raft dispatch loopback witness
on:
  push:
    branches: [qual/raft-dispatch-wire-20261108]
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Baseline does not deliver current votes while cancellation blocks
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/wire-base" 4b6c15658c9d3b22a82dd8efd804875cc5ccaf62
          cd "$RUNNER_TEMP/wire-base"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/wire-base-target"
          set +e
          cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib raft::runtime::ownership_tests::live_peers_receive_current_votes_while_old_cancellation_waits -- --exact --nocapture > "$RUNNER_TEMP/wire-base.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/wire-base.log"
          test "$status" -eq 101
          grep -F 'test raft::runtime::ownership_tests::live_peers_receive_current_votes_while_old_cancellation_waits ... FAILED' "$RUNNER_TEMP/wire-base.log"
      - name: Candidate live peer controls
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/wire-candidate-target
        run: |
          set -euo pipefail
          rustc -Vv
          sha256sum partitionline-broker/src/raft/runtime.rs
          for feature in default all; do
            flags=()
            if [ "$feature" = all ]; then flags=(--all-features); fi
            cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib "${flags[@]}" raft::runtime::ownership_tests::live_peers_receive_current_votes_while_old_cancellation_waits -- --exact --nocapture
          done
