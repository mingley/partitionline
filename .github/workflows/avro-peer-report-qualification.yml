name: Avro peer report qualification

on:
  push:
    branches: [qualification/avro-peer-report-20261120]

permissions:
  contents: read

jobs:
  peer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        profile: [default, all]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify Rust and pinned Java frames
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          git rev-parse HEAD
          rustc -Vv
          mkdir -p target/avro-peer-check
          export PL_AVRO_SELECTED_OUTPUT="$GITHUB_WORKSPACE/target/avro-peer-check/rust"
          features=(--features avro,json-schema)
          if [[ "$PROFILE" == all ]]; then features=(--all-features); fi
          cargo test --locked --manifest-path partitionline-schema/Cargo.toml "${features[@]}" \
            --test avro_selected_codec_conformance 2>&1 | tee target/avro-peer-check/rust.log
          python3 -B tests/conformance/run-avro-selected-codec.py \
            --rust-output "$PL_AVRO_SELECTED_OUTPUT" --peer-cache target/avro-peer-check/jars \
            --report target/avro-peer-check/peer.json
      - name: Retain the independent peer report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: avro-peer-${{ matrix.profile }}
          path: |
            target/avro-peer-check/peer.json
            target/avro-peer-check/rust.log
            target/avro-peer-check/rust/
          if-no-files-found: error
          retention-days: 30
