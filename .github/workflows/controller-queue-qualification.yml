name: broker controller queue qualification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/controller-queue-qualification.yml
      - docs/evidence/broker/controller-queue-capacity-candidate-20261103/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broker-controller-queue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: controller queue (stable, Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 260
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Initialize evidence and check disk
        timeout-minutes: 2
        run: |
          printf 'CARGO_HOME=%s/controller-queue-cargo-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/controller-queue-bootstrap"
          python3 -B - <<'PY' > "$RUNNER_TEMP/controller-queue-bootstrap/preflight.log" 2>&1
          import os, platform, shutil
          floor = 1536 * 1024**2
          free = shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          print('platform:', platform.platform(), 'machine:', platform.machine(), 'free bytes:', free, flush=True)
          if platform.machine() != 'x86_64' or free <= floor + 128 * 1024**2:
              raise SystemExit('host or disk preflight failed')
          PY
      - uses: actions/checkout@v7
        timeout-minutes: 15
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: docs/evidence/broker/controller-queue-capacity-candidate-20261103
          sparse-checkout-cone-mode: true
      - name: Check space after sparse checkout
        timeout-minutes: 2
        run: |
          python3 -B - <<'PY'
          import os, shutil
          free = shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          print('free bytes after checkout:', free)
          if free <= 1536 * 1024**2 + 128 * 1024**2:
              raise SystemExit('insufficient disk after checkout')
          PY
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 15
        with:
          components: rustfmt, clippy
      - name: Verify capsule and source-only controls
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib, os, shutil
          from pathlib import Path
          if shutil.disk_usage(os.environ['RUNNER_TEMP']).free <= 1536 * 1024**2 + 128 * 1024**2:
              raise SystemExit('insufficient disk after toolchain setup')
          root = Path(os.environ['GITHUB_WORKSPACE'])
          relative = Path('docs/evidence/broker/controller-queue-capacity-candidate-20261103')
          current = root
          for component in relative.parts:
              current = current/component
              if current.is_symlink() or not current.is_dir():
                  raise SystemExit('unsafe capsule path')
          pins = {
              'qualify.py': '66eca0e0f991c32ea0ce349fd8500193ddcc8076e88814a1dd5043e31777e3ea',
              'test-static.py': '423843adee409cdf6676d46096ab4a03e3ee3cacf31186c2d1b7c8b5566cf740',
              'spec.json': '3ee391a2802ac8620f30496ca138026453b620231e55e1a48fe7a61ec0fc80de',
          }
          for name, expected in pins.items():
              path = current/name
              if path.is_symlink() or not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                  raise SystemExit('capsule pin mismatch: '+name)
          print('capsule driver, static controls and specification verified')
          PY
          python3 -B docs/evidence/broker/controller-queue-capacity-candidate-20261103/test-static.py 2>&1 | tee "$RUNNER_TEMP/controller-queue-bootstrap/static.log"
      - name: Qualify pinned broker source
        timeout-minutes: 180
        run: |
          python3 -B docs/evidence/broker/controller-queue-capacity-candidate-20261103/qualify.py --output "$RUNNER_TEMP/controller-queue-qualification"
      - name: Retain reports, logs and inputs
        timeout-minutes: 20
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controller-queue-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/controller-queue-bootstrap/**
            ${{ runner.temp }}/controller-queue-qualification/*.json
            ${{ runner.temp }}/controller-queue-qualification/*.log
            ${{ runner.temp }}/controller-queue-qualification/assets/**
          if-no-files-found: error
          retention-days: 30
