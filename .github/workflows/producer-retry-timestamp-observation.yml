name: producer-retry-timestamp-observation
on:
  push:
    branches: [qual/producer-retry-timestamp-20261108]
jobs:
  mock-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [default, all]
    env:
      PL_PROFILE: ${{ matrix.profile }}
      RUSTFLAGS: '--cfg producer_timestamp_witness --check-cfg=cfg(producer_timestamp_witness)'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Source and runner identity
        run: |
          git rev-parse HEAD
          sha256sum src/producer.rs tests/common/mod.rs tests/producer_retry_timestamp_public.rs Cargo.lock
          rustc -Vv
          lscpu
      - name: Compare implicit and explicit record timestamps
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$PL_PROFILE" == all ]]; then args=(--all-features); fi
          cargo test --locked --test producer_retry_timestamp_public "${args[@]}" producer_retry_timestamp_observation -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/history.log"
          grep -F "TIMESTAMP_IMPLICIT original=" "$RUNNER_TEMP/history.log"
          grep -F "TIMESTAMP_EXPLICIT original=1234567 retry=1234567 receipt=1234567 log=1234567" "$RUNNER_TEMP/history.log"
      - name: Diagnostic source formatting
        if: always()
        shell: bash
        run: |
          if ! rustfmt --edition=2021 --check tests/common/mod.rs tests/producer_retry_timestamp_public.rs; then
            echo "Diagnostic only: strict formatting did not pass."
          fi
