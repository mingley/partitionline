name: Client-label Produce quota candidate
on:
  push:
    branches: [qualification/client-label-quota-20261110]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: rustc --version && git rev-parse HEAD
      - name: Default meter controls
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib metadata::bandwidth::tests -- --nocapture
      - name: Default actor accounting
        if: always()
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib quota_accounting_tests -- --nocapture
      - name: Default public quota controls
        if: always()
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --test produce_quota -- --nocapture
      - name: All-feature meter controls
        if: always()
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-features --lib metadata::bandwidth::tests -- --nocapture
      - name: All-feature actor accounting
        if: always()
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-features --lib quota_accounting_tests -- --nocapture
      - name: All-feature public quota controls
        if: always()
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-features --test produce_quota -- --nocapture
      - name: Existing authenticated quota control
        if: always()
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-features --test sasl_sessions quota_sasl_authenticated_mute_and_expiry -- --exact
      - name: Format
        if: always()
        run: cargo fmt --manifest-path partitionline-broker/Cargo.toml -- --check
      - name: Clippy
        if: always()
        run: cargo clippy --locked --manifest-path partitionline-broker/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Rustdoc
        if: always()
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --manifest-path partitionline-broker/Cargo.toml --all-features --no-deps
      - name: Formatting patch
        if: failure()
        run: |
          cargo fmt --manifest-path partitionline-broker/Cargo.toml
          git diff -- partitionline-broker/src/metadata.rs partitionline-broker/src/metadata/bandwidth.rs partitionline-broker/tests/produce_quota.rs
  full-behavior:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Default all targets
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-targets
      - name: All-feature all targets
        if: always()
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-targets --all-features
