name: Candidate client quota wire observation
on:
  push:
    branches: [qualification/client-quota-wire-20261110]
permissions:
  contents: read
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the isolated server
        run: |
          rustc --version
          CARGO_TARGET_DIR="$RUNNER_TEMP/quota-target" cargo build --locked --manifest-path partitionline-broker/Cargo.toml --example quota_client_wire
      - name: Run the same client-ID wire scenarios
        run: |
          set -euo pipefail
          ready_file="$RUNNER_TEMP/quota-ready"
          log_file="$RUNNER_TEMP/quota-server.log"
          QUOTA_READY_FILE="$ready_file" "$RUNNER_TEMP/quota-target/debug/examples/quota_client_wire" >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill -INT "$server_pid" 2>/dev/null || true
            for i in $(seq 1 50); do
              if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
              sleep 0.1
            done
            kill -KILL "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 100); do
            if test -s "$ready_file"; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$log_file"; exit 1; fi
            sleep 0.1
          done
          test -s "$ready_file"
          python3 -u qualification/produce-quota-isolation-live.py
          kill -INT "$server_pid"
          for i in $(seq 1 100); do
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 0.1
          done
          if kill -0 "$server_pid" 2>/dev/null; then
            cat "$log_file"
            exit 1
          fi
          wait "$server_pid"
          trap - EXIT
      - name: Show server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/quota-server.log" || true
