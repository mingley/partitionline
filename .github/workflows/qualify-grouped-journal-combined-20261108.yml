name: grouped-journal-and-records-qualification
on:
  push:
    branches: [qualification/grouped-journal-combined-20261108]
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        profile: [default, all]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Source and machine
        run: |
          rustc -Vv
          uname -a
          sha256sum partitionline-broker/src/journal.rs
      - name: Reproduce baseline capacity defect
        shell: bash
        run: |
          git show 1b6d49cc3ad989bd57311e3950d327e01ddc02ae:partitionline-broker/src/journal.rs > partitionline-broker/src/journal.rs
          set +e
          if [ '${{ matrix.profile }}' = all ]; then feature=--all-features; else feature=; fi
          cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib $feature grouped_preallocates_index_for_all_staged_writes -- --nocapture > "$RUNNER_TEMP/baseline.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/baseline.log"
          test "$status" -eq 101
          grep -q 'index capacity 1 is below 2 committed and staged entries' "$RUNNER_TEMP/baseline.log"
          git checkout HEAD -- partitionline-broker/src/journal.rs
      - name: Candidate reservations, rollback and file recovery
        shell: bash
        run: |
          if [ '${{ matrix.profile }}' = all ]; then feature=--all-features; else feature=; fi
          cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib $feature grouped_preallocates_index_for_all_staged_writes -- --nocapture
          cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib $feature grouped_reservation_failures_leave_prior_stage_intact -- --nocapture
          cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib $feature grouped_capacity_limit_rejects_before_write -- --nocapture
          cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib $feature grouped_rollback_then_sync_preserves_committed_file_order -- --nocapture
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --manifest-path partitionline-broker/Cargo.toml -- --check
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path partitionline-broker/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Strict Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --manifest-path partitionline-broker/Cargo.toml --all-features --no-deps
      - name: Strict doctests
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo test --locked --manifest-path partitionline-broker/Cargo.toml --doc
          cargo test --locked --manifest-path partitionline-broker/Cargo.toml --doc --all-features
  suites:
    strategy:
      fail-fast: false
      matrix:
        profile: [default, all]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Full broker targets
        shell: bash
        run: |
          if [ '${{ matrix.profile }}' = all ]; then feature=--all-features; else feature=; fi
          cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-targets $feature
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 -B scripts/check-broker-api-matrix.py --report target/broker-ci/api-matrix.json
      - run: python3 -B -m unittest discover -s tests/ci -p test_broker_api_matrix.py -v
