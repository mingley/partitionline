name: Broker exact frame read qualification
on:
  push:
    branches: [qualification/broker-frame-read-exact-gate-20261108]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact committed source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0a4c241a44f85bc47121b62fb67a6048d8b3f1fa"
          test "$(git rev-parse HEAD:partitionline-broker/src/transport.rs)" = "a36cf086c3d683a5f24b818705b15d8ce54245f4"
          test "$(git hash-object partitionline-broker/src/transport.rs)" = "a36cf086c3d683a5f24b818705b15d8ce54245f4"
          cp partitionline-broker/src/transport.rs /tmp/frame-clean.rs
      - name: Ready-reader, deadline, and real-TCP controls
        run: |
          set -euo pipefail
          rustc --version
          for features in default all; do
            args=()
            if [[ "$features" == all ]]; then args=(--all-features); fi
            for case in ready_frame_body_yields_on_byte_and_read_count_limits exact_read_limits_do_not_add_final_scheduling_turns small_ready_frames_finish_without_a_forced_yield ready_partial_frames_complete_with_exact_bytes expired_buffered_deadline_does_not_poll_reader fragmented_prefetched_prefix_reassembles_on_real_tcp read_deadline_stops_a_ready_frame_body ready_body_yields_before_complete; do
              cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib "${args[@]}" "$case" -- --nocapture
            done
          done
      - name: No buffered yield mutant
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("partitionline-broker/src/transport.rs")
          s=p.read_text()
          old="if progress.record(n).is_some()"
          assert s.count(old)==1
          p.write_text(s.replace(old, "if false && progress.record(n).is_some()", 1))
          PY
          if cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib ready_frame_body_yields_on_byte_and_read_count_limits -- --nocapture > /tmp/frame-no-buffered-yield.log 2>&1; then cat /tmp/frame-no-buffered-yield.log; exit 1; fi
          cat /tmp/frame-no-buffered-yield.log
          grep -F "buffered ready body completed without yielding" /tmp/frame-no-buffered-yield.log
          cp /tmp/frame-clean.rs partitionline-broker/src/transport.rs
      - name: No read-count bound mutant
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("partitionline-broker/src/transport.rs")
          s=p.read_text()
          old="} else if self.calls >= 128 {"
          assert s.count(old)==1
          p.write_text(s.replace(old, "} else if false {", 1))
          PY
          if cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib ready_frame_body_yields_on_byte_and_read_count_limits -- --nocapture > /tmp/frame-no-read-count.log 2>&1; then cat /tmp/frame-no-read-count.log; exit 1; fi
          cat /tmp/frame-no-read-count.log
          grep -F "fragmented direct body completed without yielding" /tmp/frame-no-read-count.log
          cp /tmp/frame-clean.rs partitionline-broker/src/transport.rs
      - name: Unnecessary buffered final yield mutant
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("partitionline-broker/src/transport.rs")
          s=p.read_text()
          old="&& matches!(\n                    classify_ahead(ahead.pending(), config.max_request_bytes),\n                    Ahead::Need(_)\n                )"
          assert s.count(old)==1
          p.write_text(s.replace(old, "&& true", 1))
          PY
          if cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib exact_read_limits_do_not_add_final_scheduling_turns -- --nocapture > /tmp/frame-final-buffered-mutant.log 2>&1; then cat /tmp/frame-final-buffered-mutant.log; exit 1; fi
          cat /tmp/frame-final-buffered-mutant.log
          grep -F "complete buffered 64 KiB frame acquired a new yield" /tmp/frame-final-buffered-mutant.log
          cp /tmp/frame-clean.rs partitionline-broker/src/transport.rs
      - name: Unnecessary direct final yield mutant
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("partitionline-broker/src/transport.rs")
          s=p.read_text()
          old="Some(ReadLimit::Calls) if payload.len() < length"
          assert s.count(old)==1
          p.write_text(s.replace(old, "Some(ReadLimit::Calls) if true", 1))
          PY
          if cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib exact_read_limits_do_not_add_final_scheduling_turns -- --nocapture > /tmp/frame-final-direct-mutant.log 2>&1; then cat /tmp/frame-final-direct-mutant.log; exit 1; fi
          cat /tmp/frame-final-direct-mutant.log
          grep -F "complete 128-read direct frame acquired a new yield" /tmp/frame-final-direct-mutant.log
          cp /tmp/frame-clean.rs partitionline-broker/src/transport.rs
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check exact source, format and strict broker documentation and lint
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0a4c241a44f85bc47121b62fb67a6048d8b3f1fa"
          test "$(git rev-parse HEAD:partitionline-broker/src/transport.rs)" = "a36cf086c3d683a5f24b818705b15d8ce54245f4"
          test "$(git hash-object partitionline-broker/src/transport.rs)" = "a36cf086c3d683a5f24b818705b15d8ce54245f4"
          rustc -Vv
          cargo fmt --manifest-path partitionline-broker/Cargo.toml -- --check
          cargo clippy --locked --manifest-path partitionline-broker/Cargo.toml --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --manifest-path partitionline-broker/Cargo.toml --all-features --no-deps
          RUSTDOCFLAGS="-D warnings" cargo test --locked --manifest-path partitionline-broker/Cargo.toml --doc
          RUSTDOCFLAGS="-D warnings" cargo test --locked --manifest-path partitionline-broker/Cargo.toml --doc --all-features
  broker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [default, all]
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run full broker test profile on exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0a4c241a44f85bc47121b62fb67a6048d8b3f1fa"
          test "$(git rev-parse HEAD:partitionline-broker/src/transport.rs)" = "a36cf086c3d683a5f24b818705b15d8ce54245f4"
          test "$(git hash-object partitionline-broker/src/transport.rs)" = "a36cf086c3d683a5f24b818705b15d8ce54245f4"
          rustc -Vv
          openssl version
          args=()
          if [[ "${{ matrix.profile }}" == all ]]; then args=(--all-features); fi
          cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-targets "${args[@]}"
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Verify inventory and negative controls
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0a4c241a44f85bc47121b62fb67a6048d8b3f1fa"
          test "$(git rev-parse HEAD:partitionline-broker/src/transport.rs)" = "a36cf086c3d683a5f24b818705b15d8ce54245f4"
          python3 -B scripts/check-broker-api-matrix.py --report target/broker-ci/api-matrix.json
          python3 -B -m unittest discover -s tests/ci -p test_broker_api_matrix.py -v
