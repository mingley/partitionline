name: Raft observation witness

on:
  push:
    branches: [qualification/raft-observation-witness-20261108]

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check source and host
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          git merge-base --is-ancestor b631809f0e03ba6f65f808e51d8e47e3fd9380d1 HEAD
          rustc +stable --version --verbose
          cargo +stable --version
          sha256sum partitionline-broker/tests/raft_membership.rs partitionline-broker/src/raft/replication.rs partitionline-broker/tests/common/raft_runtime.rs
      - name: Reproduce higher-term fencing and checkpoint barrier
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/raft-observation"
          for mode in default all; do
            flags=()
            if [[ "$mode" == all ]]; then flags=(--all-features); fi
            log="$RUNNER_TEMP/raft-observation/$mode.log"
            timeout 300 cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml "${flags[@]}" --test raft_membership higher_term_fences_stale_writer_and_checkpoint_includes_new_barrier -- --exact --nocapture 2>&1 | tee "$log"
            grep -F 'RAFT_STALE_LEADER_FENCED last_data=3 new_barrier=4 checkpoint_base=4' "$log"
            grep -F 'test result: ok. 1 passed; 0 failed;' "$log"
            timeout 300 cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml "${flags[@]}" --test raft_membership stale_genesis_leader_observation_is_fenced_before_proposal_append -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/raft-observation/$mode-existing.log"
            grep -F 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/raft-observation/$mode-existing.log"
          done
      - name: Format
        run: cargo +stable fmt --manifest-path partitionline-broker/Cargo.toml -- --check
      - name: Strict all-target Clippy
        run: cargo +stable clippy --locked --manifest-path partitionline-broker/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Retain witness logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raft-observation-${{ github.sha }}
          path: ${{ runner.temp }}/raft-observation
          if-no-files-found: warn
          retention-days: 30
