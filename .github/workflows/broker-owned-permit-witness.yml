name: broker owned permit controls
on:
  push:
    branches:
      - qualification/broker-owned-permit-witness-20261108
permissions:
  contents: read
jobs:
  witness:
    strategy:
      fail-fast: false
      matrix:
        profile: [default, all-features]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact sources and negative controls
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/owned-witness"
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD^)" = 6d1b06c1d5ea58393243086406b764b3d619793c
          rustc +stable --version --verbose | tee "$RUNNER_TEMP/owned-witness/toolchain.log"
          flags=()
          if [ "$PROFILE" = all-features ]; then flags+=(--all-features); fi
          for mode in baseline lease completion batch; do
            case "$mode" in
              baseline)
                test_name=metadata::tests::canceled_claimed_fetch_keeps_admission_until_actor_discards_it
                marker=PL_ACTOR_PERMIT_RELEASED_EARLY
                ;;
              lease)
                test_name=metadata::tests::canceling_a_waiting_lease_drops_buffers_before_its_permit
                marker=PL_WAIT_PERMIT_RELEASED_BEFORE_BUFFERS
                ;;
              completion)
                test_name=metadata::tests::completion_drops_response_and_buffers_before_its_permit
                marker=PL_COMPLETION_PERMIT_RELEASED_BEFORE_BUFFERS
                ;;
              batch)
                test_name=metadata::tests::grouped_buffers_drop_before_permits_during_unwind
                marker=PL_BATCH_PERMIT_RELEASED_BEFORE_BUFFERS
                ;;
            esac
            python3 -B .github/scripts/owned-permit-witness.py "$mode"
            log="$RUNNER_TEMP/owned-witness/$mode.log"
            set +e
            timeout 300s cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml "${flags[@]}" --lib "$test_name" -- --exact --nocapture > "$log" 2>&1
            code=$?
            set -e
            cat "$log"
            test "$code" -ne 0
            test "$code" -ne 124
            grep -F 'running 1 test' "$log"
            grep -F 'test result: FAILED. 0 passed; 1 failed;' "$log"
            grep -F "$marker" "$log"
            if [ "$mode" = baseline ]; then
              grep -F 'PL_ACTOR_CLAIM len=4096 capacity=' "$log"
            fi
          done
          python3 -B .github/scripts/owned-permit-witness.py restore
          git diff --exit-code -- partitionline-broker/src/metadata.rs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: broker-owned-witness-${{ matrix.profile }}-${{ github.sha }}
          path: ${{ runner.temp }}/owned-witness
          if-no-files-found: warn
          retention-days: 30
