name: qualify Create response diagnostic
on:
  push:
    branches: [qualification/create-response-combined-20261108]
permissions:
  contents: read
jobs:
  parser-controls:
    strategy:
      fail-fast: false
      matrix:
        profile: [default, all-features]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact source and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/create-response"
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD^)" = 6f6d8e9bc4f111fc5e4230eb5cec261b052fd154
          printf '%s  %s\n' 2e2dbcbcb13c192d747094d8d262d2f8f9fedf4308ce6e15c0e9b4d77788e261 partitionline-broker/tests/operator_quorum.rs | sha256sum -c -
          rustc +stable --version --verbose | tee "$RUNNER_TEMP/create-response/toolchain.log"
      - name: Synthetic Create v3 response parsing
        id: real
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [ "$PROFILE" = all-features ]; then flags+=(--all-features); fi
          log="$RUNNER_TEMP/create-response/parser.log"
          timeout 300s cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml "${flags[@]}" --test operator_quorum create_error_message_decodes_v3_failure -- --exact --nocapture > "$log" 2>&1 || { cat "$log"; exit 1; }
          cat "$log"
          grep -F 'test create_error_message_decodes_v3_failure ... ok' "$log"
          grep -F 'test result: ok. 1 passed;' "$log"
      - name: Synthetic message-loss mutation
        id: mutant
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [ "$PROFILE" = all-features ]; then flags+=(--all-features); fi
          trap 'git checkout -- partitionline-broker/tests/operator_quorum.rs' EXIT
          python3 -B .github/scripts/create-response-mutation.py
          log="$RUNNER_TEMP/create-response/mutant.log"
          set +e
          timeout 300s cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml "${flags[@]}" --test operator_quorum create_error_message_decodes_v3_failure -- --exact --nocapture > "$log" 2>&1
          code=$?
          set -e
          cat "$log"
          test "$code" -ne 0
          test "$code" -ne 124
          grep -F 'running 1 test' "$log"
          grep -F 'test result: FAILED. 0 passed; 1 failed;' "$log"
          grep -F 'Some("disk")' "$log"
          git checkout -- partitionline-broker/tests/operator_quorum.rs
          git diff --exit-code -- partitionline-broker/tests/operator_quorum.rs
      - name: Require parser controls
        if: always()
        env:
          REAL: ${{ steps.real.outcome }}
          MUTANT: ${{ steps.mutant.outcome }}
        run: |
          test "$REAL" = success
          test "$MUTANT" = success
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: create-response-parser-${{ matrix.profile }}-${{ github.sha }}
          path: ${{ runner.temp }}/create-response
          if-no-files-found: warn
          retention-days: 30
  style:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        id: fmt
        continue-on-error: true
        run: cargo +stable fmt --manifest-path partitionline-broker/Cargo.toml -- --check
      - name: Strict all-target all-feature Clippy
        id: clippy
        continue-on-error: true
        run: cargo +stable clippy --locked --manifest-path partitionline-broker/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Require style gates
        if: always()
        env:
          FMT: ${{ steps.fmt.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
        run: |
          test "$FMT" = success
          test "$CLIPPY" = success
