name: capabilities

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Separate from the broad CI cancellation group; retain an in-progress proof.
concurrency:
  group: capabilities-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Isolated from unrelated all-target runtime blockers; exact source proof is
  # uploaded on failure too. Java fixture checks have their own pinned inputs.
  client-capabilities:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]
        features: [default, all-features]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact case selection negative controls
        run: |
          python3 -B -m unittest discover -s tests/ci -p test_client_capability_cases.py -v
          python3 -B -m unittest discover -s tests/ci -p test_client_capability_java.py -v
      - name: Exact selected public API and codec cases with reverse exports
        run: python3 -B scripts/ci-client-capabilities.py --toolchain '${{ matrix.rust }}' --features '${{ matrix.features }}'
      - id: proof
        name: Retain complete or failed focused proof with original Unix modes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-capabilities-${{ github.sha }}-${{ matrix.rust }}-${{ matrix.features }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/client-capabilities/${{ matrix.rust }}/${{ matrix.features }}/evidence.tar.gz
            target/client-capabilities/${{ matrix.rust }}/${{ matrix.features }}/artifact-manifest.json
          if-no-files-found: error
          retention-days: 30
      - id: report
        name: Retain small focused validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-capabilities-report-${{ github.sha }}-${{ matrix.rust }}-${{ matrix.features }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/client-capabilities/${{ matrix.rust }}/${{ matrix.features }}/evidence/validation.json
            target/client-capabilities/${{ matrix.rust }}/${{ matrix.features }}/artifact-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Record public artifact identity
        if: always() && steps.proof.outcome == 'success'
        run: |
          printf '%s\n' 'artifact_id=${{ steps.proof.outputs.artifact-id }}' 'artifact_url=${{ steps.proof.outputs.artifact-url }}' 'artifact_digest=${{ steps.proof.outputs.artifact-digest }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Record small report artifact identity
        if: always() && steps.report.outcome == 'success'
        run: |
          printf '%s\n' 'report_artifact_id=${{ steps.report.outputs.artifact-id }}' 'report_artifact_url=${{ steps.report.outputs.artifact-url }}' 'report_artifact_digest=${{ steps.report.outputs.artifact-digest }}' >> "$GITHUB_STEP_SUMMARY"
