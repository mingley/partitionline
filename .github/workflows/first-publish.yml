# First crates.io publish for partitionline 0.1.0 (owner-only) [RETIRED].
#
# Obsolete: partitionline 0.1.0 was published to crates.io on 2026-09-05.
# This workflow is retired and fails closed to prevent accidental re-runs or re-cuts.
# Historical note: first cut of a NEW crate required crates.io publish-new (+ publish-update).
# All future releases are serialized through .github/workflows/release.yml.

name: First publish (crates.io) [RETIRED]

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish to confirm (obsolete / fails closed)'
        required: false
        type: string
      ref:
        description: 'Git ref to package (obsolete / fails closed)'
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish-lock
  cancel-in-progress: false

jobs:
  retired:
    name: Obsolete publisher retired
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed
        run: |
          echo "::error::first-publish.yml is retired and obsolete." >&2
          echo "partitionline 0.1.0 was already published to crates.io on 2026-09-05; 0.1.0 must not be recut." >&2
          echo "All future releases must be serialized through .github/workflows/release.yml." >&2
          exit 1
