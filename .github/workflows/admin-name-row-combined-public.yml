name: Admin combined public row cancellation controls
on:
  push:
    branches: [qualification/admin-dtp-combined-observer-20261108]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        feature: [default, all]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin combined observer source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src/admin.rs)" = 916bdf8054e021503b92907e8c9d2229ce0767fe
          test "$(git rev-parse HEAD:src/admin/pagination_tests.rs)" = 8bafb57c478d4db087664b51ea9abb0731c948b5
          git rev-parse HEAD HEAD:src/admin.rs HEAD:src/admin/pagination_tests.rs HEAD:Cargo.lock
          sha256sum src/admin.rs src/admin/pagination_tests.rs Cargo.lock
          rustc -Vv
      - name: Run public checkpoint cancellation and timeout
        run: |
          set -euo pipefail
          if test "${{ matrix.feature }}" = all; then
            cargo test --locked --all-features --lib dtp_public_checkpoint_ -- --test-threads=1
          else
            cargo test --locked --lib dtp_public_checkpoint_ -- --test-threads=1
          fi
      - name: Recheck cancellation during name mismatch scan
        run: |
          set -euo pipefail
          if test "${{ matrix.feature }}" = all; then
            cargo test --locked --all-features --lib dtp_requested_names_cancel_during_scan_keeps_socket_usable -- --test-threads=1
          else
            cargo test --locked --lib dtp_requested_names_cancel_during_scan_keeps_socket_usable -- --test-threads=1
          fi
      - name: Negative control suppressing the row yield
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/admin.rs")
          s = p.read_text()
          old = "DTP_ROW_YIELD_OBSERVER.with(|observed| observed.set(observed.get() + 1));\n            tokio::task::yield_now().await;"
          new = "DTP_ROW_YIELD_OBSERVER.with(|observed| observed.set(observed.get() + 1));\n            std::future::ready(()).await;"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          set +e
          if test "${{ matrix.feature }}" = all; then
            timeout 240 cargo test --locked --all-features --lib dtp_public_checkpoint_cancel_after_first_page_keeps_socket -- --test-threads=1 > negative.log 2>&1
          else
            timeout 240 cargo test --locked --lib dtp_public_checkpoint_cancel_after_first_page_keeps_socket -- --test-threads=1 > negative.log 2>&1
          fi
          status=$?
          set -e
          cat negative.log
          test "$status" = 101
          grep -F 'test result: FAILED. 0 passed; 1 failed;' negative.log
