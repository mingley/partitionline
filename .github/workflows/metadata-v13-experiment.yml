name: Metadata v13 Apache wire
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - qualification/metadata-v13-wire-20261109
    paths:
      - 'src/protocol/**'
      - 'src/error.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'tests/conformance/java/ConformanceMetadataWire.java'
      - 'tests/conformance/java/generate_metadata_wire.py'
      - 'tests/metadata_wire_conformance.rs'
      - '.github/workflows/metadata-v13-experiment.yml'
  pull_request:
    paths:
      - 'src/protocol/**'
      - 'src/error.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'tests/conformance/java/ConformanceMetadataWire.java'
      - 'tests/conformance/java/generate_metadata_wire.py'
      - 'tests/metadata_wire_conformance.rs'
      - '.github/workflows/metadata-v13-experiment.yml'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Record tools and source
        run: |
          rustc --version
          cargo --version
          java --version
          git rev-parse HEAD
          sha256sum tests/conformance/java/ConformanceMetadataWire.java tests/conformance/java/generate_metadata_wire.py tests/metadata_wire_conformance.rs
      - name: Compare bounded body fixtures
        run: timeout 600s python3 tests/conformance/java/generate_metadata_wire.py --output target/metadata-v13
      - name: Strict lint
        if: always()
        run: cargo clippy --locked --all-features --test metadata_wire_conformance -- -D warnings
      - name: Formatting
        if: always()
        run: cargo fmt --all -- --check
      - name: Retain fixtures and process receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-v13-${{ github.sha }}
          path: target/metadata-v13
          if-no-files-found: warn
          retention-days: 30
