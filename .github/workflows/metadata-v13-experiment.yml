name: Metadata v13 Apache wire
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - qualification/metadata-v13-wire-20261109
    paths:
      - 'src/protocol/**'
      - 'src/error.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'tests/conformance/java/ConformanceMetadataWire.java'
      - 'tests/conformance/java/generate_metadata_wire.py'
      - 'tests/metadata_wire_conformance.rs'
      - 'docs/evidence/conformance/q-conf-metadatawire/apache-pairs.txt'
      - 'docs/evidence/conformance/q-conf-metadatawire/rust-pairs.txt'
      - '.github/workflows/metadata-v13-experiment.yml'
  pull_request:
    paths:
      - 'src/protocol/**'
      - 'src/error.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'tests/conformance/java/ConformanceMetadataWire.java'
      - 'tests/conformance/java/generate_metadata_wire.py'
      - 'tests/metadata_wire_conformance.rs'
      - 'docs/evidence/conformance/q-conf-metadatawire/apache-pairs.txt'
      - 'docs/evidence/conformance/q-conf-metadatawire/rust-pairs.txt'
      - '.github/workflows/metadata-v13-experiment.yml'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Record tools and source
        run: |
          rustc --version
          cargo --version
          java --version
          git rev-parse HEAD
          sha256sum tests/conformance/java/ConformanceMetadataWire.java tests/conformance/java/generate_metadata_wire.py tests/metadata_wire_conformance.rs
      - name: Compare bounded body fixtures
        run: timeout 600s python3 tests/conformance/java/generate_metadata_wire.py --output target/metadata-v13
      - name: Log bounded synthetic body corpus
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("target/metadata-v13")
          peers = ("4.1.2", "4.2.1", "4.3.1")
          apache = (root / peers[0] / "apache.txt").read_bytes()
          rust = (root / peers[0] / "default-rust.txt").read_bytes()
          evidence = Path("docs/evidence/conformance/q-conf-metadatawire")
          if apache != (evidence / "apache-pairs.txt").read_bytes():
              raise ValueError("Apache corpus differs from retained bytes")
          if rust != (evidence / "rust-pairs.txt").read_bytes():
              raise ValueError("Rust corpus differs from retained bytes")
          for peer in peers:
              if (root / peer / "apache.txt").read_bytes() != apache:
                  raise ValueError("Apache peer corpus differs")
              for profile in ("default", "all-features"):
                  if (root / peer / (profile + "-rust.txt")).read_bytes() != rust:
                      raise ValueError("Rust profile corpus differs")
          for label, body in (("APACHE", apache), ("RUST", rust)):
              if len(body) > 32768 or not body.endswith(b"\n"):
                  raise ValueError("corpus size or terminator")
              if len(body.splitlines()) != 5 or any(len(line.split()) != 3 for line in body.splitlines()):
                  raise ValueError("corpus shape")
              print(label + "_SHA256 " + hashlib.sha256(body).hexdigest())
              print("BEGIN_" + label + "_CORPUS")
              print(body.decode("ascii"), end="")
              print("END_" + label + "_CORPUS")
          PY
      - name: Strict lint
        if: always()
        run: cargo clippy --locked --all-features --test metadata_wire_conformance -- -D warnings
      - name: Formatting
        if: always()
        run: cargo fmt --all -- --check
      - name: Retain fixtures and process receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-v13-${{ github.sha }}
          path: target/metadata-v13
          if-no-files-found: warn
          retention-days: 30
