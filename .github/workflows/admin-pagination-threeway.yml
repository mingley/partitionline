name: Admin pagination three-way comparison
on:
  push:
    branches:
      - work/admin-pagination-threeway-20261108
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          path: constant
      - uses: actions/checkout@v7
        with:
          ref: fc7741bf912e483054147e95430a901135249362
          path: history
      - uses: actions/checkout@v7
        with:
          ref: 60caa746c3654c89d01557e35e1100cdc2a84b74
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
      - name: Build separate release binaries
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          lscpu | grep -E 'Model name|CPU\(s\)'
          cp constant/src/admin/pagination_tests.rs history/src/admin/pagination_tests.rs
          cp constant/src/admin/pagination_tests.rs baseline/src/admin/pagination_tests.rs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('baseline/src/admin.rs')
          s=p.read_text()
          needle='mod offsets;\n'
          assert s.count(needle)==1
          p.write_text(s.replace(needle,needle+'#[cfg(test)]\nmod pagination_tests;\n',1))
          PY
          for arm in baseline history constant; do
            sha256sum "$arm/src/admin.rs" "$arm/src/admin/pagination_tests.rs" "$arm/Cargo.lock"
            target="$RUNNER_TEMP/target-$arm"
            CARGO_TARGET_DIR="$target" cargo test --locked --release --manifest-path "$arm/Cargo.toml" --lib dtp_pagination_benchmark --no-run
            bins=()
            for f in "$target"/release/deps/partitionline-*; do
              if [ -f "$f" ] && [ -x "$f" ]; then bins+=("$f"); fi
            done
            test "${#bins[@]}" = 1
            cp "${bins[0]}" "$RUNNER_TEMP/$arm-binary"
            sha256sum "$RUNNER_TEMP/$arm-binary"
          done
          test "$(sha256sum "$RUNNER_TEMP/baseline-binary" | cut -d' ' -f1)" != "$(sha256sum "$RUNNER_TEMP/constant-binary" | cut -d' ' -f1)"
          test "$(sha256sum "$RUNNER_TEMP/history-binary" | cut -d' ' -f1)" != "$(sha256sum "$RUNNER_TEMP/constant-binary" | cut -d' ' -f1)"
      - name: Balanced paired measurements
        shell: bash
        run: |
          set -euo pipefail
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          printf 'pinned_cpu=%s\n' "$cpu"
          mkdir -p "$RUNNER_TEMP/threeway"
          printf 'block,shape,arm,elapsed_ns\n' > "$RUNNER_TEMP/threeway/results.csv"
          for block in $(seq 0 11); do
            case $((block % 6)) in
              0) order=(baseline history constant) ;;
              1) order=(baseline constant history) ;;
              2) order=(history baseline constant) ;;
              3) order=(history constant baseline) ;;
              4) order=(constant baseline history) ;;
              5) order=(constant history baseline) ;;
            esac
            for shape in single many_pages; do
              for arm in "${order[@]}"; do
                out=$(taskset -c "$cpu" "$RUNNER_TEMP/$arm-binary" --exact "admin::pagination_tests::dtp_pagination_benchmark_$shape" --ignored --nocapture)
                ns=$(printf '%s\n' "$out" | sed -n 's/.*MEASURE .* elapsed_ns=\([0-9]*\).*/\1/p')
                test -n "$ns"
                printf '%s,%s,%s,%s\n' "$block" "$shape" "$arm" "$ns" >> "$RUNNER_TEMP/threeway/results.csv"
              done
            done
          done
          cat "$RUNNER_TEMP/threeway/results.csv"
          python3 - "$RUNNER_TEMP/threeway/results.csv" <<'PY'
          import csv,statistics,sys
          rows=list(csv.DictReader(open(sys.argv[1])))
          assert len(rows)==72
          for shape in ('single','many_pages'):
              for candidate in ('history','constant'):
                  ratios=[]
                  for block in range(12):
                      pair={r['arm']:int(r['elapsed_ns']) for r in rows if r['shape']==shape and int(r['block'])==block}
                      ratios.append(pair[candidate]/pair['baseline'])
                  print(shape,candidate,'median',statistics.median(ratios),'range',min(ratios),max(ratios),'slower',sum(x>1 for x in ratios))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: admin-pagination-threeway
          path: ${{ runner.temp }}/threeway/
          if-no-files-found: warn
          retention-days: 30
