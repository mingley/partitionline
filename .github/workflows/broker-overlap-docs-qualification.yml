name: broker retained ceiling documentation qualification

on:
  push:
    branches:
      - qualification/broker-overlap-docs-20261108

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify exact source doc changes and stable formatting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/overlap-docs"
          uname -a
          test "$(uname -m)" = x86_64
          rustc +stable --version --verbose
          test "$(git rev-parse HEAD^)" = c49cde3ecf7fc11be8bd0a0e31910f6a1dce6b51
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess
          base = "c49cde3ecf7fc11be8bd0a0e31910f6a1dce6b51"
          mp = Path('partitionline-broker/src/metadata.rs')
          fp = Path('partitionline-broker/src/fetch.rs')
          rp = Path('tests/conformance/broker/implemented-api-versions.json')
          old_m = subprocess.check_output(['git', 'show', f'{base}:{mp}']).decode()
          old_f = subprocess.check_output(['git', 'show', f'{base}:{fp}']).decode()
          old_m_doc, new_m_doc = "    /// `reads.max_retained_bytes()`, default1GiB. This includes waiting requests\n    /// and completed unconsumed replies; actor scan work has separate limits.\n", "    /// `reads.max_retained_bytes()`, default1GiB. This includes waiting requests\n    /// and completed unconsumed replies; actor scan work has separate limits.\n    /// If a caller cancels while the actor owns its request, the permit can be\n    /// released before the actor drops its buffers. The configured ceiling does\n    /// not bound that overlap or total process memory.\n"
          old_f_doc, new_f_doc = "    /// unconsumed snapshots share those permits. Actor scan buffers, parser\n    /// metadata, allocator overhead, transport/caller ownership and RSS are\n    /// separate from this byte envelope.\n", "    /// unconsumed snapshots share those permits. A canceled caller can release\n    /// its permit before the actor drops its request and work buffers. This\n    /// ceiling does not bound that overlap or total process memory. Actor scan\n    /// buffers, parser metadata, allocator overhead and transport/caller\n    /// ownership are also separate from this byte envelope.\n"
          old_getter, new_getter = "    /// Combined admitted read input/output byte ceiling, default1GiB.", "    /// Configured read input/output admission ceiling, default1GiB."
          assert old_m.count(old_m_doc) == 1 and mp.read_text() == old_m.replace(old_m_doc, new_m_doc)
          assert old_f.count(old_f_doc) == old_f.count(old_getter) == 1
          assert fp.read_text() == old_f.replace(old_f_doc, new_f_doc).replace(old_getter, new_getter)
          old_reg = json.loads(subprocess.check_output(['git', 'show', f'{base}:{rp}']))
          new_reg = json.loads(rp.read_text())
          for key, path in [('metadata_source_sha256', mp), ('fetch_source_sha256', fp)]:
              assert new_reg[key] == hashlib.sha256(path.read_bytes()).hexdigest()
              assert new_reg[key] != old_reg[key]
              del new_reg[key]
              del old_reg[key]
          assert new_reg == old_reg, 'unrelated registry entries changed'
          print('Only the reviewed source docs and their two pins changed')
          PY
          cargo +stable fmt --manifest-path partitionline-broker/Cargo.toml -- --check
      - name: Selected admission tests in both feature profiles
        shell: bash
        run: |
          set -euo pipefail
          for mode in default all-features; do
            flags=()
            if test "$mode" = all-features; then flags+=(--all-features); fi
            for name in \
              metadata::tests::unconsumed_fetch_receipt_keeps_admission_until_consumed_or_canceled \
              metadata::tests::canceled_queued_fetch_releases_permit_before_actor_queue_drains
            do
              log="$RUNNER_TEMP/overlap-docs/${mode}-${name##*::}.log"
              timeout 300s cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml "${flags[@]}" --lib "$name" -- --exact > "$log" 2>&1 || { cat "$log"; exit 1; }
              cat "$log"
              grep -F 'test result: ok. 1 passed;' "$log"
            done
          done
      - name: Strict all-feature Rustdoc
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo +stable doc --locked --manifest-path partitionline-broker/Cargo.toml --all-features --no-deps 2>&1 | tee "$RUNNER_TEMP/overlap-docs/rustdoc.log"
      - name: Strict default and all-feature doctests
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --doc 2>&1 | tee "$RUNNER_TEMP/overlap-docs/doctest-default.log"
          cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --doc --all-features 2>&1 | tee "$RUNNER_TEMP/overlap-docs/doctest-all-features.log"
      - name: Verify active broker API inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/check-broker-api-matrix.py --report "$RUNNER_TEMP/overlap-docs/api-matrix.json" 2>&1 | tee "$RUNNER_TEMP/overlap-docs/api-inventory.log"
      - name: Run all 55 API inventory controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests/ci -p test_broker_api_matrix.py -v 2>&1 | tee "$RUNNER_TEMP/overlap-docs/api-controls.log"
          grep -E '^Ran 55 tests? in ' "$RUNNER_TEMP/overlap-docs/api-controls.log"
      - name: Retain qualification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: broker-overlap-docs-${{ github.sha }}
          path: ${{ runner.temp }}/overlap-docs
          if-no-files-found: warn
          retention-days: 30
