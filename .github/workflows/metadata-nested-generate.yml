name: Generate nested Metadata v13 qualification corpus
on:
  push:
    branches: [qualification/metadata-v13-nested-20261120]
    paths:
      - '.github/workflows/metadata-nested-generate.yml'
      - 'tests/conformance/java/ConformanceMetadataWire.java'
      - 'tests/conformance/java/ConformanceMetadataVersions.java'
      - 'tests/conformance/java/generate_metadata_wire.py'
      - 'tests/metadata_wire_conformance.rs'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Record exact source and tools
        run: |
          rustc --version
          cargo --version
          uname -sm
          java --version
          git rev-parse HEAD
          sha256sum tests/conformance/java/ConformanceMetadataVersions.java tests/conformance/java/ConformanceMetadataWire.java tests/conformance/java/generate_metadata_wire.py tests/metadata_wire_conformance.rs
      - name: Compare nested fixtures through the pinned SDKs
        run: timeout 600s python3 tests/conformance/java/generate_metadata_wire.py --nested --output target/metadata-v13-nested
      - name: Log the agreed synthetic corpus
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("target/metadata-v13-nested")
          corpus = (root / "4.1.0" / "apache.txt").read_bytes()
          for release in ("4.1.0", "4.1.2", "4.2.1", "4.3.1"):
              for file in ("apache.txt", "default-rust.txt", "all-features-rust.txt"):
                  if (root / release / file).read_bytes() != corpus:
                      raise ValueError(f"nested corpus differs for {release} {file}")
          print("NESTED_SHA256 " + hashlib.sha256(corpus).hexdigest())
          print("BEGIN_NESTED_CORPUS")
          print(corpus.decode("ascii"), end="")
          print("END_NESTED_CORPUS")
          PY
      - name: Formatting
        if: always()
        run: cargo fmt --all -- --check
      - name: Strict lint
        if: always()
        run: cargo clippy --locked --all-features --test metadata_wire_conformance -- -D warnings
      - name: Retain fixtures and process receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metadata-v13-nested-generation-${{ github.sha }}
          path: target/metadata-v13-nested
          if-no-files-found: warn
          retention-days: 30
