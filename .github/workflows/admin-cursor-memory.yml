name: Admin cursor memory diagnostic
on:
  push:
    branches:
      - work/admin-cursor-memory-20261108
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Measure requested live allocation
        run: |
          rustc -Vv
          rustc --edition=2021 -C opt-level=3 ./scripts/admin_cursor_memory_diagnostic.rs -o "$RUNNER_TEMP/admin-cursor-memory"
          "$RUNNER_TEMP/admin-cursor-memory"
