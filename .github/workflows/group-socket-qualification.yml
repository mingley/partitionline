name: Group coordinator retirement qualification

on:
  push:
    branches:
      - qualification/group-socket-20261108

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .cargo
            .github
            src
            examples
            tests
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: 3f45fe6255e72abc6b0c4488bc13117779c50787
          path: baseline
          sparse-checkout: |
            .cargo
            src
            examples
            tests
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Record host and compiler
        run: |
          test "$(uname -m)" = x86_64
          uname -a
          rustc +stable -Vv
          cargo +stable -V
          git rev-parse HEAD
          git -C baseline rev-parse HEAD
      - name: Exact candidate regressions on both feature sets
        run: bash .github/group-qualification/candidate.sh
      - name: Baseline old-peer failure witnesses
        working-directory: baseline
        run: bash ../.github/group-qualification/baseline.sh
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - name: Release stream-lock overhead probe
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo +stable test --release --locked --lib net::tests::stream_lock_overhead_probe -- --exact --ignored --nocapture
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Broader network tests
        run: cargo +stable test --locked --lib net::tests:: -- --test-threads=1
