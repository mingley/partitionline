name: Produce quota live timing observation
on:
  push:
    branches: [qualification/produce-quota-live-20261109]
    paths:
      - '.github/workflows/produce-quota-live-observation.yml'
      - 'qualification/produce-quota-live-observe.py'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Start Apache Kafka 4.3.1
        run: |
          set -euo pipefail
          docker run -d --name pl-quota -p 9092:9092 apache/kafka:4.3.1
          docker image inspect apache/kafka:4.3.1 --format '{{.Id}} {{json .RepoDigests}}'
          for i in $(seq 1 90); do
            if docker exec pl-quota /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec pl-quota /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
          docker exec pl-quota /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic alpha --partitions 1 --replication-factor 1 --config message.timestamp.type=LogAppendTime
      - name: Configure per-client producer byte quotas
        run: |
          set -euo pipefail
          for v in 3 5 6; do
            docker exec pl-quota /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:9092 --alter --add-config 'producer_byte_rate=20' --entity-type clients --entity-name "quota-probe-v$v"
            docker exec pl-quota /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:9092 --describe --entity-type clients --entity-name "quota-probe-v$v"
          done
          sleep 3
      - name: Observe responses and next request on one connection
        run: python3 -u qualification/produce-quota-live-observe.py
      - name: Stop Kafka
        if: always()
        run: docker rm -f pl-quota || true
