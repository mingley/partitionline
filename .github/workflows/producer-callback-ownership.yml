name: Producer callback ownership controls

on:
  push:
    branches: [qualification/producer-callback-controls-20261109]

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .cargo
            src
            tests
            examples
      - uses: dtolnay/rust-toolchain@stable
      - name: Identify source and run controls
        shell: bash
        run: |
          set -uo pipefail
          rustc -Vv
          git rev-parse HEAD
          git hash-object src/producer.rs tests/producer_owner_reentrancy_controls.rs tests/common/mod.rs
          sha256sum src/producer.rs tests/producer_owner_reentrancy_controls.rs tests/common/mod.rs Cargo.lock
          failures=0
          check() {
            printf '\nCHECK: %s\n' "$*"
            if "$@"; then
              printf 'CHECK_RESULT=pass\n'
            else
              code=$?
              printf 'CHECK_RESULT=fail:%s\n' "$code"
              failures=$((failures + 1))
            fi
          }
          check timeout 180 cargo test --locked --test producer_owner_reentrancy_controls -- --nocapture --test-threads=1
          check timeout 180 cargo test --locked --all-features --test producer_owner_reentrancy_controls -- --nocapture --test-threads=1
          check cargo clippy --locked --all-features --test producer_owner_reentrancy_controls -- -D warnings
          check rustfmt --config skip_children=true --check --edition 2021 tests/producer_owner_reentrancy_controls.rs
          printf '\nFAILED_COMMANDS=%s\n' "$failures"
          test "$failures" -eq 0
