name: Registry incremental JSON index controls
on:
  push:
    branches: [qualification/schema-json-migration-20261109]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format and record scoped diff
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          git rev-parse HEAD
          cargo fmt --manifest-path partitionline-schema/Cargo.toml
          echo PL_FMT_DIFF_BEGIN
          git diff -- partitionline-schema/src/registry.rs
          echo PL_FMT_DIFF_END
          git hash-object partitionline-schema/src/registry.rs
      - name: Collision, boundary, precedence and public controls
        run: |
          cargo test --manifest-path partitionline-schema/Cargo.toml --locked --lib json_migration_ -- --nocapture
          cargo test --manifest-path partitionline-schema/Cargo.toml --locked --lib registry_json_migration_public_large_and_duplicate_controls
      - name: Full schema profiles
        run: |
          cargo test --manifest-path partitionline-schema/Cargo.toml --locked
          cargo test --manifest-path partitionline-schema/Cargo.toml --locked --all-features
          cargo test --manifest-path partitionline-schema/Cargo.toml --locked --no-default-features
      - name: Strict checks
        run: |
          cargo fmt --manifest-path partitionline-schema/Cargo.toml -- --check
          cargo clippy --manifest-path partitionline-schema/Cargo.toml --locked --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path partitionline-schema/Cargo.toml --locked --all-features --no-deps
