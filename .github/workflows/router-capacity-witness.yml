name: public exchange capacity witness
on:
  push:
    branches: [qualification/router-capacity-witness-20261108]
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify source and test-only changes
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD^)" = 8d9e5de32f399d03588d299cb889d167c53a34a1
          git rev-parse HEAD^
          rustc +stable --version --verbose
          sha256sum partitionline-broker/src/{metadata,transport}.rs
      - name: Run claimed public exchange witness in both feature profiles
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-capacity"
          cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --lib metadata::tests::public_exchange_can_transfer_oversized_spare_into_a_claimed_job -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/public-capacity/default.log"
          cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --all-features --lib metadata::tests::public_exchange_can_transfer_oversized_spare_into_a_claimed_job -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/public-capacity/all-features.log"
          for profile in default all-features; do
            grep -F 'PL_PUBLIC_SPARE_CLAIM ' "$RUNNER_TEMP/public-capacity/$profile.log"
            grep -F 'PL_PUBLIC_SPARE_AFTER_CANCEL actor_retains_command=true permit_held=true' "$RUNNER_TEMP/public-capacity/$profile.log"
            grep -F 'PL_PUBLIC_SPARE_FRESH_FETCH response_len=12' "$RUNNER_TEMP/public-capacity/$profile.log"
            grep -F 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/public-capacity/$profile.log"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: public-exchange-capacity-witness
          path: ${{ runner.temp }}/public-capacity
          if-no-files-found: warn
