name: quota local error code qualification
on:
  push:
    branches: [qualification/quota-error-corrected-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [default, all]
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9f3339fd08be16673301cc6f36df32f39ba0254b
          path: baseline
      - uses: actions/checkout@v7
        with:
          ref: 55395ae7743428b73cf7903199e4e242af9a307a
          path: candidate
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          rustc -Vv
          git -C baseline rev-parse HEAD
          git -C candidate rev-parse HEAD
          test "$(git -C baseline hash-object partitionline-broker/src/quotas.rs)" = 75bca5a99c2dd14d3b28c1bb3fe924bfebb3cf0e
          test "$(git -C candidate hash-object partitionline-broker/src/quotas.rs)" = fe6ed7dabd863ec9e1b3f54101d57ea4d2abc6a0
          test "$(git -C candidate hash-object partitionline-broker/tests/quotas_error_code.rs)" = 5bd046aee1fcab6d0bf1d2bf6eddeecd2f31a4c4
          cmp baseline/partitionline-broker/tests/quotas_error_code.rs candidate/partitionline-broker/tests/quotas_error_code.rs
          cmp baseline/partitionline-broker/Cargo.lock candidate/partitionline-broker/Cargo.lock
          sha256sum baseline/partitionline-broker/src/quotas.rs candidate/partitionline-broker/src/quotas.rs candidate/partitionline-broker/tests/quotas_error_code.rs
      - name: Baseline error mappings
        shell: bash
        run: |
          set -euo pipefail
          features=()
          if [[ "$PROFILE" == all ]]; then features=(--all-features); fi
          export CARGO_TARGET_DIR="$RUNNER_TEMP/quota-code-baseline"
          set +e
          cargo test --locked --manifest-path baseline/partitionline-broker/Cargo.toml "${features[@]}" --test quotas_error_code -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/quota-code-baseline.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" = 101
          for name in connection_capacity_is_not_a_generic_kafka_error per_client_connection_capacity_is_not_a_generic_kafka_error identity_state_capacity_is_not_a_generic_kafka_error inflight_capacity_is_not_a_generic_kafka_error inflight_overflow_is_not_a_generic_kafka_error produce_rate_refusal_is_not_a_generic_kafka_error fetch_rate_refusal_is_not_a_generic_kafka_error replication_rate_refusal_is_not_a_generic_kafka_error; do
            grep -F "test $name ... FAILED" "$RUNNER_TEMP/quota-code-baseline.log"
          done
          grep -F 'test result: FAILED. 2 passed; 8 failed;' "$RUNNER_TEMP/quota-code-baseline.log"
      - name: Baseline internal exhaustion controls
        shell: bash
        run: |
          set -euo pipefail
          features=()
          if [[ "$PROFILE" == all ]]; then features=(--all-features); fi
          export CARGO_TARGET_DIR="$RUNNER_TEMP/quota-code-baseline"
          set +e
          cargo test --locked --manifest-path baseline/partitionline-broker/Cargo.toml "${features[@]}" --lib no_generic_kafka_error -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/quota-code-baseline-unit.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" = 101
          grep -F 'test quotas::tests::exhausted_work_ids_have_no_generic_kafka_error ... FAILED' "$RUNNER_TEMP/quota-code-baseline-unit.log"
          grep -F 'test quotas::tests::overflowing_debt_has_no_generic_kafka_error ... FAILED' "$RUNNER_TEMP/quota-code-baseline-unit.log"
          grep -F 'test result: FAILED. 0 passed; 2 failed;' "$RUNNER_TEMP/quota-code-baseline-unit.log"
      - name: Candidate local error and existing clock controls
        shell: bash
        run: |
          set -euo pipefail
          features=()
          if [[ "$PROFILE" == all ]]; then features=(--all-features); fi
          export CARGO_TARGET_DIR="$RUNNER_TEMP/quota-code-candidate"
          cargo test --locked --manifest-path candidate/partitionline-broker/Cargo.toml "${features[@]}" --test quotas_error_code -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/quota-code-candidate.log"
          grep -F 'test result: ok. 10 passed;' "$RUNNER_TEMP/quota-code-candidate.log"
          cargo test --locked --manifest-path candidate/partitionline-broker/Cargo.toml "${features[@]}" --test quotas_clock -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/quota-clock-existing.log"
          grep -F 'test result: ok. 13 passed;' "$RUNNER_TEMP/quota-clock-existing.log"
          cargo test --locked --manifest-path candidate/partitionline-broker/Cargo.toml "${features[@]}" --lib quotas::tests -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/quota-unit-existing.log"
          grep -F 'test result: ok. 12 passed;' "$RUNNER_TEMP/quota-unit-existing.log"
      - name: Verify separate binaries
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t base_bins < <(find "$RUNNER_TEMP/quota-code-baseline/debug/deps" -maxdepth 1 -type f -perm -u+x -name 'quotas_error_code-*')
          mapfile -t cand_bins < <(find "$RUNNER_TEMP/quota-code-candidate/debug/deps" -maxdepth 1 -type f -perm -u+x -name 'quotas_error_code-*')
          test "${#base_bins[@]}" = 1
          test "${#cand_bins[@]}" = 1
          sha256sum "${base_bins[0]}" "${cand_bins[0]}" | tee "$RUNNER_TEMP/quota-code-binaries.sha256"
          test "$(sha256sum "${base_bins[0]}" | cut -d' ' -f1)" != "$(sha256sum "${cand_bins[0]}" | cut -d' ' -f1)"
      - name: Retain logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quota-code-behavior-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/quota-code-baseline.log
            ${{ runner.temp }}/quota-code-baseline-unit.log
            ${{ runner.temp }}/quota-code-candidate.log
            ${{ runner.temp }}/quota-clock-existing.log
            ${{ runner.temp }}/quota-unit-existing.log
            ${{ runner.temp }}/quota-code-binaries.sha256
          if-no-files-found: warn
