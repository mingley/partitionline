name: bounded disposable quorum Delete diagnostic
on:
  push:
    branches: [qualification/quorum-delete-56-diag-20261108]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 4
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture pinned parent, instrumented source and host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD~3)" = c471f5eb0d7b92959e23e5880e35109060bff5d2
          {
            date -u
            uname -a
            lscpu
            rustc +stable --version --verbose
            cargo +stable --version --verbose
            git rev-parse HEAD
            git rev-parse HEAD~3
            git diff --name-status HEAD~3 HEAD
            printf 'CARGO_INCREMENTAL=%s\nCARGO_BUILD_JOBS=%s\n' "$CARGO_INCREMENTAL" "$CARGO_BUILD_JOBS"
          } | tee evidence/provenance.txt
          git show HEAD~3:partitionline-broker/src/catalog.rs | sha256sum | tee evidence/parent-catalog-sha256.txt
          git show HEAD~3:partitionline-broker/src/metadata_quorum.rs | sha256sum | tee evidence/parent-metadata-quorum-sha256.txt
          git show HEAD~3:partitionline-broker/src/raft/runtime.rs | sha256sum | tee evidence/parent-runtime-sha256.txt
          sha256sum partitionline-broker/Cargo.toml partitionline-broker/src/catalog.rs partitionline-broker/src/metadata_quorum.rs partitionline-broker/src/raft/runtime.rs tools/quorum-delete-diagnostic.py | tee evidence/instrumented-source-sha256.txt
      - name: Build opt-in diagnostic operator with all existing features
        shell: bash
        run: |
          set -euo pipefail
          cp -a partitionline-broker "$RUNNER_TEMP/qd-src"
          diff -qr partitionline-broker "$RUNNER_TEMP/qd-src"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/qd" cargo +stable build --locked --all-features --manifest-path "$RUNNER_TEMP/qd-src/Cargo.toml" --bin operator 2>&1 | tee evidence/build.log
          sha256sum target/qd/debug/operator | tee evidence/operator-sha256.txt
      - name: One disposable failover scenario and one never-retried Delete
        shell: bash
        run: |
          set -euo pipefail
          export QD_EVIDENCE="$GITHUB_WORKSPACE/evidence"
          export QD_OPERATOR="$GITHUB_WORKSPACE/target/qd/debug/operator"
          timeout 300 python3 -u tools/quorum-delete-diagnostic.py 2>&1 | tee evidence/scenario.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("evidence/result.json").read_text())
          print("DIAGNOSTIC_RESULT", json.dumps(r, sort_keys=True))
          if not r.get("all_processes_and_captures_joined"):
              raise SystemExit("INCOMPLETE: one or more processes or capture threads not joined")
          if r.get("delete_attempts") != 1:
              raise SystemExit("INCOMPLETE: did not reach the one intended fresh Delete")
          for key in ("diagnostic_bytes_dropped", "diagnostic_decode_errors", "capture_errors", "nonzero_node_exits",
                      "snapshot_parse_errors", "snapshot_hash_changes", "snapshot_missing_files",
                      "snapshot_copy_errors", "snapshot_over_limit", "snapshot_uninterpreted"):
              if r.get(key) is None or r[key]:
                  raise SystemExit(f"INCOMPLETE: {key}={r.get(key)!r}")
          if r.get("delete_code") == 56:
              traces = r.get("delete_command_traces") or []
              entered = [e for e in traces if e.get("stage") == "execute_enter" and e.get("decoded",{}).get("token")]
              if not entered or not r.get("delete_terminal_errors"):
                  raise SystemExit("INCOMPLETE: Delete 56 lacks an exact token or terminal nested error")
          if r.get("minority_proposal_admission") != "confirmed":
              print("MINORITY_CONTROL_UNPROVEN: no matching owner append success")
          print("NOTE: captured results describe one synthetic fixture, not the original ambiguous operation")
          PY
      - name: Retain partial or complete diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: disposable-quorum-delete-diagnostic
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
