name: Admin paginated topic identity paired timing
on:
  push:
    branches: [work/admin-identity-perf-20261108]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: e487f7294773f75112f15437992ed780b53c7307
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
      - name: Build separate release test binaries
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          lscpu | grep -E 'Model name|CPU\(s\)'
          cp candidate/src/admin/pagination_tests.rs baseline/src/admin/pagination_tests.rs
          for arm in baseline candidate; do
            sha256sum "$arm/src/admin.rs" "$arm/src/admin/pagination_tests.rs" "$arm/Cargo.lock"
            git -C "$arm" hash-object src/admin.rs src/admin/pagination_tests.rs
            target="$RUNNER_TEMP/target-$arm"
            CARGO_TARGET_DIR="$target" cargo test --locked --release --manifest-path "$arm/Cargo.toml" --lib dtp_pagination_benchmark --no-run
            bins=()
            for f in "$target"/release/deps/partitionline-*; do
              if [ -f "$f" ] && [ -x "$f" ]; then bins+=("$f"); fi
            done
            test "${#bins[@]}" = 1
            cp "${bins[0]}" "$RUNNER_TEMP/$arm-binary"
            sha256sum "$RUNNER_TEMP/$arm-binary"
          done
          test "$(sha256sum "$RUNNER_TEMP/baseline-binary" | cut -d' ' -f1)" != "$(sha256sum "$RUNNER_TEMP/candidate-binary" | cut -d' ' -f1)"
      - name: Warmup and paired loopback timings
        shell: bash
        run: |
          set -euo pipefail
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          printf 'pinned_cpu=%s\n' "$cpu"
          mkdir -p "$RUNNER_TEMP/identity-perf"
          printf 'block,shape,arm,elapsed_ns\n' > "$RUNNER_TEMP/identity-perf/results.csv"
          for shape in single many_pages; do
            for arm in baseline candidate; do
              taskset -c "$cpu" "$RUNNER_TEMP/$arm-binary" --exact "admin::pagination_tests::dtp_pagination_benchmark_$shape" --ignored --nocapture > /dev/null
            done
          done
          for block in $(seq 0 11); do
            for shape in single many_pages; do
              if [ "$shape" = single ]; then offset=0; else offset=1; fi
              if [ $(((block + offset) % 2)) = 0 ]; then order=(baseline candidate); else order=(candidate baseline); fi
              for arm in "${order[@]}"; do
                out=$(taskset -c "$cpu" "$RUNNER_TEMP/$arm-binary" --exact "admin::pagination_tests::dtp_pagination_benchmark_$shape" --ignored --nocapture)
                ns=$(printf '%s\n' "$out" | sed -n 's/.*MEASURE .* elapsed_ns=\([0-9]*\).*/\1/p')
                test -n "$ns"
                printf '%s,%s,%s,%s\n' "$block" "$shape" "$arm" "$ns" >> "$RUNNER_TEMP/identity-perf/results.csv"
              done
            done
          done
          cat "$RUNNER_TEMP/identity-perf/results.csv"
          python3 - "$RUNNER_TEMP/identity-perf/results.csv" <<'PY'
          import csv,statistics,sys
          rows=list(csv.DictReader(open(sys.argv[1])))
          assert len(rows)==48
          for shape in ('single','many_pages'):
              ratios=[]
              for block in range(12):
                  pair={r['arm']:int(r['elapsed_ns']) for r in rows if r['shape']==shape and int(r['block'])==block}
                  ratios.append(pair['candidate']/pair['baseline'])
              print(shape,'median',statistics.median(ratios),'range',min(ratios),max(ratios),'slower',sum(x>1 for x in ratios),'paired',ratios)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: admin-identity-perf
          path: ${{ runner.temp }}/identity-perf/
          if-no-files-found: warn
          retention-days: 30
