name: isolated Produce quota boundary controls
on:
  push:
    branches: [dev/produce-quota-boundaries-20261109]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Record toolchain
        run: rustc --version --verbose
      - name: Bounded loopback controls
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --test quota_transport_boundaries -- --nocapture
      - name: Grouped Produce completion and unconsumed reply control
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib grouped_produce_replies_keep_their_own_admission_permits -- --nocapture
      - name: Default no-response pipeline control
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --test transport pipelined_no_reply_sends_no_frame_and_keeps_connection_usable -- --nocapture
      - name: All-feature loopback controls
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-features --test quota_transport_boundaries -- --nocapture
