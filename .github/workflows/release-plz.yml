name: Release-plz

# KL-08: release-plz is PR-only. crates.io publish is serialized through
# owner-cut-release / release.yml (exact-SHA CI + package-consumer evidence).
# Never auto-publish on main even when a registry token secret is present —
# that raced the tag/owner path and could cut without green exact-SHA CI.

on:
  push:
    branches:
      - main

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Open release PR only (never publish)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
