name: broker shutdown queue qualification

on:
  push:
    branches:
      - qualification/broker-shutdown-queue-20261108

permissions:
  contents: read

concurrency:
  group: broker-shutdown-queue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Host, exact parent and stable formatting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fetch-admission-logs"
          uname -a
          test "$(uname -m)" = x86_64
          rustc +stable --version --verbose
          cargo +stable --version
          openssl version
          df -h .
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -ge 2000000
          test "$(git rev-parse HEAD^)" = 374dcf45db20ee728b00c0b0188e77ca1f47fa9c
          test "$(git rev-parse "374dcf45db20ee728b00c0b0188e77ca1f47fa9c:partitionline-broker/src/metadata.rs")" = e8cc7dbe61a130b22e139999282b2642ec77577e
          test "$(git rev-parse "374dcf45db20ee728b00c0b0188e77ca1f47fa9c:partitionline-broker/tests/fetch.rs")" = 93fe6d40cf2636cd2df07b24214a0b1be9f219e1
          test "$(git rev-parse "374dcf45db20ee728b00c0b0188e77ca1f47fa9c:tests/conformance/broker/implemented-api-versions.json")" = 7199e519a4fd08c331bc35f6f3096735cdde560f
          cargo +stable fmt --manifest-path partitionline-broker/Cargo.toml -- --check
      - name: Verify source changes and prepare queue counterexample
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import hashlib
          import os
          import subprocess
          t = Path(os.environ['RUNNER_TEMP'])
          mp = Path('partitionline-broker/src/metadata.rs')
          fp = Path('partitionline-broker/tests/fetch.rs')
          rp = Path('tests/conformance/broker/implemented-api-versions.json')
          candidate_m, candidate_f = mp.read_text(), fp.read_text()
          base = "374dcf45db20ee728b00c0b0188e77ca1f47fa9c"
          base_m = subprocess.check_output(['git', 'show', f'{base}:{mp}']).decode()
          base_f = subprocess.check_output(['git', 'show', f'{base}:{fp}']).decode()
          start, end = "\n    #[tokio::test]\n    async fn canceled_queued_fetch_releases_permit_before_actor_queue_drains(", "\n    #[tokio::test]\n    async fn unconsumed_data_receipt_keeps_admission_bounded()"
          assert candidate_m.count(start) == candidate_m.count(end) == 1
          a = candidate_m.index(start)
          b = candidate_m.index(end, a)
          assert candidate_m[:a] + candidate_m[b:] == base_m, 'metadata changed outside new gated test'
          old_fetch, new_fetch = "    let mut byte = [0];\n    assert_eq!(socket.read(&mut byte).await?, 0);\n    let result = router\n        .respond(fetch_request(6, 0, 0, 0, 10000, &[(0, 10000)]))", "    let mut byte = [0];\n    assert_eq!(socket.read(&mut byte).await?, 0);\n    // A canceled job can still occupy the actor queue after the transport's\n    // handler has released its data permit. Drain it before checking fresh work.\n    barrier(&router).await?;\n    let result = router\n        .respond(fetch_request(6, 0, 0, 0, 10000, &[(0, 10000)]))"
          assert base_f.count(old_fetch) == 1 and candidate_f == base_f.replace(old_fetch, new_fetch)
          original = json.loads(subprocess.check_output(['git', 'show', f'{base}:{rp}']))
          registry = json.loads(rp.read_text())
          for key, path in [('metadata_source_sha256', mp), ('fetch_test_source_sha256', fp)]:
              assert registry[key] == hashlib.sha256(path.read_bytes()).hexdigest()
              assert registry[key] != original[key]
              del registry[key]
              del original[key]
          assert registry == original, 'unrelated registry entries changed'
          (t / 'metadata-candidate.rs').write_text(candidate_m)
          old_witness, new_witness = "        assert!(matches!(\n            router.dispatch(input.clone()).await,\n            Err(Error::QueueFull)\n        ));\n        println!(\"PL_CANCELED_PERMIT_FREE_QUEUE_FULL\");", "        println!(\"PL_CANCELED_PERMIT_FREE_QUEUE_FULL\");\n        let result = router.dispatch(input.clone()).await;\n        assert!(result.is_ok(), \"PL_IMMEDIATE_FRESH_FAILED: {result:?}\");"
          assert candidate_m.count(old_witness) == 1
          mp.write_text(candidate_m.replace(old_witness, new_witness))
          print('Verified scoped source changes and pins; installed immediate-success counterexample')
          PY
      - name: Prove immediate fresh work may hit a full queue
        shell: bash
        run: |
          set -euo pipefail
          for mode in default all-features; do
            flags=()
            if test "$mode" = all-features; then flags+=(--all-features); fi
            log="$RUNNER_TEMP/fetch-admission-logs/queue-counterexample-$mode.log"
            set +e
            timeout 300s cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml "${flags[@]}" --lib metadata::tests::canceled_queued_fetch_releases_permit_before_actor_queue_drains -- --exact --nocapture > "$log" 2>&1
            status=$?
            set -e
            cat "$log"
            test "$status" -eq 101
            grep -F 'running 1 test' "$log"
            grep -F 'PL_CANCELED_PERMIT_FREE_QUEUE_FULL' "$log"
            grep -F 'PL_IMMEDIATE_FRESH_FAILED: Err(QueueFull)' "$log"
            grep -F 'test result: FAILED. 0 passed; 1 failed;' "$log"
          done
      - name: Restore candidate and test queue and transport controls
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/metadata-candidate.rs" partitionline-broker/src/metadata.rs
          cmp partitionline-broker/src/metadata.rs "$RUNNER_TEMP/metadata-candidate.rs"
          candidate_test() {
            local name="$1" target="$2" mode="$3"
            local log="$RUNNER_TEMP/fetch-admission-logs/candidate-${mode}-${name##*::}.log"
            timeout 300s cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml "${flags[@]}" "$target" "$name" -- --exact --nocapture > "$log" 2>&1 || { cat "$log"; return 1; }
            cat "$log"
            grep -F 'test result: ok. 1 passed;' "$log"
          }
          for mode in default all-features; do
            flags=()
            if test "$mode" = all-features; then flags+=(--all-features); fi
            candidate_test metadata::tests::canceled_queued_fetch_releases_permit_before_actor_queue_drains --lib "$mode"
            candidate_test metadata::tests::unconsumed_fetch_receipt_keeps_admission_until_consumed_or_canceled --lib "$mode"
            candidate_test transport_joined_shutdown_cancels_live_long_poll_without_stopping_store '--test=fetch' "$mode"
            candidate_test transport_deadline_cancels_wait_and_releases_read_admission '--test=fetch' "$mode"
            for attempt in $(seq 1 10); do
              log="$RUNNER_TEMP/fetch-admission-logs/repeat-${mode}-${attempt}.log"
              timeout 60s cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml "${flags[@]}" --lib metadata::tests::canceled_queued_fetch_releases_permit_before_actor_queue_drains -- --exact --nocapture > "$log" 2>&1 || { cat "$log"; exit 1; }
              grep -F 'PL_CANCELED_PERMIT_FREE_QUEUE_FULL' "$log"
              grep -F 'test result: ok. 1 passed;' "$log"
            done
          done
      - name: Verify witness rejects a leaked data permit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('partitionline-broker/src/metadata.rs')
          source = p.read_text()
          slot = "            let _slot = self\n                .data_slots\n                .try_acquire()\n                .map_err(|_| Error::QueueFull)?;"
          assert source.count(slot) == 1
          p.write_text(source.replace(slot, slot + '\n            _slot.forget();'))
          print('Temporarily leaked the admission permit')
          PY
          for mode in default all-features; do
            flags=()
            if test "$mode" = all-features; then flags+=(--all-features); fi
            log="$RUNNER_TEMP/fetch-admission-logs/permit-leak-mutant-$mode.log"
            set +e
            timeout 300s cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml "${flags[@]}" --lib metadata::tests::canceled_queued_fetch_releases_permit_before_actor_queue_drains -- --exact --nocapture > "$log" 2>&1
            status=$?
            set -e
            cat "$log"
            test "$status" -eq 101
            grep -F 'running 1 test' "$log"
            grep -F 'PL_CANCELED_PERMIT_LEAKED' "$log"
            grep -F 'test result: FAILED. 0 passed; 1 failed;' "$log"
          done
          cp "$RUNNER_TEMP/metadata-candidate.rs" partitionline-broker/src/metadata.rs
          cmp partitionline-broker/src/metadata.rs "$RUNNER_TEMP/metadata-candidate.rs"
      - name: Verify pinned broker API inventory
        id: inventory
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/check-broker-api-matrix.py --report "$RUNNER_TEMP/fetch-admission-logs/api-matrix.json" 2>&1 | tee "$RUNNER_TEMP/fetch-admission-logs/api-inventory.log"
      - name: Run all API inventory negative controls
        id: inventory_controls
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests/ci -p test_broker_api_matrix.py -v 2>&1 | tee "$RUNNER_TEMP/fetch-admission-logs/api-controls.log"
          grep -E '^Ran 55 tests? in ' "$RUNNER_TEMP/fetch-admission-logs/api-controls.log"
      - name: Verify stale-leader fencing exact test
        id: stale_leader
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --test raft_membership stale_genesis_leader_observation_is_fenced_before_proposal_append -- --exact 2>&1 | tee "$RUNNER_TEMP/fetch-admission-logs/stale-leader.log"
          grep -Fx 'test stale_genesis_leader_observation_is_fenced_before_proposal_append ... ok' "$RUNNER_TEMP/fetch-admission-logs/stale-leader.log"
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/fetch-admission-logs/stale-leader.log"
      - name: Full broker default-feature suite
        id: full_default
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout 1200s cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --all-targets 2>&1 | tee "$RUNNER_TEMP/fetch-admission-logs/full-default.log"
      - name: Full broker all-feature suite
        id: full_all
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout 1200s cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --all-targets --all-features 2>&1 | tee "$RUNNER_TEMP/fetch-admission-logs/full-all-features.log"
      - name: Strict all-target all-feature broker Clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable clippy --locked --manifest-path partitionline-broker/Cargo.toml --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/fetch-admission-logs/clippy.log"
      - name: Strict all-feature broker Rustdoc
        id: rustdoc
        continue-on-error: true
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo +stable doc --locked --manifest-path partitionline-broker/Cargo.toml --all-features --no-deps 2>&1 | tee "$RUNNER_TEMP/fetch-admission-logs/rustdoc.log"
      - name: Strict default broker doctests
        id: doc_default
        continue-on-error: true
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --doc 2>&1 | tee "$RUNNER_TEMP/fetch-admission-logs/doc-default.log"
      - name: Strict all-feature broker doctests
        id: doc_all
        continue-on-error: true
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --doc --all-features 2>&1 | tee "$RUNNER_TEMP/fetch-admission-logs/doc-all-features.log"
      - name: Require every independent gate to pass
        if: always()
        shell: bash
        env:
          INVENTORY: ${{ steps.inventory.outcome }}
          CONTROLS: ${{ steps.inventory_controls.outcome }}
          STALE_LEADER: ${{ steps.stale_leader.outcome }}
          FULL_DEFAULT: ${{ steps.full_default.outcome }}
          FULL_ALL: ${{ steps.full_all.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          RUSTDOC: ${{ steps.rustdoc.outcome }}
          DOC_DEFAULT: ${{ steps.doc_default.outcome }}
          DOC_ALL: ${{ steps.doc_all.outcome }}
        run: |
          set -euo pipefail
          for outcome in "$INVENTORY" "$CONTROLS" "$STALE_LEADER" "$FULL_DEFAULT" "$FULL_ALL" "$CLIPPY" "$RUSTDOC" "$DOC_DEFAULT" "$DOC_ALL"; do
            test "$outcome" = success
          done
      - name: Retain qualification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: broker-shutdown-queue-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/fetch-admission-logs
          if-no-files-found: warn
          retention-days: 30
