name: Admin slot-index lexical-name paired timing
on:
  push:
    branches: [qualification/admin-dtp-slot-lexical-perf-20261108]
permissions:
  contents: read
jobs:
  compare:
    needs: semantic
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: f5edca564b5481eb9d66c105ea4b13b3877e092c
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin and build release binaries
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -V
          lscpu | grep -E 'Model name|CPU\(s\)'
          df -h "$RUNNER_TEMP"
          test "$(git -C baseline rev-parse HEAD:src/admin.rs)" = 3125c234259c87d1bc4a89d0cd0734d124529bea
          test "$(git -C baseline rev-parse HEAD:src/admin/pagination_tests.rs)" = f18e87db6a6eab6d33a05288fe1d39817b9c2388
          test "$(git -C candidate rev-parse HEAD:src/admin.rs)" = 8c2f94353e04c2925b1bfaf8478285190dd317d7
          test "$(git -C candidate rev-parse HEAD:src/admin/pagination_tests.rs)" = a69d5cceff56a7d1c52f321b5766d695423871aa
          test "$(git -C candidate hash-object .github/fixtures/admin_name_combined_bench.rs.txt)" = dae07e157e9b6687cca044b366d6aa4f5b673ab0
          git -C baseline rev-parse HEAD HEAD:src/admin.rs HEAD:src/admin/pagination_tests.rs HEAD:Cargo.toml HEAD:Cargo.lock
          git -C candidate rev-parse HEAD HEAD:src/admin.rs HEAD:src/admin/pagination_tests.rs HEAD:Cargo.toml HEAD:Cargo.lock
          if test -r /sys/fs/cgroup/cpu.max; then cat /sys/fs/cgroup/cpu.max; else echo 'cpu.max unavailable'; fi
          sha256sum candidate/.github/fixtures/admin_name_combined_bench.rs.txt
          git -C candidate hash-object .github/fixtures/admin_name_combined_bench.rs.txt
          for arm in baseline candidate; do
            cp candidate/.github/fixtures/admin_name_combined_bench.rs.txt "$arm/src/admin/pagination_tests.rs"
            cmp candidate/.github/fixtures/admin_name_combined_bench.rs.txt "$arm/src/admin/pagination_tests.rs"
            sha256sum "$arm/src/admin.rs" "$arm/src/admin/pagination_tests.rs" "$arm/Cargo.toml" "$arm/Cargo.lock"
            git -C "$arm" hash-object src/admin.rs src/admin/pagination_tests.rs
            target="$RUNNER_TEMP/target-$arm"
            CARGO_TARGET_DIR="$target" cargo test --locked --release --manifest-path "$arm/Cargo.toml" --lib dtp_ --no-run
            bins=()
            for f in "$target"/release/deps/partitionline-*; do
              if [ -f "$f" ] && [ -x "$f" ]; then bins+=("$f"); fi
            done
            test "${#bins[@]}" = 1
            cp "${bins[0]}" "$RUNNER_TEMP/$arm-binary"
            sha256sum "$RUNNER_TEMP/$arm-binary"
            df -h "$RUNNER_TEMP"
          done
          test "$(sha256sum "$RUNNER_TEMP/baseline-binary" | cut -d' ' -f1)" != "$(sha256sum "$RUNNER_TEMP/candidate-binary" | cut -d' ' -f1)"
      - name: Warmup and paired loopback timings
        shell: bash
        run: |
          set -euo pipefail
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          printf 'pinned_cpu=%s\n' "$cpu"
          mkdir -p "$RUNNER_TEMP/combined-perf"
          printf 'block,shape,arm,elapsed_ns\n' > "$RUNNER_TEMP/combined-perf/results.csv"
          shapes=(single many_pages four thirty_two two_fifty_six reordered_thirty_two reordered_two_fifty_six many_names_pages lexical_thirty_two lexical_two_fifty_six success_thirty_two success_two_fifty_six lexical_success_thirty_two lexical_success_two_fifty_six)
          for shape in "${shapes[@]}"; do
            case "$shape" in single|many_pages) prefix=dtp_pagination_benchmark ;; *) prefix=dtp_requested_name_benchmark ;; esac
            for arm in baseline candidate; do
              taskset -c "$cpu" "$RUNNER_TEMP/$arm-binary" --exact "admin::pagination_tests::${prefix}_$shape" --ignored --nocapture > /dev/null
            done
          done
          for block in $(seq 0 11); do
            offset=0
            for shape in "${shapes[@]}"; do
              case "$shape" in single|many_pages) prefix=dtp_pagination_benchmark ;; *) prefix=dtp_requested_name_benchmark ;; esac
              if [ $(((block + offset) % 2)) = 0 ]; then order=(baseline candidate); else order=(candidate baseline); fi
              for arm in "${order[@]}"; do
                out=$(taskset -c "$cpu" "$RUNNER_TEMP/$arm-binary" --exact "admin::pagination_tests::${prefix}_$shape" --ignored --nocapture)
                printf '%s\n' "$out" | grep -F 'test result: ok. 1 passed; 0 failed;' >/dev/null
                ns=$(printf '%s\n' "$out" | sed -n 's/.*MEASURE .* elapsed_ns=\([0-9]*\).*/\1/p')
                test -n "$ns"
                printf '%s,%s,%s,%s\n' "$block" "$shape" "$arm" "$ns" >> "$RUNNER_TEMP/combined-perf/results.csv"
              done
              offset=$((offset + 1))
            done
          done
          cat "$RUNNER_TEMP/combined-perf/results.csv"
          python3 - "$RUNNER_TEMP/combined-perf/results.csv" <<'PY'
          import csv,statistics,sys
          rows=list(csv.DictReader(open(sys.argv[1])))
          assert len(rows)==336, len(rows)
          for shape in ('single','many_pages','four','thirty_two','two_fifty_six','reordered_thirty_two','reordered_two_fifty_six','many_names_pages','lexical_thirty_two','lexical_two_fifty_six','success_thirty_two','success_two_fifty_six','lexical_success_thirty_two','lexical_success_two_fifty_six'):
              ratios=[]
              for block in range(12):
                  pair={r['arm']:int(r['elapsed_ns']) for r in rows if r['shape']==shape and int(r['block'])==block}
                  ratios.append(pair['candidate']/pair['baseline'])
              print('RESULT',shape,'median',statistics.median(ratios),'range',min(ratios),max(ratios),'slower',sum(x>1 for x in ratios),'paired',ratios)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: admin-slot-name-lexical-perf
          path: ${{ runner.temp }}/combined-perf/
          if-no-files-found: warn
          retention-days: 30
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: baseline
            source_ref: f5edca564b5481eb9d66c105ea4b13b3877e092c
            source_blob: 3125c234259c87d1bc4a89d0cd0734d124529bea
            tests_blob: f18e87db6a6eab6d33a05288fe1d39817b9c2388
          - arm: candidate
            source_ref: 31c3ec4e4ea852ffc7d6b6ec388fe7b4cb56ed0a
            source_blob: 8c2f94353e04c2925b1bfaf8478285190dd317d7
            tests_blob: a69d5cceff56a7d1c52f321b5766d695423871aa
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          path: driver
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source_ref }}
          path: arm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify unordered and lexical output fields outside timing
        run: |
          set -euo pipefail
          test "$(git -C arm rev-parse HEAD:src/admin.rs)" = "${{ matrix.source_blob }}"
          test "$(git -C arm rev-parse HEAD:src/admin/pagination_tests.rs)" = "${{ matrix.tests_blob }}"
          test "$(git -C driver hash-object .github/fixtures/admin_name_combined_bench.rs.txt)" = dae07e157e9b6687cca044b366d6aa4f5b673ab0
          test "$(git -C driver hash-object .github/fixtures/admin_name_semantic_append.rs.txt)" = 632486c76c79ee234eac53cc3a70b913cddeb8f1
          git -C arm rev-parse HEAD HEAD:src/admin.rs HEAD:src/admin/pagination_tests.rs HEAD:Cargo.toml HEAD:Cargo.lock
          cp driver/.github/fixtures/admin_name_combined_bench.rs.txt arm/src/admin/pagination_tests.rs
          cat driver/.github/fixtures/admin_name_semantic_append.rs.txt >> arm/src/admin/pagination_tests.rs
          sha256sum arm/src/admin/pagination_tests.rs
          cargo test --locked --manifest-path arm/Cargo.toml --lib dtp_name_semantic_control -- --test-threads=1 --nocapture | tee semantic.log
          grep -F 'test result: ok. 1 passed; 0 failed;' semantic.log
