name: journal ownership lease qualification
on:
  push:
    branches: [qualification/journal-owned-leases-20261108]
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  baseline-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 8
      - uses: dtolnay/rust-toolchain@stable
      - name: Install candidate behavioral tests on the base source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          git merge-base --is-ancestor 7f59ef470340db6027958f439df3716a8dde536c HEAD
          python3 - <<'PY'
          from pathlib import Path
          src=Path('partitionline-broker/src/journal.rs').read_text()
          start=src.index('    fn ownership_test_dir(')
          end=src.index('    #[test]\n    #[cfg(unix)]\n    fn journal_and_cursor_keep_inode_pinned_through_close', start)
          Path('/tmp/lease-behavior-tests').write_text(src[start:end])
          PY
          git checkout --detach 7f59ef470340db6027958f439df3716a8dde536c
          python3 - <<'PY'
          from pathlib import Path
          p=Path('partitionline-broker/src/journal.rs')
          src=p.read_text()
          anchor='    #[test]\n    fn a_known_payload_crc_extends_the_fingerprint()'
          assert src.count(anchor)==1
          p.write_text(src.replace(anchor,Path('/tmp/lease-behavior-tests').read_text()+'\n'+anchor))
          PY
      - name: Prove the original source violates each ticket lifetime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline"
          for name in staged_sync_retains_the_path_after_journal_drop staged_sync_retains_checkpoint_generation staged_sync_retains_epoch_generation; do
            if cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --lib "journal::tests::$name" -- --exact --nocapture > "$RUNNER_TEMP/baseline/$name.log" 2>&1; then
              cat "$RUNNER_TEMP/baseline/$name.log"
              echo "Unexpected baseline success: $name" >&2
              exit 1
            fi
            cat "$RUNNER_TEMP/baseline/$name.log"
            grep -F 'assertion failed: matches!' "$RUNNER_TEMP/baseline/$name.log"
            grep -F "test journal::tests::$name ... FAILED" "$RUNNER_TEMP/baseline/$name.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-baseline-controls
          path: ${{ runner.temp }}/baseline
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Host and source
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          git rev-parse HEAD
          rustc +stable --version --verbose
          sha256sum partitionline-broker/src/{journal,partition,produce,segments}.rs
      - name: Ticket generation and post-drop liveness
        run: cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --lib staged_sync_retains -- --nocapture
      - name: Multiple generations and engine close boundary
        run: |
          set -euo pipefail
          cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --lib journal::tests::staged_syncs_keep_each_generation_and_path_until_the_last_drop -- --exact --nocapture
          cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --lib journal::tests::old_inode_stays_reserved_until_replaced_engine_closes -- --exact --nocapture
      - name: File and directory pin controls
        run: |
          set -euo pipefail
          cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --lib journal::tests::journal_and_cursor_keep_inode_pinned_through_close -- --exact --nocapture
          cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --lib journal::tests::directory_ownership_pins_a_temporary_handle -- --exact --nocapture
          cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --lib segments::tests::sparse_cursor_and_rolling_log_pin_removed_inodes -- --exact --nocapture
      - name: Descriptor cost on an otherwise idle test process
        run: cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --lib journal::tests::ownership_descriptor_cost -- --exact --ignored --test-threads=1 --nocapture
      - name: Descriptor exhaustion and recovery
        run: |
          set -euo pipefail
          ulimit -n 64
          cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --lib journal::tests::ownership_descriptor_exhaustion_releases_reservations -- --exact --ignored --test-threads=1 --nocapture
      - name: Default broker library suite
        run: cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --lib
  style:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Render formatted source for the next isolated candidate
        run: |
          set -euo pipefail
          cargo +stable fmt --manifest-path partitionline-broker/Cargo.toml --all
          printf 'PL_FMT_BEGIN journal\n'
          base64 -w 2000 partitionline-broker/src/journal.rs | sed 's/^/PL_FMT_DATA /'
          printf '\nPL_FMT_END journal\n'
          printf 'PL_FMT_BEGIN segments\n'
          base64 -w 2000 partitionline-broker/src/segments.rs | sed 's/^/PL_FMT_DATA /'
          printf '\nPL_FMT_END segments\n'
      - name: Clippy all targets and features
        run: cargo +stable clippy --locked --manifest-path partitionline-broker/Cargo.toml --all-targets --all-features -- -D warnings
