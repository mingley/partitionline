name: isolated transport backpressure qualification
on:
  push:
    branches: [dev/transport-backpressure-20261109]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Record toolchain
        run: rustc --version --verbose
      - name: Format candidate and print formatting delta
        run: |
          cargo fmt --manifest-path partitionline-broker/Cargo.toml --all
          echo PL_FORMAT_START
          git diff -- partitionline-broker/src/transport.rs partitionline-broker/tests/transport_backpressure.rs
          echo PL_FORMAT_END
      - name: Internal backpressure controls
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib bounded_backpressure_tests -- --nocapture
      - name: Socket pipeline controls
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --test transport_backpressure -- --nocapture
      - name: Existing transport integration suite
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --test transport -- --nocapture
      - name: Existing transport unit suite
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib transport:: -- --nocapture
      - name: All-feature socket pipeline controls
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-features --test transport_backpressure -- --nocapture
      - name: All-feature transport unit suite
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-features --lib transport:: -- --nocapture
      - name: Broker all-feature Clippy
        run: cargo clippy --locked --manifest-path partitionline-broker/Cargo.toml --all-targets --all-features -- -D warnings
