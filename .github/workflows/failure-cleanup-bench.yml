name: Failure cleanup matched microbenchmark

on:
  push:
    branches: [qualification/failure-cleanup-bench-20261108]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          path: fixture
          persist-credentials: false
          sparse-checkout: benchmarks/qualification
      - uses: actions/checkout@v7
        with:
          ref: c49cde3ecf7fc11be8bd0a0e31910f6a1dce6b51
          path: baseline
          persist-credentials: false
          sparse-checkout: |
            .cargo
            src
      - uses: actions/checkout@v7
        with:
          ref: 116e6ac22bebb26542768493d381823862decd87
          path: candidate
          persist-credentials: false
          sparse-checkout: |
            .cargo
            src
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin sources, apply the same test fixture, and record the host
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          test "$(git -C baseline rev-parse HEAD:src/producer.rs)" = ca894b515e0e65e8a451cf811346513240ab6238
          test "$(git -C candidate rev-parse HEAD:src/producer.rs)" = 4b80f4762511d63764c1684dfeab2aab9931bd2c
          test "$(git -C baseline rev-parse HEAD:Cargo.lock)" = "$(git -C candidate rev-parse HEAD:Cargo.lock)"
          mkdir -p "$RUNNER_TEMP/failure-bench-evidence"
          evidence="$RUNNER_TEMP/failure-bench-evidence"
          rustc +stable -vV | tee "$evidence/rustc.txt"
          cargo +stable -V | tee "$evidence/cargo.txt"
          uname -a | tee "$evidence/uname.txt"
          lscpu > "$evidence/cpu.txt"
          sha256sum fixture/benchmarks/qualification/failure_cleanup_bench.rs | tee "$evidence/fixture.sha256"
          for arm in baseline candidate; do
            sha256sum "$arm/Cargo.lock" "$arm/src/producer.rs" | tee "$evidence/$arm-original.sha256"
            cp fixture/benchmarks/qualification/failure_cleanup_bench.rs "$arm/src/producer/failure_cleanup_bench.rs"
          done
          python3 - <<'PYCODE'
          from pathlib import Path
          marker = "#[cfg(test)]\nmod tests {"
          extra = '#[cfg(test)]\n#[path = "producer/failure_cleanup_tests.rs"]\nmod failure_cleanup_tests;\n\n'
          addition = '#[cfg(test)]\n#[path = "producer/failure_cleanup_bench.rs"]\nmod failure_cleanup_bench;\n\n'
          for arm in ("baseline", "candidate"):
              path = Path(arm) / "src/producer.rs"
              src = path.read_text()
              assert src.count(marker) == 1
              if arm == "candidate":
                  assert src.count(extra) == 1
                  src = src.replace(extra, "", 1)
              else:
                  assert extra not in src
              path.write_text(src.replace(marker, addition + marker, 1))
          PYCODE
          for arm in baseline candidate; do
            git -C "$arm" diff -- src/producer.rs > "$evidence/$arm-test-transform.diff"
            sha256sum "$arm/Cargo.lock" "$arm/src/producer.rs" "$arm/src/producer/failure_cleanup_bench.rs" | tee "$evidence/$arm-build-source.sha256"
          done
          cmp baseline/src/producer/failure_cleanup_bench.rs candidate/src/producer/failure_cleanup_bench.rs
      - name: Compile isolated test binaries
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/failure-bench-evidence"
          for arm in baseline candidate; do
            (
              cd "$arm"
              export CARGO_TARGET_DIR="$RUNNER_TEMP/failure-bench-target-$arm"
              if ! timeout 1200 cargo +stable test --locked --release --lib --no-run --message-format=json > "$evidence/$arm-build.json" 2> "$evidence/$arm-build.log"; then
                cat "$evidence/$arm-build.log"
                exit 1
              fi
              tail -n 15 "$evidence/$arm-build.log"
            )
            python3 - "$evidence/$arm-build.json" "$evidence/$arm-binary.txt" <<'PYCODE'
          import hashlib
          import json
          import pathlib
          import sys
          artifacts = []
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              event = json.loads(line)
              if event.get("reason") == "compiler-artifact" and event.get("profile", {}).get("test") and event.get("executable") and "lib" in event.get("target", {}).get("kind", []):
                  artifacts.append(event["executable"])
          assert len(artifacts) == 1, artifacts
          binary = pathlib.Path(artifacts[0])
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          pathlib.Path(sys.argv[2]).write_text(str(binary) + "\n" + digest + "\n")
          print("BINARY", binary.name, digest)
          PYCODE
            sha256sum "$arm/Cargo.lock" "$arm/src/producer.rs" "$arm/src/producer/failure_cleanup_bench.rs" > "$evidence/$arm-after-build.sha256"
            cmp "$evidence/$arm-build-source.sha256" "$evidence/$arm-after-build.sha256"
          done
          test "$(tail -n 1 "$evidence/baseline-binary.txt")" != "$(tail -n 1 "$evidence/candidate-binary.txt")"
      - name: Fingerprint and run six balanced pairs
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/failure-bench-evidence"
          cpu="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          echo "client_cpu=$cpu" | tee "$evidence/affinity.txt"
          for arm in baseline candidate; do
            binary="$(head -n 1 "$evidence/$arm-binary.txt")"
            FINGERPRINT_EXPECTED="$arm" timeout 120 taskset -c "$cpu" "$binary" --exact producer::failure_cleanup_bench::unpolled_fingerprint --nocapture --test-threads=1 2>&1 | tee "$evidence/$arm-fingerprint.log"
            grep -F "PL_FINGERPRINT arm=$arm verified=true" "$evidence/$arm-fingerprint.log"
            grep -F 'test result: ok. 1 passed; 0 failed;' "$evidence/$arm-fingerprint.log"
          done
          for pair in 1 2 3 4 5 6; do
            if (( pair % 2 == 1 )); then order='baseline candidate'; else order='candidate baseline'; fi
            printf 'pair=%s order=%s\n' "$pair" "$order" | tee -a "$evidence/order.txt"
            for arm in $order; do
              binary="$(head -n 1 "$evidence/$arm-binary.txt")"
              log="$evidence/pair-$pair-$arm.log"
              timeout 120 taskset -c "$cpu" "$binary" --exact producer::failure_cleanup_bench::completed_failure_batch --nocapture --test-threads=1 2>&1 | tee "$log"
              grep -F 'test result: ok. 1 passed; 0 failed;' "$log"
            done
          done
          python3 - "$evidence" <<'PYCODE'
          import pathlib
          import re
          import statistics
          import sys
          root = pathlib.Path(sys.argv[1])
          for arm in ("baseline", "candidate"):
              all_samples = []
              for pair in range(1, 7):
                  text = (root / f"pair-{pair}-{arm}.log").read_text()
                  rows = re.findall(r"PL_FAILURE_BENCH sample=(\d+) records=(\d+) elapsed_ns=(\d+)", text)
                  assert len(rows) == 8 and [int(r[0]) for r in rows] == list(range(8)), rows
                  assert all(int(r[1]) == 16385 and int(r[2]) > 0 for r in rows)
                  times = [int(r[2]) for r in rows]
                  all_samples += times
                  print(f"PAIR_SUMMARY arm={arm} pair={pair} median_ns={statistics.median(times)} min_ns={min(times)} max_ns={max(times)}")
              print(f"ARM_SUMMARY arm={arm} samples={len(all_samples)} median_ns={statistics.median(all_samples)} min_ns={min(all_samples)} max_ns={max(all_samples)}")
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: failure-cleanup-bench-${{ github.run_id }}
          path: ${{ runner.temp }}/failure-bench-evidence
          if-no-files-found: error
          retention-days: 30
