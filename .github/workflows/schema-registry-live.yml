name: Resolve the live Registry peer image
on:
  push:
    branches: [qualification/schema-registry-live-20261119]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Resolve the Redpanda linux amd64 manifest
        env:
          IMAGE: docker.redpanda.com/redpandadata/redpanda:v26.2.2
        run: |
          timeout 90s docker buildx imagetools inspect --raw "$IMAGE" > "$RUNNER_TEMP/schema-registry-manifest.json"
          python3 - "$RUNNER_TEMP/schema-registry-manifest.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_bytes())
          digests = [
              row["digest"] for row in data["manifests"]
              if row.get("platform", {}).get("os") == "linux"
              and row["platform"]["architecture"] == "amd64"
          ]
          if len(digests) != 1 or not re.fullmatch(r"sha256:[0-9a-f]{64}", digests[0]):
              raise ValueError("expected exactly one linux/amd64 manifest")
          print("Redpanda linux/amd64 manifest " + digests[0])
          PY
