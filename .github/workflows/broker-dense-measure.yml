name: Paired bounded dense Produce router measurements
on:
  push:
    branches: [qualification/broker-dense-measure-20261108]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: a3748caecae60a893de96c0700e1e5ab04854443
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify pins and copy the identical timing fixtures
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD:partitionline-broker/src/produce.rs)" = 6897be1463187c7cd123066729f8dd98ea3e100f
          test "$(git -C baseline rev-parse HEAD:partitionline-broker/src/produce.rs)" = 28ac0a2eb00c4994cc3ebc8d3fe4fa035e6bdc4a
          test "$(git -C candidate rev-parse HEAD:partitionline-broker/tests/produce_dense_partitions.rs)" = 72a0ba73820f1734331f89c49cc77be139aa9de7
          test "$(git -C candidate rev-parse HEAD:partitionline-broker/tests/produce_dense_bench.rs)" = c45d4b2e8d2db34093f0c4b59c913f7941e57764
          git -C candidate rev-parse HEAD HEAD:partitionline-broker/src/produce.rs HEAD:partitionline-broker/Cargo.toml HEAD:partitionline-broker/Cargo.lock
          git -C baseline rev-parse HEAD HEAD:partitionline-broker/src/produce.rs HEAD:partitionline-broker/Cargo.toml HEAD:partitionline-broker/Cargo.lock
          cp candidate/partitionline-broker/tests/produce_dense_partitions.rs candidate/partitionline-broker/tests/produce_dense_bench.rs baseline/partitionline-broker/tests/
          cmp candidate/partitionline-broker/tests/produce_dense_partitions.rs baseline/partitionline-broker/tests/produce_dense_partitions.rs
          cmp candidate/partitionline-broker/tests/produce_dense_bench.rs baseline/partitionline-broker/tests/produce_dense_bench.rs
          sha256sum candidate/partitionline-broker/src/produce.rs baseline/partitionline-broker/src/produce.rs candidate/partitionline-broker/tests/produce_dense_partitions.rs baseline/partitionline-broker/tests/produce_dense_partitions.rs candidate/partitionline-broker/tests/produce_dense_bench.rs baseline/partitionline-broker/tests/produce_dense_bench.rs
          rustc -Vv
          cargo -V
          lscpu
          if test -r /sys/fs/cgroup/cpu.max; then cat /sys/fs/cgroup/cpu.max; else echo 'cpu.max unavailable'; fi
          df -T "$RUNNER_TEMP"
      - name: Build independent baseline and candidate executables
        run: |
          set -euo pipefail
          for arm in baseline candidate; do
            CARGO_TARGET_DIR="$PWD/target-$arm" cargo test --locked --release --manifest-path "$arm/partitionline-broker/Cargo.toml" --test produce_dense_partitions --no-run
            CARGO_TARGET_DIR="$PWD/target-$arm" cargo test --locked --release --manifest-path "$arm/partitionline-broker/Cargo.toml" --test produce_dense_bench --no-run
          done
      - name: Run alternating matched measurements and verify outcomes
        run: python3 candidate/.github/fixtures/broker_dense_driver.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dense-produce-matched-samples
          path: dense-timings.csv
          if-no-files-found: warn
