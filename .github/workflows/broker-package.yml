name: Broker archive

on:
  push:
    branches: [main, qualification/broker-archive-n20]
    paths:
      - 'partitionline-broker/**'
      - 'scripts/broker-package.sh'
      - 'scripts/check-package-docs.py'
      - 'scripts/check-doc-examples.py'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'
      - 'NOTICE'
      - '.github/workflows/broker-package.yml'
  pull_request:
    paths:
      - 'partitionline-broker/**'
      - 'scripts/broker-package.sh'
      - 'scripts/check-package-docs.py'
      - 'scripts/check-doc-examples.py'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'
      - 'NOTICE'
      - '.github/workflows/broker-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  broker-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check broker formatting
        run: cargo +stable fmt --manifest-path partitionline-broker/Cargo.toml --check
      - name: Package, install, and verify the local operator
        run: sh scripts/broker-package.sh
      - name: Verify navigation in the client archive
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/broker-package-client-docs"
          cargo +stable package --locked --no-verify
          mkdir "$CARGO_TARGET_DIR/extracted"
          set -- "$CARGO_TARGET_DIR"/package/partitionline-*.crate
          test "$#" -eq 1
          archive=$1
          name=${archive##*/}
          tar -xzf "$archive" -C "$CARGO_TARGET_DIR/extracted"
          python3 -B scripts/check-package-docs.py "$CARGO_TARGET_DIR/extracted/${name%.crate}" \
            --report target/broker-package/client-package-docs.json
      - name: Retain the archive, checksums, and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: broker-archive-${{ github.sha }}
          path: target/broker-package/
          if-no-files-found: warn
          retention-days: 30
