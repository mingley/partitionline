name: Broker archive

on:
  push:
    branches: [main, qualification/broker-archive-serving-n20]
    paths:
      - 'partitionline-broker/**'
      - 'scripts/broker-package.sh'
      - 'scripts/broker-package-serving.py'
      - 'tests/conformance/broker/interop/ArchiveProducePeer.java'
      - 'tests/conformance/broker/interop/CrossReadPeer.java'
      - 'tests/conformance/broker/interop/pins.json'
      - 'scripts/check-package-docs.py'
      - 'scripts/check-doc-examples.py'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'
      - 'NOTICE'
      - 'clippy.toml'
      - '.github/workflows/broker-package.yml'
  pull_request:
    paths:
      - 'partitionline-broker/**'
      - 'scripts/broker-package.sh'
      - 'scripts/broker-package-serving.py'
      - 'tests/conformance/broker/interop/ArchiveProducePeer.java'
      - 'tests/conformance/broker/interop/CrossReadPeer.java'
      - 'tests/conformance/broker/interop/pins.json'
      - 'scripts/check-package-docs.py'
      - 'scripts/check-doc-examples.py'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'
      - 'NOTICE'
      - 'clippy.toml'
      - '.github/workflows/broker-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  broker-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check broker formatting
        run: cargo +stable fmt --manifest-path partitionline-broker/Cargo.toml --check
      - name: Verify the installed admin and serving workflows
        run: sh scripts/broker-package.sh --serve
      - name: Retain the archive, checksums, and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: broker-archive-${{ github.sha }}
          path: target/broker-package/
          if-no-files-found: warn
          retention-days: 30
