name: Producer drain staging clean controls
on:
  push:
    branches:
      - qualification/producer-drain-staging-clean-20261110
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Record source
        run: |
          rustc --version
          git rev-parse HEAD
          git hash-object src/producer.rs
      - name: Focused drain controls
        run: |
          cargo test --locked --lib producer::tests::grouping_drain_ -- --test-threads=1
          cargo test --locked --all-features --lib producer::tests::grouping_drain_ -- --test-threads=1
      - name: Aggregate producer unit tests
        run: |
          set -u
          failed=0
          for profile in default all-features; do
            if test "$profile" = default; then
              cargo test --locked --lib producer::tests:: -- --test-threads=1 > "$RUNNER_TEMP/producer-$profile.log" 2>&1
            else
              cargo test --locked --all-features --lib producer::tests:: -- --test-threads=1 > "$RUNNER_TEMP/producer-$profile.log" 2>&1
            fi
            code=$?
            echo "candidate_producer=$profile exit=$code"
            grep -E '^test result:' "$RUNNER_TEMP/producer-$profile.log" || true
            if test "$code" -ne 0; then failed=1; fi
          done
          exit "$failed"
      - name: Formatting
        if: always()
        run: cargo fmt --all -- --check
      - name: Strict test lint
        if: always()
        run: cargo clippy --locked --all-features --lib --tests -- -D warnings
      - name: Strict rustdoc
        if: always()
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: dtolnay/rust-toolchain@stable
      - name: Create baseline with candidate controls
        run: |
          rustc --version
          git worktree add --detach "$RUNNER_TEMP/drain-baseline" 8570b01da6693acbcaa66120c861c5fd689628c4
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          candidate = Path("src/producer.rs").read_bytes()
          path = Path(os.environ["RUNNER_TEMP"]) / "drain-baseline/src/producer.rs"
          baseline = path.read_bytes()
          marker = b"#[cfg(test)]\nmod tests {"
          if baseline.count(marker) != 1 or candidate.count(marker) != 1:
              raise ValueError("missing unique test module")
          prefix = baseline.split(marker, 1)[0]
          tests = candidate.split(marker, 1)[1]
          print("baseline_prefix_sha256=" + hashlib.sha256(prefix).hexdigest())
          path.write_bytes(prefix + marker + tests)
          PY
          git -C "$RUNNER_TEMP/drain-baseline" hash-object src/producer.rs
      - name: Expected baseline failures
        run: |
          set -eu
          cd "$RUNNER_TEMP/drain-baseline"
          for profile in default all-features; do
            set +e
            if test "$profile" = default; then
              cargo test --locked --lib producer::tests::grouping_drain_ -- --test-threads=1 > "$RUNNER_TEMP/baseline-$profile.log" 2>&1
            else
              cargo test --locked --all-features --lib producer::tests::grouping_drain_ -- --test-threads=1 > "$RUNNER_TEMP/baseline-$profile.log" 2>&1
            fi
            code=$?
            set -e
            echo "baseline=$profile exit=$code"
            grep -E 'test result:|grouping_drain_(cancellation_retains_receipts|cancellation_during_deadline_scan|worker_abort_restores_before_drop)' "$RUNNER_TEMP/baseline-$profile.log" || true
            test "$code" -ne 0
            grep -Fx 'test producer::tests::grouping_drain_cancellation_retains_receipts ... FAILED' "$RUNNER_TEMP/baseline-$profile.log"
            grep -Fx 'test producer::tests::grouping_drain_cancellation_during_deadline_scan ... FAILED' "$RUNNER_TEMP/baseline-$profile.log"
            grep -Fx 'test producer::tests::grouping_drain_worker_abort_restores_before_drop ... FAILED' "$RUNNER_TEMP/baseline-$profile.log"
            grep -Fx 'test producer::tests::grouping_drain_open_worker_requeues_restored_records ... FAILED' "$RUNNER_TEMP/baseline-$profile.log"
            grep -Fx 'test producer::tests::grouping_drain_open_worker_closed_retry_completes_records ... FAILED' "$RUNNER_TEMP/baseline-$profile.log"
            grep -Fx 'test producer::tests::grouping_drain_open_worker_full_retry_completes_records ... FAILED' "$RUNNER_TEMP/baseline-$profile.log"
            grep -Fx 'test producer::tests::grouping_drain_worker_drop_without_runtime ... FAILED' "$RUNNER_TEMP/baseline-$profile.log"
            grep -F 'test result: FAILED. 4 passed; 7 failed; 0 ignored' "$RUNNER_TEMP/baseline-$profile.log"
          done
      - name: Aggregate baseline producer unit tests
        if: always()
        run: |
          set -u
          git -C "$RUNNER_TEMP/drain-baseline" checkout -- src/producer.rs || exit 1
          cd "$RUNNER_TEMP/drain-baseline" || exit 1
          source_blob=$(git hash-object src/producer.rs) || exit 1
          echo "baseline_source_blob=$source_blob"
          test "$source_blob" = 426dbdb5c5e27fdf655930a76682c5c18fb07e89 || exit 1
          failed=0
          for profile in default all-features; do
            if test "$profile" = default; then
              cargo test --locked --lib producer::tests:: -- --test-threads=1 > "$RUNNER_TEMP/base-producer-$profile.log" 2>&1
            else
              cargo test --locked --all-features --lib producer::tests:: -- --test-threads=1 > "$RUNNER_TEMP/base-producer-$profile.log" 2>&1
            fi
            code=$?
            echo "baseline_producer=$profile exit=$code"
            grep -E '^test result:' "$RUNNER_TEMP/base-producer-$profile.log" || true
            if test "$code" -ne 0; then failed=1; fi
          done
          exit "$failed"
      - name: Retain baseline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drain-staging-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/baseline-*.log
          if-no-files-found: warn
