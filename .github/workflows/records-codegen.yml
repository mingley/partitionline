name: Record validation x86 codegen diagnostic
on:
  push:
    branches:
      - qualification/records-codegen-20261108
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          ref: ba8d72f51c23b4bfbd1057e61bbd483da831aa91
          path: baseline
      - uses: actions/checkout@v7
        with:
          ref: 981729e409cd994eebbea8df92c82627a968e70d
          path: candidate
      - uses: dtolnay/rust-toolchain@stable
      - name: Build, measure and retain disassembly
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/records-codegen"
          mkdir -p "$out"
          rustc +stable -Vv | tee "$out/rust.txt"
          sha256sum harness/.github/qualification/records_header_bench.rs baseline/partitionline-broker/src/records.rs candidate/partitionline-broker/src/records.rs | tee "$out/source.txt"
          for arm in baseline candidate; do
            mkdir -p "$arm/partitionline-broker/examples"
            cp harness/.github/qualification/records_header_bench.rs "$arm/partitionline-broker/examples/records_header_bench.rs"
            CARGO_TARGET_DIR="$RUNNER_TEMP/records-target-$arm" cargo +stable build --release --locked --manifest-path "$arm/partitionline-broker/Cargo.toml" --example records_header_bench
            bin="$RUNNER_TEMP/records-target-$arm/release/examples/records_header_bench"
            sha256sum "$bin" | tee "$out/$arm.binary"
            nm -S -C --defined-only "$bin" > "$out/$arm.symbols"
            objdump -d -C --no-show-raw-insn "$bin" > "$RUNNER_TEMP/$arm.full-disassembly"
          done
          python3 - "$RUNNER_TEMP" "$out" <<'PY'
          import pathlib, re, sys
          tmp, out = map(pathlib.Path, sys.argv[1:])
          for arm in ("baseline", "candidate"):
              data = (tmp / f"{arm}.full-disassembly").read_text()
              chunks = re.split(r"(?m)^(?=[0-9a-f]+ <)", data)
              selected = [c for c in chunks if c.splitlines() and "partitionline_broker::records::" in c.splitlines()[0]]
              (out / f"{arm}.records.asm").write_text("\n".join(selected))
              print(f"--- {arm} record function bodies ---")
              for chunk in selected:
                  lines = chunk.splitlines()
                  print(lines[0], "lines=", len(lines))
                  if any(term in lines[0] for term in ("validate", "try_accept_plain", "scan_header_prefix")):
                      for line in lines[1:]:
                          print(line)
          PY
          cpu="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          for pair in $(seq 1 8); do
            if (( pair % 2 )); then arms="baseline candidate"; else arms="candidate baseline"; fi
            for arm in $arms; do
              taskset -c "$cpu" "$RUNNER_TEMP/records-target-$arm/release/examples/records_header_bench" many_plain > "$out/many_plain.$arm.$pair" 2> "$out/many_plain.$arm.$pair.input"
            done
          done
          python3 - "$out" <<'PY'
          import pathlib, statistics, sys
          root = pathlib.Path(sys.argv[1])
          pairs=[]
          for n in range(1,9):
              med={}
              for arm in ("baseline", "candidate"):
                  rows=(root/f"many_plain.{arm}.{n}").read_text().splitlines()
                  assert len(rows)==7
                  med[arm]=statistics.median(int(row.split()[3])/int(row.split()[2]) for row in rows)
              pairs.append(med["candidate"]/med["baseline"])
          print("many_plain paired candidate/baseline: " + ",".join(f"{v:.4f}" for v in pairs))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: records-codegen-${{ github.run_id }}
          path: ${{ runner.temp }}/records-codegen
          if-no-files-found: warn
          retention-days: 30
