name: Cooperative copy timing witness
on:
  push:
    branches: [qualification/capacity-coop-microbench-20261108]
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Measure cooperative copy poll intervals
        shell: bash
        run: |
          set -euo pipefail
          date -u
          uname -a
          rustc +stable --version --verbose
          lscpu
          cat > "$RUNNER_TEMP/cooperative_copy.rs" <<'RS'
          use std::{future::Future, hint::black_box, pin::Pin, sync::Arc, task::{Context, Poll, Wake, Waker}, time::Instant};
          struct Noop;
          impl Wake for Noop { fn wake(self: Arc<Self>) {} }
          struct YieldOnce(bool);
          impl Future for YieldOnce {
              type Output = ();
              fn poll(mut self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<()> {
                  if self.0 { Poll::Ready(()) } else { self.0 = true; cx.waker().wake_by_ref(); Poll::Pending }
              }
          }
          #[inline(never)]
          async fn bound(source: Vec<u8>, maximum: usize, chunk: usize) -> Result<Vec<u8>, ()> {
              if source.capacity() <= maximum { return Ok(source); }
              if source.len() > maximum { return Err(()); }
              let mut replacement = Vec::new();
              replacement.try_reserve_exact(source.len()).map_err(|_| ())?;
              if replacement.capacity() > maximum { return Err(()); }
              for part in source.chunks(chunk) {
                  replacement.extend_from_slice(part);
                  if replacement.len() < source.len() { YieldOnce(false).await; }
              }
              Ok(replacement)
          }
          fn main() {
              let waker = Waker::from(Arc::new(Noop));
              let mut context = Context::from_waker(&waker);
              for length in [8_388_608usize, 67_108_864] {
                  for chunk in [65_536usize, 262_144, 1_048_576] {
                      let mut totals = Vec::new();
                      let mut all_polls = Vec::new();
                      for trial in 0..10 {
                          let mut source = Vec::with_capacity(length + 1);
                          source.resize(length, 0xa5);
                          let mut future = Box::pin(bound(black_box(source), length, chunk));
                          let total_start = Instant::now();
                          let result = loop {
                              let started = Instant::now();
                              let poll = future.as_mut().poll(&mut context);
                              all_polls.push(started.elapsed().as_nanos());
                              if let Poll::Ready(result) = poll { break result.unwrap(); }
                          };
                          let total = total_start.elapsed().as_nanos();
                          assert_eq!(result.len(), length);
                          assert!(result.capacity() <= length);
                          assert!(result.iter().all(|v| *v == 0xa5));
                          black_box(&result);
                          totals.push(total);
                          println!("trial,{length},{chunk},{trial},{total}");
                      }
                      totals.sort_unstable();
                      all_polls.sort_unstable();
                      let n = all_polls.len();
                      let p99 = all_polls[(n * 99 / 100).min(n - 1)];
                      println!("summary,{length},{chunk},trials,10,polls,{n},total_min,{},total_median,{},total_max,{},poll_median,{},poll_p99,{p99},poll_max,{}", totals[0], totals[5], totals[9], all_polls[n / 2], all_polls[n - 1]);
                  }
              }
          }
          RS
          sha256sum "$RUNNER_TEMP/cooperative_copy.rs"
          rustc +stable -O --edition 2024 "$RUNNER_TEMP/cooperative_copy.rs" -o "$RUNNER_TEMP/cooperative_copy"
          sha256sum "$RUNNER_TEMP/cooperative_copy"
          "$RUNNER_TEMP/cooperative_copy"
