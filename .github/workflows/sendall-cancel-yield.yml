name: Isolated public send_all v5 cancellation histories
on:
  push:
    branches:
      - qualification/sendall-cancel-v5-20261108
  workflow_dispatch:
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: [default, all]
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 2
      - uses: actions/checkout@v4
        with:
          ref: 47df27f9f3e04fc524849f3a9753c0b0469f8947
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
      - name: Record exact sources and compiler
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C candidate rev-parse HEAD^)" = a781fbf47e724d04d37426e2b1c6b13dc2692003
          test "$(git -C baseline rev-parse HEAD)" = 47df27f9f3e04fc524849f3a9753c0b0469f8947
          test "$(git -C candidate rev-parse HEAD:src/producer.rs)" = 650e34cca0cfa0bee9825ffc7d7da86514e28a31
          test "$(git -C baseline rev-parse HEAD:src/producer.rs)" = 1e7733c136e54b532cdc8bddabd1e0c828e50ed2
          cp candidate/tests/sendall_cancel_yield.rs baseline/tests/sendall_cancel_yield.rs
          sha256sum candidate/src/producer.rs baseline/src/producer.rs candidate/tests/sendall_cancel_yield.rs baseline/tests/sendall_cancel_yield.rs candidate/tests/common/mod.rs baseline/tests/common/mod.rs
          rustc -vV
          cargo -V
          uname -a
      - name: Run matched baseline history
        shell: bash
        env:
          PL_EXPECTED_ACCEPTED: "1025"
          CARGO_TARGET_DIR: /tmp/sendall-cancel-v5-baseline
          FEATURES: ${{ matrix.features }}
        run: |
          set -euxo pipefail
          args=()
          if test "$FEATURES" = all; then args+=(--all-features); fi
          cd baseline
          cargo test --locked "${args[@]}" --test sendall_cancel_yield -- --test-threads=1 --nocapture 2>&1 | tee /tmp/sendall-v5-baseline.log
          find "$CARGO_TARGET_DIR/debug/deps" -maxdepth 1 -type f -name 'sendall_cancel_yield-*' -executable -exec sha256sum {} +
      - name: Run matched candidate history
        shell: bash
        env:
          PL_EXPECTED_ACCEPTED: "1025"
          CARGO_TARGET_DIR: /tmp/sendall-cancel-v5-candidate
          FEATURES: ${{ matrix.features }}
        run: |
          set -euxo pipefail
          args=()
          if test "$FEATURES" = all; then args+=(--all-features); fi
          cd candidate
          cargo test --locked "${args[@]}" --test sendall_cancel_yield -- --test-threads=1 --nocapture 2>&1 | tee /tmp/sendall-v5-candidate.log
          find "$CARGO_TARGET_DIR/debug/deps" -maxdepth 1 -type f -name 'sendall_cancel_yield-*' -executable -exec sha256sum {} +
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sendall-cancel-v5-${{ matrix.features }}
          path: /tmp/sendall-*.log
          if-no-files-found: warn
