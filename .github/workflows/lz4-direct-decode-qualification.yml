name: LZ4 bounded decode qualification
on:
  push:
    branches: [qualification/lz4-direct-decode-20261119]
    paths:
      - src/protocol/records.rs
      - benchmarks/codec/src/bin/lz4-decode-timing.rs
      - benchmarks/codec/lz4-decode-compare.py
      - .github/workflows/lz4-direct-decode-qualification.yml
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  BASE: 51a4d86ec8c0e51e1c6dd231487bfe27e0725a70
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format and strict lint
        run: |
          git rev-parse HEAD
          git hash-object src/protocol/records.rs
          rustc -Vv
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Bounded decoder and wire checks
        env:
          RUST_TEST_THREADS: '1'
        run: |
          cargo test --locked --lib protocol::records::tests::
          cargo test --locked --all-features --lib protocol::records::tests::
          cargo test --locked --all-features --test produce_wire_conformance produce_wire_committed_corpus -- --exact
