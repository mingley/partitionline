name: broker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The broker is excluded from the published client workspace. These explicit
# manifest checks exercise that independent crate; passing CI is not production
# qualification or permission to advertise unimplemented Kafka APIs.
jobs:
  broker-fuzz-supervisor:
    name: instrumented broker fuzz supervision (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build the actual instrumented broker targets
        run: python3 -B scripts/broker-fuzz-campaign.py build --output target/broker-fuzz-ci/build
      - name: Check source formatting
        run: cargo +stable fmt --manifest-path fuzz/broker/Cargo.toml --check
      - name: Strict fuzz harness Clippy
        working-directory: fuzz/broker
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/broker-fuzz-ci/build/target
        run: cargo +stable clippy --release --locked --target x86_64-unknown-linux-gnu --no-deps -- -D warnings
      - name: Exercise real workers, interruption, resume and artifact checks
        env:
          PL_BROKER_FUZZ_BUILD: ${{ github.workspace }}/target/broker-fuzz-ci/build
          PL_BROKER_FUZZ_TEST_OUTPUT: ${{ github.workspace }}/target/broker-fuzz-ci/tests
        run: |
          mkdir -p target/broker-fuzz-ci/tests
          python3 -B -m unittest discover -s tests/ci -p test_broker_fuzz_campaign.py -v
      - name: Retain short-run evidence and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: broker-fuzz-supervisor-${{ github.sha }}
          path: |
            target/broker-fuzz-ci/build/build.json
            target/broker-fuzz-ci/build/build.log
            target/broker-fuzz-ci/build/bin/
            target/broker-fuzz-ci/tests/
          if-no-files-found: error
          retention-days: 30

  broker:
    name: broker (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      CARGO_TARGET_DIR: target/broker-ci/${{ matrix.rust }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Independent TLS peer prerequisite
        run: openssl version
      - name: Broker format
        run: cargo fmt --manifest-path partitionline-broker/Cargo.toml -- --check
      - name: Locked default-feature behavioral tests
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-targets
      - name: Locked all-feature behavioral tests
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-targets --all-features
      - name: Strict all-feature broker Clippy
        run: cargo clippy --locked --manifest-path partitionline-broker/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Strict all-feature broker Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --manifest-path partitionline-broker/Cargo.toml --all-features --no-deps
      - name: Strict default-feature broker doctests
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --doc
      - name: Strict all-feature broker doctests
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --doc --all-features

  api-inventory:
    name: pinned Apache API inventory and negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify retained pinned Apache API inventory
        run: python3 -B scripts/check-broker-api-matrix.py --report target/broker-ci/api-matrix.json
      - name: Reject corrupted pins, inventories and unsupported claims
        run: python3 -B -m unittest discover -s tests/ci -p test_broker_api_matrix.py -v
      - name: Retain upstream inventory verdict, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: broker-api-inventory-${{ github.sha }}
          path: target/broker-ci/api-matrix.json
          if-no-files-found: error
          retention-days: 30
