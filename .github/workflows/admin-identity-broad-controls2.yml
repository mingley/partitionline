name: Admin matched baseline and candidate suites rerun
on:
  push:
    branches: [work/admin-identity-broad-controls2-20261108]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: admin-identity-broad-controls
          path: ${{ runner.temp }}/prior-admin-controls
          run-id: 42475935325
          github-token: ${{ github.token }}
      - name: Print captured prior baseline outcome
        shell: bash
        run: |
          set -euo pipefail
          ls -l "$RUNNER_TEMP/prior-admin-controls"
          grep -E 'test result:|test .* FAILED|thread .* panicked|held the caller for|failures:' "$RUNNER_TEMP/prior-admin-controls/default-baseline.log" || true

  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: e487f7294773f75112f15437992ed780b53c7307
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin and prebuild both profiles
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          lscpu | grep -E 'Model name|CPU\(s\)'
          cmp baseline/src/admin/pagination_tests.rs candidate/src/admin/pagination_tests.rs
          for arm in baseline candidate; do
            sha256sum "$arm/src/admin.rs" "$arm/src/admin/pagination_tests.rs" "$arm/Cargo.toml" "$arm/Cargo.lock"
            git -C "$arm" hash-object src/admin.rs src/admin/pagination_tests.rs
            for feature in default all; do
              if [ "$feature" = all ]; then flags=--all-features; else flags=; fi
              CARGO_TARGET_DIR="$RUNNER_TEMP/target-$arm" cargo test --locked $flags --manifest-path "$arm/Cargo.toml" --lib admin:: --no-run
            done
          done
      - name: Run complete matched Admin suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admin-controls"
          failures=0
          for pair in default:baseline default:candidate all:candidate all:baseline; do
            feature=${pair%%:*}
            arm=${pair##*:}
            if [ "$feature" = all ]; then flags=--all-features; else flags=; fi
            if CARGO_TARGET_DIR="$RUNNER_TEMP/target-$arm" cargo test --locked $flags --manifest-path "$arm/Cargo.toml" --lib admin:: -- --nocapture > "$RUNNER_TEMP/admin-controls/$feature-$arm.log" 2>&1; then
              status=0
            else
              status=$?
            fi
            printf 'CONTROL_RESULT feature=%s arm=%s status=%s\n' "$feature" "$arm" "$status"
            grep -E 'test result:|test .* FAILED|thread .* panicked|held the caller for|failures:' "$RUNNER_TEMP/admin-controls/$feature-$arm.log" || true
            if [ "$status" -ne 0 ]; then failures=1; fi
          done
          exit "$failures"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: admin-identity-broad-controls
          path: ${{ runner.temp }}/admin-controls/
          if-no-files-found: warn
          retention-days: 30
