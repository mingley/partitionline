name: Admin pagination loopback comparison
on:
  push:
    branches:
      - work/admin-pagination-perf-20261108
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - uses: dtolnay/rust-toolchain@stable
      - name: Build distinct baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          lscpu | grep -E 'Model name|CPU\(s\)'
          sha256sum src/admin.rs src/admin/pagination_tests.rs Cargo.lock
          cp src/admin.rs "$RUNNER_TEMP/candidate-admin.rs"
          CARGO_TARGET_DIR="$RUNNER_TEMP/candidate-target" cargo test --locked --release --lib dtp_pagination_benchmark --no-run
          git show HEAD~2:src/admin.rs > src/admin.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/admin.rs")
          data = path.read_text()
          needle = "mod offsets;\n"
          assert data.count(needle) == 1
          path.write_text(data.replace(needle, needle + "#[cfg(test)]\nmod pagination_tests;\n", 1))
          PY
          sha256sum src/admin.rs src/admin/pagination_tests.rs Cargo.lock
          CARGO_TARGET_DIR="$RUNNER_TEMP/baseline-target" cargo test --locked --release --lib dtp_pagination_benchmark --no-run
          cp "$RUNNER_TEMP/candidate-admin.rs" src/admin.rs
          for arm in baseline candidate; do
            binaries=()
            for f in "$RUNNER_TEMP/$arm-target"/release/deps/partitionline-*; do
              if [ -f "$f" ] && [ -x "$f" ]; then binaries+=("$f"); fi
            done
            test "${#binaries[@]}" = 1
            cp "${binaries[0]}" "$RUNNER_TEMP/$arm-binary"
          done
          sha256sum "$RUNNER_TEMP/baseline-binary" "$RUNNER_TEMP/candidate-binary"
          test "$(sha256sum "$RUNNER_TEMP/baseline-binary" | cut -d' ' -f1)" != "$(sha256sum "$RUNNER_TEMP/candidate-binary" | cut -d' ' -f1)"
      - name: Paired measurements
        shell: bash
        run: |
          set -euo pipefail
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          printf 'pinned_cpu=%s\n' "$cpu"
          printf 'block,shape,arm,elapsed_ns\n' > "$RUNNER_TEMP/results.csv"
          for block in $(seq 1 8); do
            if [ $((block % 2)) -eq 1 ]; then order=(baseline candidate); else order=(candidate baseline); fi
            for shape in single many_pages; do
              for arm in "${order[@]}"; do
                out=$(taskset -c "$cpu" "$RUNNER_TEMP/$arm-binary" --exact "admin::pagination_tests::dtp_pagination_benchmark_$shape" --ignored --nocapture)
                printf '%s\n' "$out"
                ns=$(printf '%s\n' "$out" | sed -n 's/.*MEASURE .* elapsed_ns=\([0-9]*\).*/\1/p')
                test -n "$ns"
                printf '%s,%s,%s,%s\n' "$block" "$shape" "$arm" "$ns" >> "$RUNNER_TEMP/results.csv"
              done
            done
          done
          cat "$RUNNER_TEMP/results.csv"
          python3 - "$RUNNER_TEMP/results.csv" <<'PY'
          import csv, statistics, sys
          rows=list(csv.DictReader(open(sys.argv[1])))
          for shape in ('single','many_pages'):
              pairs=[]
              for block in range(1,9):
                  pair={r['arm']:int(r['elapsed_ns']) for r in rows if r['shape']==shape and int(r['block'])==block}
                  pairs.append(pair['candidate']/pair['baseline'])
              print(shape, 'median_ratio', statistics.median(pairs), 'range', min(pairs), max(pairs), 'slower',sum(x>1 for x in pairs))
          PY
