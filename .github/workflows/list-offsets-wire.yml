name: Apache ListOffsets wire
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/protocol/offsets.rs'
      - 'src/protocol/buf.rs'
      - 'src/error.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'rust-toolchain.toml'
      - 'tests/conformance/java/pins.json'
      - 'tests/conformance/java/generate_metadata_wire.py'
      - 'tests/conformance/java/ConformanceListOffsetsWire.java'
      - 'tests/conformance/java/generate_list_offsets_wire.py'
      - 'tests/list_offsets_wire_conformance.rs'
      - 'tests/fixtures/list_offsets_wire/**'
      - '.github/workflows/list-offsets-wire.yml'
  pull_request:
    paths:
      - 'src/protocol/offsets.rs'
      - 'src/protocol/buf.rs'
      - 'src/error.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'rust-toolchain.toml'
      - 'tests/conformance/java/pins.json'
      - 'tests/conformance/java/generate_metadata_wire.py'
      - 'tests/conformance/java/ConformanceListOffsetsWire.java'
      - 'tests/conformance/java/generate_list_offsets_wire.py'
      - 'tests/list_offsets_wire_conformance.rs'
      - 'tests/fixtures/list_offsets_wire/**'
      - '.github/workflows/list-offsets-wire.yml'
permissions:
  contents: read
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Record source and toolchain
        run: |
          git rev-parse HEAD
          rustc --version
          java -version
          sha256sum tests/conformance/java/ConformanceListOffsetsWire.java tests/conformance/java/generate_list_offsets_wire.py tests/list_offsets_wire_conformance.rs tests/fixtures/list_offsets_wire/apache-v1-v11.txt
      - name: Compare Apache and Rust bodies
        run: timeout 900s python3 -B tests/conformance/java/generate_list_offsets_wire.py --output target/list-offsets-wire
      - name: Match the committed Apache corpus
        run: cmp target/list-offsets-wire/4.3.1/apache.txt tests/fixtures/list_offsets_wire/apache-v1-v11.txt
      - name: Offline corpus in the checkout
        run: |
          cargo test --locked --test list_offsets_wire_conformance list_offsets_wire_committed_corpus -- --exact
          cargo test --locked --all-features --test list_offsets_wire_conformance list_offsets_wire_committed_corpus -- --exact
      - name: Offline corpus in the packaged crate
        run: |
          test -z "$(git status --porcelain)"
          cargo package --locked --no-verify
          crate_stem=$(python3 -c 'import tomllib; p=tomllib.load(open("Cargo.toml","rb"))["package"]; print(p["name"]+"-"+p["version"])')
          package_dir="$RUNNER_TEMP/list-offsets-wire-package"
          mkdir "$package_dir"
          tar -xzf "target/package/$crate_stem.crate" -C "$package_dir"
          manifest="$package_dir/$crate_stem/Cargo.toml"
          test -f "$package_dir/$crate_stem/tests/fixtures/list_offsets_wire/apache-v1-v11.txt"
          export CARGO_TARGET_DIR="$package_dir/target"
          cargo test --locked --manifest-path "$manifest" --test list_offsets_wire_conformance list_offsets_wire_committed_corpus -- --exact
          cargo test --locked --all-features --manifest-path "$manifest" --test list_offsets_wire_conformance list_offsets_wire_committed_corpus -- --exact
      - name: Check formatting
        if: always()
        run: cargo fmt --all -- --check
      - name: Strict test lint
        if: always()
        run: cargo clippy --locked --all-features --test list_offsets_wire_conformance -- -D warnings
      - name: Retain fixtures and process receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: list-offsets-wire-${{ github.sha }}
          path: |
            target/list-offsets-wire/**/*.txt
            target/list-offsets-wire/**/*.log
            target/list-offsets-wire/**/*.json
          if-no-files-found: warn
          retention-days: 30
