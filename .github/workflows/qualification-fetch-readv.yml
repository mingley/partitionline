name: Isolated indexed Fetch qualification
on:
  push:
    branches: [qualification/broker-fetch-readv-20261109]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            partitionline-broker
            src
      - uses: dtolnay/rust-toolchain@stable
      - name: Environment
        run: |
          rustc -Vv
          cargo -V
          uname -a
          lscpu
          sha256sum partitionline-broker/src/journal.rs partitionline-broker/Cargo.lock partitionline-broker/tests/fetch_vectored_bench.rs
      - name: Prepare candidate outside the root workspace
        run: cp -a partitionline-broker "$RUNNER_TEMP/candidate-broker"
      - name: Ordinary read correctness
        run: |
          cargo test --manifest-path "$RUNNER_TEMP/candidate-broker/Cargo.toml" --locked --lib indexed_fetch_
          cargo test --manifest-path "$RUNNER_TEMP/candidate-broker/Cargo.toml" --locked --test fetch independent_apache_read_goldens
          cargo test --manifest-path "$RUNNER_TEMP/candidate-broker/Cargo.toml" --locked --test fetch global_first_batch_exception_and_request_order_preserve_capped_reads
          cargo test --manifest-path "$RUNNER_TEMP/candidate-broker/Cargo.toml" --locked --test fetch transport_deadline_cancels_wait_and_releases_read_admission
      - name: Preview candidate formatting
        run: |
          cp partitionline-broker/src/journal.rs "$RUNNER_TEMP/formatted-journal.rs"
          rustfmt --edition 2021 "$RUNNER_TEMP/formatted-journal.rs"
          diff -u partitionline-broker/src/journal.rs "$RUNNER_TEMP/formatted-journal.rs" || true
      - name: Check out baseline commit
        uses: actions/checkout@v4
        with:
          ref: 133d2413217cee4130bca2267e4e36b7225ff86f
          path: baseline
          sparse-checkout: partitionline-broker
      - name: Compile paired workloads
        run: |
          git -C baseline rev-parse HEAD
          cp -a baseline/partitionline-broker "$RUNNER_TEMP/baseline-broker"
          cp partitionline-broker/tests/fetch_vectored_bench.rs "$RUNNER_TEMP/baseline-broker/tests/"
          sha256sum "$RUNNER_TEMP/baseline-broker/src/journal.rs" "$RUNNER_TEMP/baseline-broker/tests/fetch_vectored_bench.rs"
          CARGO_TARGET_DIR="$RUNNER_TEMP/base-target" cargo test --manifest-path "$RUNNER_TEMP/baseline-broker/Cargo.toml" --locked --release --test fetch_vectored_bench --no-run
          CARGO_TARGET_DIR="$RUNNER_TEMP/candidate-target" cargo test --manifest-path "$RUNNER_TEMP/candidate-broker/Cargo.toml" --locked --release --test fetch_vectored_bench --no-run
          find "$RUNNER_TEMP/base-target/release/deps" -maxdepth 1 -type f -name 'fetch_vectored_bench-*' -executable -exec cp {} "$RUNNER_TEMP/base-bench" \;
          find "$RUNNER_TEMP/candidate-target/release/deps" -maxdepth 1 -type f -name 'fetch_vectored_bench-*' -executable -exec cp {} "$RUNNER_TEMP/candidate-bench" \;
          sha256sum "$RUNNER_TEMP/base-bench" "$RUNNER_TEMP/candidate-bench"
      - name: Alternating complete Fetch samples
        shell: bash
        run: |
          set -euo pipefail
          export PL_FETCH_BENCH_DIR="$RUNNER_TEMP/fetch-data"
          export PL_FETCH_BENCH_ITERS=100
          cpu_list=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')
          printf 'paired CPU affinity: %s\n' "$cpu_list"
          PL_FETCH_BENCH_SEED=1 taskset -c "$cpu_list" "$RUNNER_TEMP/candidate-bench" --ignored --exact successful_fetch_bench --nocapture
          taskset -c "$cpu_list" "$RUNNER_TEMP/base-bench" --ignored --exact successful_fetch_bench --nocapture
          for pair in $(seq 1 12); do
            if ((pair % 2)); then order="base candidate"; else order="candidate base"; fi
            for implementation in $order; do
              printf 'PL_PAIR pair=%s implementation=%s\n' "$pair" "$implementation"
              taskset -c "$cpu_list" "$RUNNER_TEMP/$implementation-bench" --ignored --exact successful_fetch_bench --nocapture
            done
          done
  windows-control:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            partitionline-broker
            src
      - uses: dtolnay/rust-toolchain@stable
      - name: Check ordinary Fetch on Windows
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP "candidate-broker"
          Copy-Item -Recurse -Path partitionline-broker -Destination $candidate
          $manifest = Join-Path $candidate "Cargo.toml"
          $sourcePath = Join-Path $candidate "src/journal.rs"
          $source = [System.IO.File]::ReadAllText($sourcePath)
          $start = $source.IndexOf("    fn indexed_fetch_file_rejects_corrupt_payload_and_rolls_back")
          $end = $source.IndexOf("    #[test]", $start)
          if ($start -lt 0 -or $end -le $start) { throw "Cannot locate diagnostic test" }
          $block = $source.Substring($start, $end - $start)
          $markers = @(
            @('let root = ownership_test_dir("fetch-corrupt")?;', 'create-scratch'),
            @('let (mut log, _) = Journal::open(&path, 0, Limits::default())?;', 'open-journal'),
            @('log.append(1, b"the payload")?;', 'append'),
            @('let mut disk = OpenOptions::new().write(true).open(&path)?;', 'open-second-writer'),
            @('disk.seek(SeekFrom::Start((FILE_HEADER + ENTRY_HEADER) as u64))?;', 'seek-second-writer'),
            @('disk.write_all(b"X")?;', 'write-second-writer'),
            @('std::fs::remove_dir_all(root)?;', 'cleanup')
          )
          foreach ($item in $markers) {
            if (-not $block.Contains($item[0])) { throw "Missing marker $($item[1])" }
            $replacement = 'eprintln!("PL_WINDOWS_PHASE ' + $item[1] + '");' + "`n        " + $item[0]
            $block = $block.Replace($item[0], $replacement)
          }
          $source = $source.Substring(0, $start) + $block + $source.Substring($end)
          [System.IO.File]::WriteAllText($sourcePath, $source, [System.Text.UTF8Encoding]::new($false))
          rustc -Vv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path $manifest --locked --lib indexed_fetch_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path $manifest --locked --test fetch global_first_batch_exception_and_request_order_preserve_capped_reads
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
