name: Produce quota bounded draft controls
on:
  push:
    branches: [qualification/produce-bandwidth-draft-20261109]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            partitionline-broker
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify pinned draft inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:partitionline-broker/src/metadata.rs)" = 068398b7286d71e86dbb1a935405e22e4fd44ce8
          test "$(git rev-parse HEAD:partitionline-broker/src/produce.rs)" = 1e3c33b71e02c5e3abf749f2c390201c26037faf
          test "$(git rev-parse HEAD:partitionline-broker/src/transport.rs)" = 716224559aff2b10819ecd05d6d67bfd2a5483ca
          test "$(git rev-parse HEAD:partitionline-broker/src/metadata/bandwidth.rs)" = 4bee5c86adbf4e82609428fcdcf09e7e43ee0885
          test "$(git rev-parse HEAD:partitionline-broker/tests/produce_quota.rs)" = 0e4d8269eee157cf337d5e31934c874c0908212c
          test "$(git rev-parse HEAD:partitionline-broker/Cargo.lock)" = 19652acd96b929402b1e4a9394a33d12a7e69449
          rustc -Vv
          sha256sum partitionline-broker/src/metadata.rs partitionline-broker/src/produce.rs partitionline-broker/src/transport.rs partitionline-broker/src/metadata/bandwidth.rs partitionline-broker/tests/produce_quota.rs partitionline-broker/Cargo.lock
          cp -a partitionline-broker "$RUNNER_TEMP/isolated-broker"
      - name: Compile all-feature library
        run: cargo check --locked --manifest-path "$RUNNER_TEMP/isolated-broker/Cargo.toml" --lib --all-features
      - name: Default feature boundary controls
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path "$RUNNER_TEMP/isolated-broker/Cargo.toml" --lib bounded_control_tests
          cargo test --locked --manifest-path "$RUNNER_TEMP/isolated-broker/Cargo.toml" --lib metadata::bandwidth::tests
          cargo test --locked --manifest-path "$RUNNER_TEMP/isolated-broker/Cargo.toml" --lib quota_accounting_tests
          cargo test --locked --manifest-path "$RUNNER_TEMP/isolated-broker/Cargo.toml" --test produce_quota
      - name: All-feature boundary controls
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path "$RUNNER_TEMP/isolated-broker/Cargo.toml" --lib --all-features bounded_control_tests
          cargo test --locked --manifest-path "$RUNNER_TEMP/isolated-broker/Cargo.toml" --lib --all-features metadata::bandwidth::tests
          cargo test --locked --manifest-path "$RUNNER_TEMP/isolated-broker/Cargo.toml" --lib --all-features quota_accounting_tests
          cargo test --locked --manifest-path "$RUNNER_TEMP/isolated-broker/Cargo.toml" --test produce_quota --all-features
