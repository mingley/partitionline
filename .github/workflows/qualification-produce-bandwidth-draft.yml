name: Produce quota draft compile controls
on:
  push:
    branches: [qualification/produce-bandwidth-draft-20261109]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            partitionline-broker
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify pinned draft inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:partitionline-broker/src/metadata.rs)" = cb2691a9cf1376f672ecddae57ecae17b88bbc8b
          test "$(git rev-parse HEAD:partitionline-broker/src/produce.rs)" = eef46eba9f965ae3d0446d08b4772a1ed014e191
          test "$(git rev-parse HEAD:partitionline-broker/src/transport.rs)" = a5dd6531473ba1b3b5bd8de233c3a78dce50a1c4
          test "$(git rev-parse HEAD:partitionline-broker/src/metadata/bandwidth.rs)" = 4bdf75bf25745c56d2e0d637ea2fa6697cd7bb8d
          test "$(git rev-parse HEAD:partitionline-broker/Cargo.lock)" = 19652acd96b929402b1e4a9394a33d12a7e69449
          rustc -Vv
          sha256sum partitionline-broker/src/metadata.rs partitionline-broker/src/produce.rs partitionline-broker/src/transport.rs partitionline-broker/src/metadata/bandwidth.rs partitionline-broker/Cargo.lock
      - name: Compile isolated broker and meter controls
        run: |
          set -euo pipefail
          cp -a partitionline-broker "$RUNNER_TEMP/isolated-broker"
          cargo check --locked --manifest-path "$RUNNER_TEMP/isolated-broker/Cargo.toml" --lib --all-features
          cargo test --locked --manifest-path "$RUNNER_TEMP/isolated-broker/Cargo.toml" --lib metadata::bandwidth::tests
