name: quota clock full broker tests
on:
  push:
    branches: [qualification/broker-quota-clock-full-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [default, all]
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 06a39aa3149d9cdee7607c4b1b30da24e5189c8f
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          rustc -Vv
          test "$(git hash-object partitionline-broker/src/quotas.rs)" = e873fc35cb8c2ae88884e4175d81d08844413c77
          test "$(git hash-object partitionline-broker/tests/quotas_clock.rs)" = 2b39b2f086180d6d709e541cc13ec932c578ffd9
          git rev-parse HEAD
          sha256sum partitionline-broker/src/quotas.rs partitionline-broker/tests/quotas_clock.rs partitionline-broker/Cargo.lock
      - name: Standard locked broker behavioral suite
        shell: bash
        run: |
          set -uo pipefail
          features=()
          if [[ "$PROFILE" == all ]]; then features=(--all-features); fi
          set +e
          cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-targets "${features[@]}" 2>&1 | tee "$RUNNER_TEMP/quota-full-broker.log"
          status=${PIPESTATUS[0]}
          set -e
          python3 - "$RUNNER_TEMP/quota-full-broker.log" <<'PY'
          import re
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(errors="replace")
          results = re.findall(r"test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;", text)
          total = tuple(sum(int(row[i]) for row in results) for i in range(3))
          print("BROKER_BEHAVIOR_TOTAL passed=%d failed=%d ignored=%d executables=%d" % (*total, len(results)))
          PY
          exit "$status"
      - name: Retain behavioral log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quota-clock-full-broker-${{ matrix.profile }}
          path: ${{ runner.temp }}/quota-full-broker.log
          if-no-files-found: warn
