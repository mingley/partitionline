name: Admin paginated topic identity qualification
on:
  push:
    branches: [work/admin-identity-final-20261108]
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        feature: [default, all]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin source and toolchain
        run: |
          rustc -Vv
          sha256sum src/admin.rs src/admin/pagination_tests.rs Cargo.lock
          git hash-object src/admin.rs src/admin/pagination_tests.rs
      - name: Focused pagination controls
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.feature }}" = all ]; then flags=--all-features; else flags=; fi
          cargo test --locked $flags --lib admin::pagination_tests -- --nocapture
      - name: Full Admin suite
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.feature }}" = all ]; then flags=--all-features; else flags=; fi
          cargo test --locked $flags --lib admin:: -- --nocapture
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Pin source, check formatting and strict Clippy
        run: |
          rustc -Vv
          sha256sum src/admin.rs src/admin/pagination_tests.rs Cargo.lock
          git hash-object src/admin.rs src/admin/pagination_tests.rs
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Compare index value sizes on this target
        run: |
          cat > "$RUNNER_TEMP/type_sizes.rs" <<'RS'
          fn main() {
              let old = std::mem::size_of::<usize>();
              let new = std::mem::size_of::<(usize, [u8; 16])>();
              println!("index_value_bytes baseline={old} candidate={new} delta={}", new-old);
              assert_eq!((old, new), (8, 24));
          }
          RS
          rustc "$RUNNER_TEMP/type_sizes.rs" -o "$RUNNER_TEMP/type_sizes"
          "$RUNNER_TEMP/type_sizes"
  mutations:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        feature: [default, all]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Independently restore and run negative controls
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.feature }}" = all ]; then flags=--all-features; else flags=; fi
          sha256sum src/admin.rs src/admin/pagination_tests.rs Cargo.lock
          cp src/admin.rs "$RUNNER_TEMP/admin-original.rs"
          expected=$(sha256sum "$RUNNER_TEMP/admin-original.rs" | cut -d' ' -f1)
          mkdir -p "$RUNNER_TEMP/mutation-logs"
          for mutant in late_error sticky_error identity remember_unknown discard_yield error_cleanup conflict_cleanup; do
            cp "$RUNNER_TEMP/admin-original.rs" src/admin.rs
            MUTANT="$mutant" python3 - <<'PY'
          import os
          from pathlib import Path
          path=Path("src/admin.rs")
          source=path.read_text()
          begin=source.index("async fn discard_described_partitions(")
          end=source.index("\nasync fn unique_in_order",begin)
          block=source[begin:end]
          edits={
              "late_error": ('} else if desc.error_code != 0 {', '} else if false {'),
              "sticky_error": ('if existing.error_code != 0 {', 'if false {'),
              "identity": ('} else if *known_id != desc.topic_id {', '} else if false {'),
              "remember_unknown": ('*known_id = desc.topic_id;', '*known_id = [0; 16];'),
              "discard_yield": ('tokio::task::yield_now().await;', 'std::hint::black_box(());'),
              "error_cleanup": ('discard_described_partitions(&mut existing.partitions).await;', 'existing.partitions.clear();'),
              "conflict_cleanup": ('for desc in out.iter_mut() {', 'for desc in std::iter::empty::<&mut TopicDescription>() {'),
          }
          old,new=edits[os.environ["MUTANT"]]
          if os.environ["MUTANT"] == "discard_yield":
              cut=block.index("\nasync fn place_described_topic(")
              head,tail=block[:cut],block[cut:]
              assert head.count(old)==1
              block=head.replace(old,new,1)+tail
          else:
              assert block.count(old)==1, (os.environ["MUTANT"], block.count(old))
              block=block.replace(old,new,1)
          path.write_text(source[:begin]+block+source[end:])
          PY
            case "$mutant" in
              late_error) testname=dtp_pagination_propagates_later_topic_deletion ;;
              sticky_error) testname=dtp_pagination_keeps_first_topic_error_across_later_success ;;
              identity) testname=dtp_pagination_rejects_recreated_topic_with_different_id ;;
              remember_unknown) testname=dtp_pagination_checks_known_ids_despite_unknown_pages ;;
              discard_yield) testname=dtp_discard_partitions_yields_after_making_progress ;;
              error_cleanup|conflict_cleanup) testname=dtp_pagination_error_and_conflict_cleanup_make_cooperative_progress ;;
            esac
            fullname="admin::pagination_tests::$testname"
            set +e
            cargo test --locked $flags --lib "$fullname" -- --exact --nocapture > "$RUNNER_TEMP/mutation-logs/$mutant.txt" 2>&1
            result=$?
            set -e
            cat "$RUNNER_TEMP/mutation-logs/$mutant.txt"
            echo "MUTATION mutant=$mutant status=$result expected_test=$fullname"
            test "$result" -eq 101
            grep -F "test $fullname ... FAILED" "$RUNNER_TEMP/mutation-logs/$mutant.txt"
          done
          cp "$RUNNER_TEMP/admin-original.rs" src/admin.rs
          actual=$(sha256sum src/admin.rs | cut -d' ' -f1)
          test "$actual" = "$expected"
          sha256sum src/admin.rs src/admin/pagination_tests.rs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: admin-identity-mutations-${{ matrix.feature }}
          path: ${{ runner.temp }}/mutation-logs/
          if-no-files-found: warn
          retention-days: 30
  apache:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KAFKA_BOOTSTRAP: 127.0.0.1:19092
      KAFKA_TOPIC: pl-dtp-identity-${{ github.run_id }}
      KAFKA_REFERENCE: apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin source and toolchain
        run: |
          rustc -Vv
          sha256sum src/admin.rs src/admin/pagination_tests.rs Cargo.lock .github/fixtures/admin_dtp_live.rs.txt
          git hash-object src/admin.rs src/admin/pagination_tests.rs
          docker --version
      - name: Start digest-pinned Kafka
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$KAFKA_REFERENCE"
          docker image inspect "$KAFKA_REFERENCE" --format '{{json .RepoDigests}} {{.Id}}'
          docker create --name pl-dtp-test -p 127.0.0.1:19092:9092 \
            -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,INTERNAL://:9094,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:19092,INTERNAL://localhost:9094 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=false \
            "$KAFKA_REFERENCE"
          docker start pl-dtp-test
          ready=0
          for attempt in $(seq 1 45); do
            if timeout 10s docker exec pl-dtp-test /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 > "$RUNNER_TEMP/readiness.log" 2>&1; then ready=1; break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/readiness.log"
          test "$ready" = 1
      - name: Create and independently inspect topic
        shell: bash
        run: |
          set -euo pipefail
          docker exec pl-dtp-test /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9094 --create --topic "$KAFKA_TOPIC" --partitions 4 --replication-factor 1
          docker exec pl-dtp-test /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9094 --describe --topic "$KAFKA_TOPIC" | tee "$RUNNER_TEMP/topic.txt"
          python3 - "$RUNNER_TEMP/topic.txt" <<'PY'
          import re,sys
          source=open(sys.argv[1]).read()
          parts=sorted(int(x) for x in re.findall(r'Partition:\s*(\d+)',source))
          assert parts==[0,1,2,3], parts
          print("independent Kafka CLI partitions:", parts)
          PY
      - name: Live raw and aggregate client checks
        shell: bash
        run: |
          set -euo pipefail
          cp .github/fixtures/admin_dtp_live.rs.txt tests/admin_dtp_live.rs
          cargo test --locked --test admin_dtp_live -- --nocapture
          cargo test --locked --all-features --test admin_dtp_live -- --nocapture
      - name: Broker logs and cleanup
        if: always()
        run: |
          docker logs pl-dtp-test || true
          docker rm -f pl-dtp-test || true
