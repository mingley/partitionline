name: Formatted producer reservation qualification

on:
  push:
    branches: [qualification/producer-group-reservation-fmt-20261119]
    paths:
      - src/producer.rs
      - .github/workflows/producer-group-reservation-formatted.yml

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check format and source
        run: |
          rustc -Vv
          test "$(git rev-parse HEAD:src/producer.rs)" = "8aed5fdb14b7276d53847c7e0ab3a1d8af230ecf"
          cargo fmt --all -- --check

  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        features: [default, all, no-default]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Reproduce candidate
        env:
          FEATURE_MODE: ${{ matrix.features }}
        shell: bash
        run: |
          rustc -Vv
          git rev-parse HEAD
          test "$(git rev-parse HEAD:src/producer.rs)" = "8aed5fdb14b7276d53847c7e0ab3a1d8af230ecf"
          features=()
          case "$FEATURE_MODE" in
            all) features+=(--all-features) ;;
            no-default) features+=(--no-default-features) ;;
          esac
          cargo test --locked --lib "${features[@]}" producer::tests:: -- --test-threads=1
      - name: Check candidate lints
        if: matrix.features == 'all'
        run: cargo clippy --locked --all-features --lib --tests -- -D warnings

