name: Net suite baseline comparison

on:
  push:
    branches:
      - qualification/net-suite-20261108

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .cargo
            .github
            src
            examples
            tests
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: 3f45fe6255e72abc6b0c4488bc13117779c50787
          path: baseline
          sparse-checkout: |
            .cargo
            src
            examples
            tests
      - uses: dtolnay/rust-toolchain@stable
      - name: Full net tests on isolated builds
        run: |
          uname -a
          rustc +stable -Vv
          bash .github/group-qualification/net-suite.sh
