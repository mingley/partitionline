name: Broker disconnect admission-stall control
on:
  push:
    branches: [qualification/broker-disconnect-admission-control-20261108]
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact candidate and baseline tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "619c38da19c05dff8aa7e4f3b300ca1ab32a8f76"
          test "$(git rev-parse HEAD:partitionline-broker/src/transport.rs)" = "913ebb4caef03382bf4dfd0a02f249c2b6c5c1ef"
          test "$(git hash-object partitionline-broker/src/transport.rs)" = "913ebb4caef03382bf4dfd0a02f249c2b6c5c1ef"
          cp partitionline-broker/src/transport.rs /tmp/disconnect-admission-clean.rs
          for name in client_disconnect_stops_the_handler flooded_request_stops_the_handler; do
            cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib "$name" -- --nocapture | tee /tmp/disconnect-admission-positive.log
            grep -qE '^test result: ok\. 1 passed; 0 failed;' /tmp/disconnect-admission-positive.log
          done
      - name: Force admission to remain pending
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("partitionline-broker/src/transport.rs")
          s=p.read_text()
          old="                    let permit = handlers.acquire().await.map_err(|_| Exit::Shutdown)?;"
          assert s.count(old)==1
          p.write_text(s.replace(old,"                    std::future::pending::<()>().await;\n"+old,1))
          PY
          cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib --no-run
          for name in client_disconnect_stops_the_handler flooded_request_stops_the_handler; do
            if timeout 15s cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib "$name" -- --nocapture > /tmp/disconnect-admission-mutant.log 2>&1; then cat /tmp/disconnect-admission-mutant.log; exit 1; fi
            cat /tmp/disconnect-admission-mutant.log
            grep -F 'handler did not start before the test setup deadline' /tmp/disconnect-admission-mutant.log
            if [[ "$name" == client_disconnect_stops_the_handler ]]; then
              grep -E 'disconnect-check started=false observed=false stopped_before_cleanup=[0-9]+ joined=true' /tmp/disconnect-admission-mutant.log
            else
              grep -F 'disconnect-setup joined=true' /tmp/disconnect-admission-mutant.log
            fi
          done
          cp /tmp/disconnect-admission-clean.rs partitionline-broker/src/transport.rs
