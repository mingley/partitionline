name: Raft vote option lifecycle controls
on:
  push:
    branches: [qualification/raft-vote-option-lifecycle-20261108]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Supervised shutdown and worker panic
        run: |
          set -euo pipefail
          rustc --version
          cp partitionline-broker/src/raft/runtime.rs /tmp/raft-lifecycle-clean.rs
          for features in default all; do
            args=()
            if [[ "$features" == all ]]; then args=(--all-features); fi
            for case in supervisor_shutdown_during_replacement_cancels_exact_pending_vote worker_panic_with_pending_vote_stops_and_joins_supervisor_owners; do
              cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib "${args[@]}" "$case" -- --nocapture
            done
          done
      - name: Dropped pending cancellation negative control
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("partitionline-broker/src/raft/runtime.rs")
          s=p.read_text()
          old="if let Some(job) = jobs.close() {\n        let _ = control.cancel_job(job).await;\n    }"
          assert s.count(old)==1
          p.write_text(s.replace(old, "drop(jobs.close());", 1))
          PY
          if cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib supervisor_shutdown_during_replacement_cancels_exact_pending_vote -- --nocapture > /tmp/raft-no-pending-cancel.log 2>&1; then
            cat /tmp/raft-no-pending-cancel.log; exit 1
          fi
          cat /tmp/raft-no-pending-cancel.log
          grep -F "pending vote was not canceled before supervisor resumed" /tmp/raft-no-pending-cancel.log
          cp /tmp/raft-lifecycle-clean.rs partitionline-broker/src/raft/runtime.rs
      - name: Fault disabled negative control
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("partitionline-broker/src/raft/runtime.rs")
          s=p.read_text()
          old="slot.panic_on_pending = Some(notify.clone());"
          assert s.count(old)==1
          p.write_text(s.replace(old, "let _ = notify;", 1))
          PY
          if cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib worker_panic_with_pending_vote_stops_and_joins_supervisor_owners -- --nocapture > /tmp/raft-no-fault.log 2>&1; then
            cat /tmp/raft-no-fault.log; exit 1
          fi
          cat /tmp/raft-no-fault.log
          grep -F "worker did not reach pending-vote panic" /tmp/raft-no-fault.log
