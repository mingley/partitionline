name: Transaction error state qualification

on:
  push:
    branches: [qualification/txn-error-ticket-374-20261108]

permissions:
  contents: read

concurrency:
  group: txn-error-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
          sparse-checkout: |
            .cargo
            src
            tests
            examples
      - uses: actions/checkout@v7
        with:
          ref: 374dcf45db20ee728b00c0b0188e77ca1f47fa9c
          path: baseline
          persist-credentials: false
          sparse-checkout: |
            .cargo
            src
            tests
            examples
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Record source and host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/txn-state-evidence"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/txn-state-baseline-target"
          printf 'CARGO_TARGET_DIR=%s\n' "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          test "$RUNNER_ARCH" = X64
          uname -a
          rustc +stable -vV
          cargo +stable -V
          df -h "$RUNNER_TEMP"
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 1572864
          test "$(git -C "$GITHUB_WORKSPACE/candidate" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/baseline" rev-parse HEAD)" = 374dcf45db20ee728b00c0b0188e77ca1f47fa9c
          sha256sum "$GITHUB_WORKSPACE/candidate/src/producer.rs" "$GITHUB_WORKSPACE/candidate/src/producer/txn_error_state_controls.rs" | tee "$RUNNER_TEMP/txn-state-evidence/candidate-pins.log"
          printf '%s  %s\n' \
            3d65fcceecbb43c1a974f7f6b7bd58c8a310930f6bcced9052a00e88700eb37f "$GITHUB_WORKSPACE/candidate/src/producer.rs" \
            4215a4f116ab80588ebea39e78b89917acbb73bb64acd991c6cd3ecb7d4c6e45 "$GITHUB_WORKSPACE/candidate/src/producer/txn_error_state_controls.rs" \
            e21d03f495f504f167bc56139dc03798b0f323ca51370c7dceade23a2dad066e "$GITHUB_WORKSPACE/baseline/src/producer.rs" | sha256sum --check -
      - name: Verify stable formatting
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/candidate"
          cargo +stable fmt --all
          git diff -- src/producer.rs src/producer/txn_error_state_controls.rs
          git diff --quiet -- src/producer.rs src/producer/txn_error_state_controls.rs
      - name: Build instrumented baseline with the same controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/baseline"
          mkdir -p src/producer
          cp "$GITHUB_WORKSPACE/candidate/src/producer/txn_error_state_controls.rs" src/producer/
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib

          path = Path("src/producer.rs")
          source = path.read_text()
          def replace_once(old, new):
              global source
              if source.count(old) != 1:
                  raise SystemExit("baseline instrumentation anchor mismatch")
              source = source.replace(old, new, 1)

          replace_once(
              "    fn set_txn_fatal(&self, err: Error) {\n",
              "    fn set_txn_fatal(&self, err: Error) {\n"
              "        #[cfg(test)]\n"
              "        txn_error_state_controls::mark(self, txn_error_state_controls::Point::FatalEntry);\n"
          )
          replace_once(
              "            *self.txn_error.lock() = Some(err);\n"
              "        }\n"
              "    }\n\n"
              "    /// Java `resetTransactionState`",
              "            #[cfg(test)]\n"
              "            txn_error_state_controls::pause(self, txn_error_state_controls::Point::AbortBeforeCause);\n"
              "            *self.txn_error.lock() = Some(err);\n"
              "        }\n"
              "    }\n\n"
              "    /// Java `resetTransactionState`"
          )
          replace_once(
              "    fn clear_txn_abortable(&self) {\n",
              "    fn clear_txn_abortable(&self) {\n"
              "        #[cfg(test)]\n"
              "        txn_error_state_controls::mark(self, txn_error_state_controls::Point::ClearEntry);\n"
          )
          replace_once(
              "        if !self.txn_fatal.load(Ordering::SeqCst) {\n"
              "            *self.txn_error.lock() = None;",
              "        if !self.txn_fatal.load(Ordering::SeqCst) {\n"
              "            #[cfg(test)]\n"
              "            txn_error_state_controls::pause(self, txn_error_state_controls::Point::ClearBeforeCause);\n"
              "            *self.txn_error.lock() = None;"
          )
          replace_once(
              "    /// Java `TransactionManager.canHandleAbortableError`",
              "    #[cfg(test)]\n"
              "    fn txn_error_test_snapshot(&self) -> (bool, bool) {\n"
              "        (\n"
              "            self.txn_fatal.load(Ordering::SeqCst),\n"
              "            self.txn_abort_required.load(Ordering::SeqCst),\n"
              "        )\n"
              "    }\n\n"
              "    /// Java `TransactionManager.canHandleAbortableError`"
          )
          replace_once(
              "        if self.txn_fatal.load(Ordering::SeqCst) || self.txn_abort_required.load(Ordering::SeqCst) {\n"
              "            if let Some(e) = self.txn_error.lock().clone() {",
              "        if self.txn_fatal.load(Ordering::SeqCst) || self.txn_abort_required.load(Ordering::SeqCst) {\n"
              "            #[cfg(test)]\n"
              "            txn_error_state_controls::pause(self, txn_error_state_controls::Point::ReaderBeforeCause);\n"
              "            if let Some(e) = self.txn_error.lock().clone() {"
          )
          replace_once(
              "    fn set_txn_abortable(&self, err: Error) {\n",
              "    fn set_txn_abortable(&self, err: Error) {\n"
              "        #[cfg(test)]\n"
              "        txn_error_state_controls::mark(self, txn_error_state_controls::Point::AbortEntry);\n"
          )
          replace_once(
              "            #[cfg(test)]\n"
              "            txn_error_state_controls::pause(self, txn_error_state_controls::Point::AbortBeforeCause);",
              "            #[cfg(test)]\n"
              "            txn_error_state_controls::pause(self, txn_error_state_controls::Point::AbortClaimed);\n"
              "            #[cfg(test)]\n"
              "            txn_error_state_controls::pause(self, txn_error_state_controls::Point::AbortBeforeCause);"
          )
          replace_once(
              "    /// Java `TransactionManager.canHandleAbortableError`",
              "    #[cfg(test)]\n"
              "    fn txn_error_test_force_ticket_exhaustion(&self) {}\n\n"
              "    #[cfg(test)]\n"
              "    fn txn_error_test_force_ticket_before_exhaustion(&self) {}\n\n"
              "    /// Java `TransactionManager.canHandleAbortableError`"
          )
          source += '\n#[cfg(test)]\n#[path = "producer/txn_error_state_controls.rs"]\nmod txn_error_state_controls;\n'
          digest = hashlib.sha256(source.encode()).hexdigest()
          if digest != "b1b222a1a49f8878a0539224cd25ef427077f49ce212657f611a0c08804a017c":
              raise SystemExit("instrumented baseline hash mismatch: " + digest)
          path.write_text(source)
          print("instrumented baseline source sha256:", digest)
          PYCODE
      - name: Confirm controls expose the baseline behavior
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/baseline"
          baseline_test() {
            local mode="$1" name="$2" marker="$3" extra="$4" status
            local log="$RUNNER_TEMP/txn-state-evidence/baseline-$mode-$name.log"
            set +e
            timeout 600 cargo +stable test --locked $extra --lib "producer::txn_error_state_controls::$name" -- --exact --nocapture > "$log" 2>&1
            status=$?
            set -e
            cat "$log"
            test "$status" -eq 101
            grep -F 'running 1 test' "$log"
            grep -F "$marker" "$log"
            grep -F 'test result: FAILED. 0 passed; 1 failed;' "$log"
          }
          for mode in default all; do
            extra=''
            if [[ "$mode" = all ]]; then extra=--all-features; fi
            baseline_test "$mode" fatal_response_supersedes_an_abortable_cause PL_TXN_FATAL_CAUSE "$extra"
            baseline_test "$mode" abortable_publication_cannot_overtake_fatal PL_TXN_ABORT_FATAL_RACE "$extra"
            baseline_test "$mode" abortable_publication_cannot_overtake_clear PL_TXN_ABORT_CLEAR_RACE "$extra"
            baseline_test "$mode" clear_cannot_erase_a_fatal_cause PL_TXN_CLEAR_FATAL_RACE "$extra"
            baseline_test "$mode" first_fatal_wins_during_clear_and_competing_fatal PL_TXN_FATAL_WINNER "$extra"
            baseline_test "$mode" fatal_publishes_before_waiting_for_cause_lock PL_TXN_FATAL_PUBLICATION "$extra"
            baseline_test "$mode" abortable_publishes_before_waiting_for_cause_lock PL_TXN_ABORT_PUBLICATION "$extra"
            baseline_test "$mode" cleared_stalled_abort_cannot_overwrite_new_abort PL_TXN_STALE_ABORT "$extra"
            baseline_test "$mode" reader_rechecks_after_fatal_is_published PL_TXN_RECHECK_FATAL "$extra"
          done
      - name: Test the serialized state transitions
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/candidate"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/txn-state-candidate-target"
          test ! -e "$CARGO_TARGET_DIR"
          printf 'candidate_target=%s\n' "$CARGO_TARGET_DIR" | tee "$RUNNER_TEMP/txn-state-evidence/candidate-target.log"
          for mode in default all; do
            extra=''
            if [[ "$mode" = all ]]; then extra=--all-features; fi
            log="$RUNNER_TEMP/txn-state-evidence/candidate-$mode.log"
            timeout 600 cargo +stable test --locked $extra --lib producer::txn_error_state_controls:: -- --nocapture 2>&1 | tee "$log"
            grep -F 'test result: ok. 13 passed; 0 failed; 0 ignored;' "$log"
          done
          for mode in default all; do
            extra=''
            if [[ "$mode" = all ]]; then extra=--all-features; fi
            for name in \
              txn_roundtrip_times_out_waiting_for_initial_lock \
              txn_roundtrip_times_out_waiting_for_rediscovery_snapshot_lock \
              txn_roundtrip_contended_after_canceled_waiter \
              replacement_cancel_retains_closed_coordinator \
              replacement_timeout_retains_coordinator_and_recovers \
              replacement_wait_for_slot_obeys_deadline \
              replacement_rediscovery_retries_real_coordinator_rpc \
              missing_transaction_coordinator_rediscovers_before_rpc \
              closed_transaction_coordinator_rediscovers_and_bumps_epoch
            do
              log="$RUNNER_TEMP/txn-state-evidence/candidate-$mode-$name.log"
              timeout 600 cargo +stable test --locked $extra --lib "producer::tests::$name" -- --exact --nocapture > "$log" 2>&1 || { cat "$log"; exit 1; }
              cat "$log"
              grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log"
            done
          done
      - name: Run producer and transaction regression selection
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/candidate"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/txn-state-candidate-target"
          failures=0
          for mode in default all; do
            extra=''
            if [[ "$mode" = all ]]; then extra=--all-features; fi
            while read -r suite name; do
              log="$RUNNER_TEMP/txn-state-evidence/regression-$mode-$suite-$name.log"
              if timeout 600 cargo +stable test --locked $extra --test "$suite" "$name" -- --exact --nocapture > "$log" 2>&1; then
                if grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log"; then
                  echo "PASS $mode $suite $name" | tee -a "$RUNNER_TEMP/txn-state-evidence/regression-summary.log"
                else
                  echo "INVALID $mode $suite $name (missing single-test result)" | tee -a "$RUNNER_TEMP/txn-state-evidence/regression-summary.log"
                  failures=$((failures + 1))
                fi
              else
                status=$?
                echo "FAIL $mode $suite $name (exit $status)" | tee -a "$RUNNER_TEMP/txn-state-evidence/regression-summary.log"
                failures=$((failures + 1))
              fi
              cat "$log"
            done <<'CASES'
          full_surface transactional_fenced_produce_is_fatal_classic
          full_surface transactional_fenced_produce_is_fatal_v2
          full_surface transactional_abort_required_blocks_commit_until_abort_classic
          full_surface transactional_abort_required_v2_recovers_without_reinit
          full_surface transactional_fatal_produce_errors_fence_producer
          full_surface transactional_commit_and_abort_require_open_transaction
          full_surface transactional_end_txn_errors_classified
          full_surface transactional_txn_offset_commit_errors_classified
          full_surface transactional_add_offsets_errors_classified_classic
          buffer_ownership permit_stays_owned_across_retry_and_releases_exactly_once
          buffer_ownership presend_failure_transaction_partition_releases_permit_and_flush_fails
          buffer_ownership presend_failure_real_mock_add_partitions_to_txn
          mock_produce transactional_startup_reuses_the_bootstrap_socket
          mock_produce commit_reuses_a_produce_handshake_for_the_moved_coordinator
          mock_produce epoch_bump_reuses_a_produce_handshake
          mock_produce send_offsets_reuses_bootstrap_api_versions
          mock_produce add_partitions_drops_the_coordinator_when_it_closes_during_backoff
          produce_cancel dropping_send_future_while_buffered_is_ambiguous_but_still_delivers
          produce_cancel retry_queue_shutdown_boundedly_completes_and_releases_permits
          producer_initialization producer_id_terminal_errors_do_not_retry
          producer_initialization transaction_coordinator_startup_retries_within_one_deadline
          CASES
          done
          echo "$failures" > "$RUNNER_TEMP/txn-state-evidence/regression-failures"
      - name: Compare handshake regression on baseline and candidate
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/baseline"
          git restore --source=HEAD -- src/producer.rs
          printf '%s  %s\n' e21d03f495f504f167bc56139dc03798b0f323ca51370c7dceade23a2dad066e src/producer.rs | sha256sum --check -
          for tree in baseline candidate; do
            cd "$GITHUB_WORKSPACE/$tree"
            if [[ "$tree" = baseline ]]; then
              export CARGO_TARGET_DIR="$RUNNER_TEMP/txn-state-baseline-target"
            else
              export CARGO_TARGET_DIR="$RUNNER_TEMP/txn-state-candidate-target"
            fi
            for mode in default all; do
              extra=''
              if [[ "$mode" = all ]]; then extra=--all-features; fi
              for attempt in 1 2 3; do
                log="$RUNNER_TEMP/txn-state-evidence/handshake-$tree-$mode-$attempt.log"
                if timeout 600 cargo +stable test --locked $extra --test mock_produce commit_reuses_a_produce_handshake_for_the_moved_coordinator -- --exact --nocapture > "$log" 2>&1; then
                  status=0
                else
                  status=$?
                fi
                cat "$log"
                grep -F 'running 1 test' "$log"
                if [[ "$status" -eq 0 ]]; then
                  grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log"
                  echo "PASS $tree $mode $attempt" | tee -a "$RUNNER_TEMP/txn-state-evidence/handshake-summary.log"
                elif [[ "$status" -eq 101 ]]; then
                  grep -F 'test result: FAILED. 0 passed; 1 failed; 0 ignored;' "$log"
                  echo "FAIL $tree $mode $attempt" | tee -a "$RUNNER_TEMP/txn-state-evidence/handshake-summary.log"
                else
                  echo "unexpected command exit $status" >&2
                  exit 1
                fi
              done
            done
          done
      - name: Verify stable format and strict all-target Clippy
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/candidate"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/txn-state-candidate-target"
          timeout 180 cargo +stable fmt --all -- --check
          timeout 600 cargo +stable clippy --locked --all-targets --all-features -- -D warnings
          sha256sum src/producer.rs src/producer/txn_error_state_controls.rs | tee "$RUNNER_TEMP/txn-state-evidence/final-pins.log"
      - name: Require all integration regressions to pass
        shell: bash
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/txn-state-evidence/regression-summary.log"
          test "$(cat "$RUNNER_TEMP/txn-state-evidence/regression-failures")" -eq 0
      - name: Retain attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: txn-error-state-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/txn-state-evidence
          if-no-files-found: error
          retention-days: 30
