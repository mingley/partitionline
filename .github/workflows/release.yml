name: release

# Publishes to crates.io when a *final* version tag is pushed (vX.Y.Z only).
# Prerelease / RC tags (v0.1.0-rc.1, v0.1.0-alpha.1, …) are for git install
# pins only — they must not queue a publish job (wastes Actions capacity and
# cannot match Cargo.toml when version is 0.1.0).
#
# Tag filter uses GitHub's workflow glob language (not PCRE): `+` means
# "one or more of the preceding character", so `v[0-9]+.[0-9]+.[0-9]+`
# matches `v0.1.0` / `v1.10.2` and does not match `v0.1.0-rc.1`.
#
# Branch pushes that touch this file must not create empty-job failures.
# Root cause of prior noise: flush-left multiline shell inside `run: |`
# (invalid YAML). Defense in depth: job-level `if` + input-safe expressions
# + a complementary `ghost-noop` job so a spurious push evaluation stays a
# green no-op instead of "all jobs skipped" / empty-job red X.
#
# Authentication:
# Prefer crates.io Trusted Publishing (OIDC, short-lived token). The workflow
# can use a repository token if trusted publishing is not configured.
# Client 0.1.0 is already published. Follow docs/RELEASE.md for the next
# version, the exact-commit checks and the final tag.
#
# Optional: Actions → release → Run workflow (workflow_dispatch) after the
# matching final tag already exists on the tip you intend to publish.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing final version tag to publish (e.g. v0.1.0)"
        required: true
        type: string

# contents: write — GitHub Release notes step
# id-token: write — OIDC exchange for crates.io trusted publishing
# actions: read — `gh run list` in the exact-SHA CI gate (check-main-ci.sh).
# Declaring any permissions map zeros the rest; without this, GITHUB_TOKEN
# cannot read workflow runs and REQUIRE_MAIN_CI=1 fail-closes every tag cut.
permissions:
  contents: write
  id-token: write
  actions: read

# Shared non-cancelling release lock (KL08-03).
# Serializes different tags, same-tag reruns, and obsolete dispatch attempts.
# In-progress publish runs to completion without cancellation; queued runs wait.
concurrency:
  group: release-publish-lock
  cancel-in-progress: false

jobs:
  # Always run when publish is skipped so ghost branch-push evaluations
  # (workflow file touched on a non-tag ref) stay green instead of
  # conclusion=failure with zero jobs.
  ghost-noop:
    if: >-
      !(github.event_name == 'workflow_dispatch' ||
        (github.ref_type == 'tag' && !contains(github.ref_name, '-')))
    runs-on: ubuntu-latest
    steps:
      - name: No-op (not a final tag publish)
        run: |
          echo "release: ghost-noop — skipping publish"
          echo "event=${{ github.event_name }} ref=${{ github.ref }}"
          echo "Final publish requires tag vX.Y.Z or workflow_dispatch."

  publish:
    # Real work only for final tags or an explicit dispatch. Skips ghost
    # branch-push evaluations and any hyphenated prerelease tag that somehow
    # matched the glob.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.ref_type == 'tag' && !contains(github.ref_name, '-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches Cargo.toml (final versions only)
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${DISPATCH_TAG}"
            tag="${tag#v}"
          else
            tag="${REF_NAME#v}"
          fi
          case "$tag" in
            *-*|*+*)
              echo "Refusing prerelease/build tag '$tag' — crates.io publish is for final vX.Y.Z only." >&2
              echo "Use a git tag like v0.1.0-rc.1 for install pins; tag v0.1.0 to publish." >&2
              exit 1
              ;;
          esac
          # Guard dispatch / odd refs: require digits.digits.digits only.
          if ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Refusing non-final version tag '$tag' (need X.Y.Z)." >&2
            exit 1
          fi
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag cargo=$ver"
          test "$tag" = "$ver"
      - name: Checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo build --locked --example verifiable_producer --example verifiable_consumer
          RUST_TEST_THREADS=2 cargo test --locked --all-targets
          cargo package --locked
          bash scripts/ci-crate-consumer.sh

      - name: Exact-SHA CI green (KL-08)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "release: probing CI for exact SHA ${sha}"
          # Require the complete release profile, not just a green workflow:
          # every required CI job/matrix cell green at this SHA/attempt, the
          # conformance fixture artifacts present, and packed-crate consumer
          # evidence (package job) bound to this run. Missing/skipped cells
          # and stale/unbound artifacts fail the publish job so tag cuts
          # cannot race ahead of matrix evidence or reuse another run's proof.
          if ! command -v gh >/dev/null 2>&1; then
            echo "release: gh CLI missing on runner — unexpected" >&2
            exit 1
          fi
          env -u GH_RUNS_JSON -u GH_JOBS_JSON -u GH_ARTIFACTS_JSON \
            -u REQUIRED_JOBS -u REQUIRED_ARTIFACTS -u GH_RUN_LIMIT \
            MAIN_BRANCH=main REQUIRE_MAIN_CI=1 REQUIRE_PROFILE_EVIDENCE=1 \
            CHECK_SHA="$sha" bash scripts/check-main-ci.sh

      - name: Soft-skip if version already on crates.io
        id: already
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          source scripts/lib/crates-io.sh
          pl_crates_probe_version "$name" "$ver" 'partitionline-ci/1'
          if [[ "$PL_CRATES_PROBE_STATUS" == present ]]; then
            echo "release: ${name} ${ver} already on crates.io — skipping publish (idempotent)"
            echo "skip=1" >>"$GITHUB_OUTPUT"
          elif [[ "$PL_CRATES_PROBE_STATUS" == absent ]]; then
            echo "skip=0" >>"$GITHUB_OUTPUT"
          else
            echo "release: registry unavailable or version status unknown ($PL_CRATES_PROBE_DETAIL) — refusing publish" >&2
            exit 1
          fi

      - name: Authenticate to crates.io (OIDC trusted publishing)
        if: steps.already.outputs.skip != '1'
        id: cratesio-auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        if: steps.already.outputs.skip != '1'
        env:
          OIDC_TOKEN: ${{ steps.cratesio-auth.outputs.token }}
          SECRET_TOKEN: ${{ secrets.CRATES_IO_TOKEN || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "${OIDC_TOKEN}" ]; then
            export CARGO_REGISTRY_TOKEN="${OIDC_TOKEN}"
            echo "auth=oidc (crates.io trusted publishing, short-lived)"
          elif [ -n "${SECRET_TOKEN}" ]; then
            export CARGO_REGISTRY_TOKEN="${SECRET_TOKEN}"
            echo "auth=secret (CRATES_IO_TOKEN/CARGO_REGISTRY_TOKEN; required for first publish)"
          else
            echo "Neither OIDC trusted publishing nor CRATES_IO_TOKEN/CARGO_REGISTRY_TOKEN is available." >&2
            echo "First publish: set Actions secret CRATES_IO_TOKEN." >&2
            echo "Later: crates.io → Settings → Trusted Publishing → workflow release.yml" >&2
            exit 1
          fi
          cargo publish --no-verify
      - name: Confirm crates.io
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          source scripts/lib/crates-io.sh
          if [ "${{ steps.already.outputs.skip }}" = "1" ]; then
            echo "release: skipped publish; checking that ${name} ${ver} remains in the index"
          fi
          ok=0
          for i in $(seq 1 30); do
            pl_crates_probe_version "$name" "$ver" 'partitionline-ci/1'
            if [[ "$PL_CRATES_IDENTITY_STATUS" == present ]]; then
              echo "crates.io has ${name} ${ver}"
              ok=1
              break
            fi
            echo "waiting for crates.io index (${i}/30; ${PL_CRATES_PROBE_DETAIL})..."
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "release: ${name} ${ver} not confirmed by the API and sparse index" >&2
            exit 1
          fi
          echo "Owner follow-up: bash scripts/day1-after-publish.sh && commit README on main."
          echo "Then configure Trusted Publishing (see docs/RELEASE.md) so later tags need no long-lived secret."
      - name: GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="v${ver}"
          # Prefer an existing annotated tag body; otherwise write a short crates.io pointer.
          # Keep every line indented under `run: |` — a flush-left multiline shell
          # string is invalid YAML and produces empty-job release failures on push.
          body="$(git tag -l --format='%(contents)' "$tag" 2>/dev/null | sed '/^$/d' | head -40)"
          if [ -z "$body" ]; then
            body="$(printf '%s\n' \
              "partitionline ${ver}" \
              "" \
              "Published to crates.io: https://crates.io/crates/partitionline/${ver}" \
              "Docs: https://docs.rs/partitionline/${ver}" \
              "" \
              "Owner follow-up on main:" \
              "  bash scripts/day1-after-publish.sh" \
              "  # commit README crates.io dep + badges, then push" \
              "  # then: crates.io Trusted Publishing → release.yml")"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists"
          else
            gh release create "$tag" --title "partitionline ${ver}" --notes "$body"
            echo "created GitHub release ${tag}"
          fi
