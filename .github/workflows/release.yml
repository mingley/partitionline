name: release

# Publishes to crates.io when a *final* version tag is pushed (vX.Y.Z only).
# Prerelease / RC tags (v0.1.0-rc.1, v0.1.0-alpha.1, …) are for git install
# pins only — they must not queue a publish job (wastes Actions capacity and
# cannot match Cargo.toml when version is 0.1.0).
#
# Owner setup (one-time):
#   1. crates.io → Account → New Token (scope: publish-update for partitionline)
#   2. GitHub → Settings → Secrets → Actions → CARGO_REGISTRY_TOKEN
#   3. Merge civilization → main, then: git tag v0.1.0 && git push origin v0.1.0
#
# Optional: Actions → release → Run workflow (workflow_dispatch) after the
# matching final tag already exists on the tip you intend to publish.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing final version tag to publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches Cargo.toml (final versions only)
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            tag="${tag#v}"
          else
            tag="${GITHUB_REF_NAME#v}"
          fi
          case "$tag" in
            *-*|*+*)
              echo "Refusing prerelease/build tag '$tag' — crates.io publish is for final vX.Y.Z only." >&2
              echo "Use a git tag like v0.1.0-rc.1 for install pins; tag v0.1.0 to publish." >&2
              exit 1
              ;;
          esac
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag cargo=$ver"
          test "$tag" = "$ver"
      - name: Checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
          cargo package
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set; cannot publish." >&2
            exit 1
          fi
          cargo publish --no-verify
      - name: Confirm crates.io
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsSA 'partitionline-ci/1' \
              "https://crates.io/api/v1/crates/partitionline/${ver}" >/tmp/pl-crate.json; then
              echo "crates.io has partitionline ${ver}"
              ok=1
              break
            fi
            echo "waiting for crates.io index (${i}/30)..."
            sleep 10
          done
          test "$ok" = "1"
          echo "Owner follow-up: bash scripts/day1-after-publish.sh && commit README on main."
