name: broker owned permit all-target and doc tests
on:
  push:
    branches:
      - qualification/broker-owned-permit-combined-ci-20261108
permissions:
  contents: read
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        profile: [default, all-features]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact source and host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/owned-targets"
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD^)" = 7dcef586a8c6205cca10b71222088d83a84689fd
          rustc +stable --version --verbose | tee "$RUNNER_TEMP/owned-targets/toolchain.log"
          printf '%s  %s\n' 4b58da7de8daf51d12c658c35a9252b91907e18475e49cb04fac3de751cb9a5b partitionline-broker/src/metadata.rs | sha256sum -c -
          printf '%s  %s\n' 0a35525b57e7cc6d83bb5ca82c544070126f8f2d1932b36e38525cf12a823e89 partitionline-broker/src/fetch.rs | sha256sum -c -
          printf '%s  %s\n' 0e5fd830937e85b8be40c6c4ab0a2797c118a3a44f47f681f04ff558dec53cd1 partitionline-broker/tests/fetch.rs | sha256sum -c -
          git diff --exit-code HEAD^ -- partitionline-broker/src/metadata.rs partitionline-broker/src/fetch.rs partitionline-broker/tests/fetch.rs tests/conformance/broker/implemented-api-versions.json
      - name: Complete broker all-target suite
        id: targets
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [ "$PROFILE" = all-features ]; then flags+=(--all-features); fi
          cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --all-targets "${flags[@]}" 2>&1 | tee "$RUNNER_TEMP/owned-targets/all-targets.log"
      - name: Broker doc tests
        id: docs
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [ "$PROFILE" = all-features ]; then flags+=(--all-features); fi
          cargo +stable test --locked --manifest-path partitionline-broker/Cargo.toml --doc "${flags[@]}" 2>&1 | tee "$RUNNER_TEMP/owned-targets/doc-tests.log"
      - name: Require both test gates
        if: always()
        env:
          TARGETS: ${{ steps.targets.outcome }}
          DOCS: ${{ steps.docs.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGETS" = success
          test "$DOCS" = success
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: broker-owned-targets-${{ matrix.profile }}-${{ github.sha }}
          path: ${{ runner.temp }}/owned-targets
          if-no-files-found: warn
          retention-days: 30
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Verify all pins and run inventory controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/owned-inventory"
          test "$(git rev-parse HEAD^)" = 7dcef586a8c6205cca10b71222088d83a84689fd
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          rp = Path('tests/conformance/broker/implemented-api-versions.json')
          old = json.loads(subprocess.check_output(['git', 'show', f'HEAD^^:{rp}']))
          new = json.loads(rp.read_text())
          paths = {
              'metadata_source_sha256': 'partitionline-broker/src/metadata.rs',
              'fetch_source_sha256': 'partitionline-broker/src/fetch.rs',
              'fetch_test_source_sha256': 'partitionline-broker/tests/fetch.rs',
              'produce_source_sha256': 'partitionline-broker/src/produce.rs',
              'partition_source_sha256': 'partitionline-broker/src/partition.rs',
              'segments_source_sha256': 'partitionline-broker/src/segments.rs',
          }
          for key, path in paths.items():
              assert new[key] == hashlib.sha256(Path(path).read_bytes()).hexdigest(), key
          for key in ('metadata_source_sha256', 'fetch_source_sha256', 'fetch_test_source_sha256'):
              assert old[key] != new[key]
              del old[key]
              del new[key]
          assert old == new, 'unrelated registry fields changed'
          PY
          python3 -B scripts/check-broker-api-matrix.py --report "$RUNNER_TEMP/owned-inventory/report.json" 2>&1 | tee "$RUNNER_TEMP/owned-inventory/inventory.log"
          python3 -B -m unittest discover -s tests/ci -p test_broker_api_matrix.py -v 2>&1 | tee "$RUNNER_TEMP/owned-inventory/controls.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: broker-combined-inventory-${{ github.sha }}
          path: ${{ runner.temp }}/owned-inventory
          if-no-files-found: warn
          retention-days: 30
