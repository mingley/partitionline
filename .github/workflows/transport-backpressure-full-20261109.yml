name: isolated broker full qualification
on:
  push:
    branches: [dev/transport-backpressure-full-20261109]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustc --version --verbose
      - run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib bounded_backpressure_tests -- --nocapture
      - run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --test transport_backpressure -- --nocapture
      - run: 'cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib transport:: -- --nocapture'
      - run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --test transport -- --nocapture
      - run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-features --test transport_backpressure -- --nocapture
      - run: 'cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-features --lib transport:: -- --nocapture'
  broker-default:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustc --version --verbose
      - run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-targets
  broker-all:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustc --version --verbose
      - run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --all-targets --all-features
  strict:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: rustc --version --verbose
      - run: cargo fmt --manifest-path partitionline-broker/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path partitionline-broker/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --manifest-path partitionline-broker/Cargo.toml --no-deps --all-features
      - name: All-feature doc tests
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo test --locked --manifest-path partitionline-broker/Cargo.toml --doc --all-features
