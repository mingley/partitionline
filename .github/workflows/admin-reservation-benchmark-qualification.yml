name: Admin reservation witness and timing
on:
  push:
    branches: [qualification/admin-reservation-benchmark-20261108]
  workflow_dispatch:
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: de152e78ca6d85e6cd4ea5915058b2bb6141cf42
          path: baseline
      - name: Host and source
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          uname -a
          lscpu
          sha256sum candidate/qualification/admin-reservation/driver.rs
          git -C candidate rev-parse HEAD
          git -C baseline rev-parse HEAD
      - name: Build baseline and candidate probes
        shell: bash
        run: |
          set -euo pipefail
          for arm in baseline candidate; do
            mkdir -p "$RUNNER_TEMP/probe-$arm/src"
            cp candidate/qualification/admin-reservation/driver.rs "$RUNNER_TEMP/probe-$arm/src/main.rs"
            cat > "$RUNNER_TEMP/probe-$arm/Cargo.toml" <<EOF
          [package]
          name = "admin-reservation-probe"
          version = "0.0.0"
          edition = "2021"
          [workspace]
          [dependencies]
          partitionline = { path = "$GITHUB_WORKSPACE/$arm" }
          bytes = "1"
          tokio = { version = "1", features = ["rt", "net", "time"] }
          [features]
          all = ["partitionline/tracing", "partitionline/zstd"]
          EOF
            for profile in default all; do
              extra=()
              if [ "$profile" = all ]; then extra=(--features all); fi
              CARGO_TARGET_DIR="$RUNNER_TEMP/target-$arm" cargo build --release --manifest-path "$RUNNER_TEMP/probe-$arm/Cargo.toml" "${extra[@]}"
              cp "$RUNNER_TEMP/target-$arm/release/admin-reservation-probe" "$RUNNER_TEMP/$arm-$profile"
              sha256sum "$RUNNER_TEMP/$arm-$profile"
            done
          done
      - name: Compare malformed allocation and wire semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admin-evidence"
          for profile in default all; do
            for arm in baseline candidate; do
              "$RUNNER_TEMP/$arm-$profile" witness | tee "$RUNNER_TEMP/admin-evidence/$arm-$profile-witness.txt"
              "$RUNNER_TEMP/$arm-$profile" corpus > "$RUNNER_TEMP/admin-evidence/$arm-$profile-corpus.txt"
            done
            diff -u "$RUNNER_TEMP/admin-evidence/baseline-$profile-corpus.txt" "$RUNNER_TEMP/admin-evidence/candidate-$profile-corpus.txt"
            python3 candidate/qualification/admin-reservation/check_witness.py "$RUNNER_TEMP/admin-evidence/baseline-$profile-witness.txt" "$RUNNER_TEMP/admin-evidence/candidate-$profile-witness.txt"
          done
      - name: Paired valid-response timings
        shell: bash
        run: |
          set -euo pipefail
          cpu="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          echo "Pinned logical CPU: $cpu"
          for pair in $(seq 0 7); do
            if [ "$((pair % 2))" -eq 0 ]; then order=(baseline candidate); else order=(candidate baseline); fi
            for arm in "${order[@]}"; do
              taskset -c "$cpu" "$RUNNER_TEMP/$arm-default" bench > "$RUNNER_TEMP/admin-evidence/bench-$pair-$arm.txt"
            done
          done
          python3 candidate/qualification/admin-reservation/summarize.py "$RUNNER_TEMP/admin-evidence" | tee "$RUNNER_TEMP/admin-evidence/bench-summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-reservation-evidence
          path: ${{ runner.temp }}/admin-evidence/
          if-no-files-found: warn
