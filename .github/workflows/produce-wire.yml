name: Apache Produce wire
on:
  push:
    branches: [qualification/produce-wire-matrix-20261119]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate the complete Apache Produce corpus
        run: |
          python3 -B - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "tests/conformance/java")
          import generate_produce_wire as suite
          output = Path("target/produce-wire").resolve()
          output.mkdir(parents=True)
          jar = suite.common.peer(output / "jars", "4.1.0")
          logger = suite.slf4j(output)
          corpus = output / "apache.txt"
          log = output / "generate.log"
          try:
              suite.common.run(["java", "-Xmx128m", "--class-path", f"{jar}{os.pathsep}{logger}",
                                str(suite.JAVA), str(jar), "3", "13", "generate", str(corpus)],
                               log, marker="generated_pairs=11")
          finally:
              print(log.read_text(), end="")
          body = corpus.read_bytes()
          kept = b"".join(row for row in body.splitlines(keepends=True)
                          if row.split(maxsplit=1)[0] in {b"4", b"6", b"7", b"12"})
          legacy = Path("tests/fixtures/produce_wire/apache-v4-v6-v7-v12.txt").read_bytes()
          if kept != legacy:
              raise SystemExit("historical rows differ")
          print("APACHE_SHA256", hashlib.sha256(body).hexdigest())
          print("BEGIN_PRODUCE_CORPUS")
          print(body.decode("ascii"), end="")
          print("END_PRODUCE_CORPUS")
          PY
