name: ci

on:
  # Tip (dev/**) pushes do not auto-queue CI while org runners are starved —
  # each push was cancelling/re-queuing branch-lite and never finishing.
  # Tip Verifiable proxy: `bash scripts/ci-branch-lite.sh`.
  # Full matrix: pull_request, main push, or workflow_dispatch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_broker:
        description: 'Run explicit opt-in live broker conformance lane'
        required: false
        default: false
        type: boolean

# One CI group per ref. Always cancel superseded runs — including on main —
# so a stuck queued job cannot hold the only org runner for hours (seen
# org-wide during civilization). Prefer a fresh main matrix over an eternal
# queue behind a dead predecessor.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resource-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the finite resource driver
        run: cargo +stable build --locked --example resource_soak
      - name: Overload, stalled replies, slow processing and interrupted resume
        env:
          PL_RESOURCE_SOAK_BINARY: ${{ github.workspace }}/target/debug/examples/resource_soak
          PL_RESOURCE_SOAK_OUTPUT: ${{ github.workspace }}/target/resource-soak
        run: |
          mkdir -p target/resource-soak
          python3 -B -m unittest discover -s tests/ci -p test_resource_soak.py -v
      - name: Retain every resource attempt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resource-soak-${{ github.sha }}
          path: target/resource-soak
          if-no-files-found: error
          retention-days: 30

  fmt:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # Strict documentation and doctest gate.
  docs:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Documentation diagnostics negative tests
        run: python3 -B -m unittest discover -s tests/ci -p test_docs_diagnostics.py
      - run: bash scripts/ci-docs.sh
      - name: Upload strict documentation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-gate-${{ github.sha }}
          path: target/docs-gate
          if-no-files-found: error
          retention-days: 30
      - name: Markdown gate negative tests
        run: python3 -B -m unittest discover -s tests/docs -p 'test_*.py'
      - name: Compile public Markdown and operator examples from the extracted package
        env:
          PL_PACKAGE_TOOLCHAINS: stable
        run: bash scripts/ci-crate-consumer.sh

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Independent JSON Schema peer
        run: python3 -m pip install 'jsonschema==4.26.0' 'referencing==0.37.0' 'rpds-py==2026.6.3' 'attrs==26.1.0' 'jsonschema-specifications==2025.9.1'
      - name: Benchmark result and process orchestration tests
        run: python3 -B -m unittest discover -s benchmarks/tests -p 'test_*.py' -v
      - name: Schema companion format and lint
        run: |
          cargo fmt --manifest-path partitionline-schema/Cargo.toml -- --check
          cargo clippy --locked --manifest-path partitionline-schema/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Default registry and selected codec tests
        env:
          PL_AVRO_SELECTED_OUTPUT: ${{ github.workspace }}/target/avro-selected/default
          PL_GENERIC_HEADER_OUTPUT: ${{ github.workspace }}/target/schema-header/default
          PL_JSON_SCHEMA_SELECTED_OUTPUT: ${{ github.workspace }}/target/json-schema-selected/default
        run: |
          mkdir -p target/avro-selected
          cargo test --locked --manifest-path partitionline-schema/Cargo.toml --features avro,json-schema > target/avro-selected/default.log 2>&1
          python3 tests/conformance/run-avro-selected-codec.py --rust-output target/avro-selected/default --peer-cache target/avro-peer-cache --report target/avro-selected/default-peer.json
          python3 tests/conformance/run-generic-schema-header.py --rust-output target/schema-header/default --report target/schema-header/default-peer.json
          timeout 30s python3 tests/conformance/run-json-schema-selected-codec.py --rust-output target/json-schema-selected/default --report target/json-schema-selected/default-peer.json
      - name: All-feature tests and independent Avro readback
        env:
          PL_AVRO_SELECTED_OUTPUT: ${{ github.workspace }}/target/avro-selected/all-features
          PL_GENERIC_HEADER_OUTPUT: ${{ github.workspace }}/target/schema-header/all-features
          PL_JSON_SCHEMA_SELECTED_OUTPUT: ${{ github.workspace }}/target/json-schema-selected/all-features
        run: |
          cargo test --locked --manifest-path partitionline-schema/Cargo.toml --all-features > target/avro-selected/all-features.log 2>&1
          python3 tests/conformance/run-avro-selected-codec.py --rust-output target/avro-selected/all-features --peer-cache target/avro-peer-cache --report target/avro-selected/all-features-peer.json
          python3 tests/conformance/run-generic-schema-header.py --rust-output target/schema-header/all-features --report target/schema-header/all-features-peer.json
          timeout 30s python3 tests/conformance/run-json-schema-selected-codec.py --rust-output target/json-schema-selected/all-features --report target/json-schema-selected/all-features-peer.json
      - name: Verify the Schema Registry companion archive
        run: bash scripts/ci-schema-package.sh
      - name: Retain Rust output and peer receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: avro-selected-stable-${{ github.sha }}
          path: |
            target/avro-selected
            target/schema-header
            target/json-schema-selected
            target/schema-package
          if-no-files-found: error
          retention-days: 30

  init-producer-id:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Default InitProducerId fields and runtime
        env:
          PL_INIT_PRODUCER_ID_V6_OUTPUT: ${{ github.workspace }}/target/init-producer-id/default
        run: |
          mkdir -p target/init-producer-id
          cargo test --locked --test init_producer_id_v6 --test producer_initialization > target/init-producer-id/default.log 2>&1
          python3 tests/conformance/run-init-producer-id-v6.py --peer-cache target/init-producer-id/peers --rust-output target/init-producer-id/default --report target/init-producer-id/default-peer.json
      - name: All-feature InitProducerId fields and runtime
        env:
          PL_INIT_PRODUCER_ID_V6_OUTPUT: ${{ github.workspace }}/target/init-producer-id/all-features
        run: |
          cargo test --locked --all-features --test init_producer_id_v6 --test producer_initialization > target/init-producer-id/all-features.log 2>&1
          python3 tests/conformance/run-init-producer-id-v6.py --peer-cache target/init-producer-id/peers --rust-output target/init-producer-id/all-features --report target/init-producer-id/all-features-peer.json
      - name: Retain InitProducerId peer checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: init-producer-id-stable-${{ github.sha }}
          path: target/init-producer-id
          if-no-files-found: error
          retention-days: 30

  # Default fast path: mock / unit tests, no Docker.
  zstd-decode:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Pinned Java decoder dependencies
        run: |
          mkdir -p target/zstd-peers/libs
          curl --fail --location --max-time 60 https://repo.maven.apache.org/maven2/org/apache/kafka/kafka-clients/4.3.1/kafka-clients-4.3.1.jar -o target/zstd-peers/kafka-clients.jar
          curl --fail --location --max-time 60 https://repo.maven.apache.org/maven2/com/github/luben/zstd-jni/1.5.6-10/zstd-jni-1.5.6-10.jar -o target/zstd-peers/libs/zstd-jni.jar
          curl --fail --location --max-time 60 https://repo.maven.apache.org/maven2/org/slf4j/slf4j-api/1.7.36/slf4j-api-1.7.36.jar -o target/zstd-peers/libs/slf4j-api.jar
          curl --fail --location --max-time 60 https://repo.maven.apache.org/maven2/org/xerial/snappy/snappy-java/1.1.10.7/snappy-java-1.1.10.7.jar -o target/zstd-peers/libs/snappy-java.jar
          curl --fail --location --max-time 60 https://repo.maven.apache.org/maven2/at/yawk/lz4/lz4-java/1.10.2/lz4-java-1.10.2.jar -o target/zstd-peers/libs/lz4-java.jar
          echo '252dabd586d22149a31661a8afc1a50747714eb1a298bd4a6e780c8c91a13866  target/zstd-peers/libs/lz4-java.jar' | sha256sum --check
          echo 'd3ef575e3e4979678dc01bf1dcce51021493b4d11fb7f1be8ad982877c16a1c0  target/zstd-peers/libs/slf4j-api.jar' | sha256sum --check
      - name: Independent Java decoder and fixture pins
        run: python3 tests/conformance/run-zstd-decode.py verify --jar target/zstd-peers/kafka-clients.jar --libs target/zstd-peers/libs --fixtures tests/fixtures/zstd-decode --report target/zstd-peers/report.json
      - name: Feature and budget boundaries
        env:
          PL_ZSTD_ENCODE_OUTPUT: ${{ github.workspace }}/target/zstd-peers/rust-output
        run: |
          cargo test --locked --all-features --test zstd_encode --test zstd_decode --test fuzz_decode_smoke
          python3 tests/conformance/run-zstd-decode.py verify --jar target/zstd-peers/kafka-clients.jar --libs target/zstd-peers/libs --fixtures tests/fixtures/zstd-decode --rust-output target/zstd-peers/rust-output --report target/zstd-peers/encoder-report.json
          cargo test --locked --test zstd_decode
          cargo test --locked --no-default-features --features zstd --test zstd_decode
      - name: Independent codec fixture matrix
        env:
          PL_CODEC_MATRIX_OUTPUT: ${{ github.workspace }}/target/zstd-peers/codec-rust-output
        run: |
          cargo test --locked --all-features --test codec_matrix
          python3 tests/conformance/run-codec-matrix.py verify --jar target/zstd-peers/kafka-clients.jar --libs target/zstd-peers/libs --rust-output target/zstd-peers/codec-rust-output --output target/zstd-peers/codec-report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zstd-decode-stable-${{ github.sha }}
          path: |
            target/zstd-peers/report.json
            target/zstd-peers/encoder-report.json
            target/zstd-peers/rust-output
            target/zstd-peers/codec-rust-output
            target/zstd-peers/codec-report

  test:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      # Mock TLS fixtures shell out to openssl (no rcgen/time in the graph).
      - run: openssl version
      # verifiable_contract launches standalone examples, not test harnesses.
      - run: cargo build --locked --example verifiable_producer --example verifiable_consumer
      - name: Benchmark settings
        run: |
          cargo build --locked --example bench_produce --example bench_fetch
          PL_BENCH_PRODUCE_BINARY=target/debug/examples/bench_produce PL_BENCH_FETCH_BINARY=target/debug/examples/bench_fetch python3 -B -m unittest discover -s tests/ci -p 'test_bench_*_settings.py'
      - env:
          RUST_TEST_THREADS: '1'
        run: cargo test --locked --all-targets

  # KL08-05: native macOS arm64 runtime + actual packed-consumer evidence.
  # The driver rejects Intel/Rosetta hosts and a nonnative Rust compiler.
  macos-arm64:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]
    defaults:
      run:
        shell: bash
    env:
      PL_MACOS_TOOLCHAIN: ${{ matrix.rust }}
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Select Bash 5 and OpenSSL 3 test prerequisites
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          test "$(uname -s)" = Darwin
          brew list bash >/dev/null || brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          brew list openssl@3 >/dev/null || brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - id: capture
        name: Verify native host and retain exact versions
        run: bash scripts/ci-macos-arm64.sh capture
      - name: Native default-feature mock and public API runtime
        run: bash scripts/ci-macos-arm64.sh default
      - name: Native tracing mock and public API runtime
        run: bash scripts/ci-macos-arm64.sh tracing
      - name: Strict stable Clippy
        if: matrix.rust == 'stable'
        run: bash scripts/ci-macos-arm64.sh clippy
      - name: Strict native Rustdoc and doctests
        run: bash scripts/ci-macos-arm64.sh docs
      - name: Actual packed-crate default and tracing consumers
        run: bash scripts/ci-macos-arm64.sh package
      - id: report
        name: Validate complete platform and package provenance
        run: bash scripts/ci-macos-arm64.sh report
      - name: Retain platform versions, full test logs and package reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.report.outputs.artifact_name || steps.capture.outputs.artifact_name || format('macos-arm64-{0}-failed-{1}', matrix.rust, github.sha) }}
          path: target/macos-arm64/${{ matrix.rust }}/
          if-no-files-found: error
          retention-days: 30

  # KL08-14: native Windows MSVC runtime and exact extracted-package evidence.
  windows:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]
    defaults:
      run:
        shell: bash
    env:
      PL_WINDOWS_TOOLCHAIN: ${{ matrix.rust }}
      PYTHONUTF8: '1'
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - name: Enable long evidence paths in Git for Windows
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Select an actual OpenSSL 3 certificate-tool executable
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\OpenSSL\bin\openssl.exe",
            "$env:ProgramFiles\OpenSSL-Win64\bin\openssl.exe",
            "$env:ProgramFiles\Git\usr\bin\openssl.exe"
          )
          $selected = $null
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              $version = (& $candidate version | Out-String).Trim()
              if ($LASTEXITCODE -eq 0 -and $version -match '^OpenSSL 3\.') {
                $selected = $candidate
                break
              }
            }
          }
          if (-not $selected) { throw 'OpenSSL 3 fixture prerequisite unavailable; Windows remains unqualified' }
          Split-Path $selected -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $selected version
      - id: capture
        name: Verify native Windows MSVC host and exact prerequisites
        run: bash scripts/ci-windows.sh capture
      - name: Native default-feature mock and public API runtime
        run: bash scripts/ci-windows.sh default
      - name: Native tracing mock and public API runtime
        run: bash scripts/ci-windows.sh tracing
      - name: Strict stable Clippy
        if: matrix.rust == 'stable'
        run: bash scripts/ci-windows.sh clippy
      - name: Strict native Rustdoc and doctests
        run: bash scripts/ci-windows.sh docs
      - name: Actual packed-crate default and tracing consumers
        run: bash scripts/ci-windows.sh package
      - id: report
        name: Validate complete native runtime and package provenance
        run: bash scripts/ci-windows.sh report
      - name: Retain native versions, full logs and package reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.report.outputs.artifact_name || steps.capture.outputs.artifact_name || format('windows-{0}-failed-{1}', matrix.rust, github.sha) }}
          path: target/windows/${{ matrix.rust }}/
          if-no-files-found: error
          retention-days: 30

  audit:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release-rehearsal:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Release gate and recovery negative tests
        run: python3 -B -m unittest discover -s tests/release -p 'test_*.py'
      - name: Exact-source offline release recovery rehearsal
        run: bash scripts/rehearse-partial-release.sh --run target/release-rehearsal
      - name: Retain all scenario outputs and substituted commands
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-rehearsal-${{ github.sha }}
          path: target/release-rehearsal/
          if-no-files-found: error
          retention-days: 30

  # cargo-deny: advisories + licenses + no-C bans + crates.io-only sources.
  deny:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # KL09-04 ratcheted allocation-budget gate for the codecs. Stable only:
  # the bench crate's criterion dev-dependency requires rustc 1.86+.
  alloc-budget:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest