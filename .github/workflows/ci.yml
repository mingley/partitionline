name: ci

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_dispatch:

# One CI group per ref. Always cancel superseded runs on feature branches and
# PRs so scarce runners are not held by stale queues. Never cancel mid-run on
# main (release verification).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Branch pushes (dev/**): one light job so a single free runner can finish.
  # Full matrix runs on pull_request, main, and workflow_dispatch.
  branch-lite:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --lib
      - run: bash scripts/ci-docs.sh

  fmt:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # Default fast path: mock / unit tests, no Docker.
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      # Mock TLS fixtures shell out to openssl (no rcgen/time in the graph).
      - run: openssl version
      - run: cargo test --all-targets

  audit:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # cargo-deny: advisories + licenses + no-C bans + crates.io-only sources.
  deny:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # crates.io packaging + publish dry-run (does not publish).
  package:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package
      - name: List crate contents
        run: tar -tzf target/package/partitionline-*.crate | head -80
      - name: Publish dry-run
        run: cargo publish --dry-run --allow-dirty

  # Optional-feature compile gate (tracing spans).
  features:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy --all-targets --features tracing -- -D warnings
      - run: cargo test --all-targets --features tracing

  # libFuzzer smoke (nightly). Short wall-clock per target.
  fuzz-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install C++ toolchain for libFuzzer
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz smoke
        env:
          FUZZ_SECONDS: "15"
          CXX: g++
        run: bash scripts/ci-fuzz-smoke.sh

  # Real Apache Kafka broker smoke (separate from mock suite).
  # Matrix: Kafka 3.9.x and 4.x KRaft images.
  broker-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # WP-1.3: one 3.9 and one 4.x broker image (4.1 for KIP-932 share.version=1)
        kafka_image: ["apache/kafka:3.9.1", "apache/kafka:4.1.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Broker smoke
        env:
          CI: "true"
          KAFKA_IMAGE: ${{ matrix.kafka_image }}
        run: bash scripts/ci-broker-smoke.sh

  # Produce-ack p99 relative gate (unsigned, not vs C).
  latency-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Start Kafka
        run: |
          docker run -d --name pl-lat -p 9092:9092 apache/kafka:3.9.1
          for i in $(seq 1 90); do
            if docker exec pl-lat /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec pl-lat /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --if-not-exists --topic pl-ci-latency --partitions 1 --replication-factor 1
      - name: Latency gate
        env:
          KAFKA_BOOTSTRAP: "127.0.0.1:9092"
          KAFKA_TOPIC: "pl-ci-latency"
          COUNT: "2000"
          WARMUP: "200"
          LATENCY_SLACK_PCT: "100"
        run: bash scripts/ci-latency-gate.sh
      - name: Stop Kafka
        if: always()
        run: docker rm -f pl-lat || true
