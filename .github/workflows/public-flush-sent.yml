name: Public flush error publication witness

on:
  push:
    branches: ["qualification/flush-error-sent-20261108"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [default, all]
    env:
      PROFILE: ${{ matrix.profile }}
      RUSTFLAGS: "--cfg flush_sent_witness --check-cfg=cfg(flush_sent_witness)"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Provenance
        run: |
          set -eu
          rustc -Vv
          cargo -V
          git rev-parse HEAD
          git rev-parse HEAD:src/producer.rs
          git rev-parse HEAD:tests/public_flush_sent.rs
          sha256sum src/producer.rs tests/public_flush_sent.rs tests/common/mod.rs Cargo.lock
          mkdir -p witness-logs
      - name: Control - receive first flush error
        run: |
          set -euo pipefail
          args=()
          if test "$PROFILE" = all; then args+=(--all-features); fi
          PL_CONSUME_FIRST=1 cargo +stable test --locked "${args[@]}" --test public_flush_sent -- --exact public_flush_error_published_before_observation --test-threads=1 --nocapture 2>&1 | tee witness-logs/consume.log
          grep -F "FLUSH_ERROR_CONSUMED" witness-logs/consume.log
          grep -F "test result: ok. 1 passed; 0 failed" witness-logs/consume.log
      - name: Observe unpolled published result
        if: always()
        run: |
          set -euo pipefail
          args=()
          if test "$PROFILE" = all; then args+=(--all-features); fi
          PL_CONSUME_FIRST=0 cargo +stable test --locked "${args[@]}" --test public_flush_sent -- --exact public_flush_error_published_before_observation --test-threads=1 --nocapture 2>&1 | tee witness-logs/unobserved.log
          grep -F "FLUSH_ERROR_UNOBSERVED" witness-logs/unobserved.log
          grep -F "test result: ok. 1 passed; 0 failed" witness-logs/unobserved.log
      - name: Retain witness output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-flush-sent-${{ matrix.profile }}
          path: witness-logs
          retention-days: 30
