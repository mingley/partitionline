name: Public producer flush barrier controls

on:
  push:
    branches: [qualification/public-flush-barrier-controls-20261108]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '0'
      RUSTFLAGS: '--cfg flush_barrier_witness --check-cfg=cfg(flush_barrier_witness) --cfg flush_retirement_witness --check-cfg=cfg(flush_retirement_witness)'
    steps:
      - name: Prepare retained evidence
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/public-flush-barrier"
      - name: Checkout isolated controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 30
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Cargo.toml
            /Cargo.lock
            /rust-toolchain.toml
            /README.md
            /clippy.toml
            /.cargo/
            /src/
            /examples/
            /tests/common/
            /tests/public_flush_barrier.rs
            /tests/public_flush_retirement.rs
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify source and record provenance
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/public-flush-barrier"
          base=1036a393eb85f23032b935bf86862b7e98e36e14
          {
            echo "qualification_commit=$GITHUB_SHA"
            echo "base_commit=$base"
            git merge-base --is-ancestor "$base" HEAD
            test "$(git rev-parse "$base:src/producer.rs")" = 1e7733c136e54b532cdc8bddabd1e0c828e50ed2
            test "$(git rev-parse HEAD:src/producer.rs)" = f0dfd6f1834092aa89ad152274e7a39991cbda4e
            test "$(git rev-parse HEAD:tests/common/mod.rs)" = 9d14334cf587b774701692547fdbdfd64bd399a1
            test "$(git rev-parse HEAD:tests/public_flush_barrier.rs)" = 644badc82eaa1863dc703d23a56dfca5e221ffc1
            test "$(git rev-parse HEAD:tests/public_flush_retirement.rs)" = 98bf92a75f599eb3c1285f960fba8a341ccb553b
            test "$(git rev-parse HEAD:Cargo.lock)" = d1cb698aaaf7554fe904ba02d671c4a8ab4975b3
            test "$(git rev-parse "$base:tests/common/mod.rs")" = 9a995292044c527ae2c2a17eca09b9f947bb12ed
            test "$(git rev-parse HEAD:Cargo.toml)" = 585bbf9a31465d6bba3f66f593fddd1add516f36
            test "$(git rev-parse HEAD:rust-toolchain.toml)" = 05e6ca1bf94c42a23333262558d22b866615466e
            test -z "$(git status --porcelain)"
            git diff "$base" HEAD -- src/producer.rs > "$evidence/producer-observers.patch"
            git diff "$base" HEAD -- tests/common/mod.rs > "$evidence/mock-gates.patch"
            sha256sum src/producer.rs Cargo.toml Cargo.lock rust-toolchain.toml tests/common/mod.rs tests/public_flush_barrier.rs tests/public_flush_retirement.rs "$evidence/producer-observers.patch" "$evidence/mock-gates.patch"
            rustc +stable -vV
            cargo +stable -V
            uname -a
            echo "RUSTFLAGS=$RUSTFLAGS"
          } 2>&1 | tee "$evidence/provenance.log"
          cp tests/public_flush_barrier.rs tests/public_flush_retirement.rs "$evidence/"
      - name: Run public histories with baseline negative controls
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/public-flush-barrier"
          for mode in default all-features; do
            extra=()
            if [ "$mode" = all-features ]; then extra+=(--all-features); fi
            for case in overlapping_flushes_wait_for_accepted_record later_record_has_independent_completion flush_deadline_does_not_finish_record; do
              log="$evidence/$mode-$case.log"
              timeout 600 cargo +stable test --locked "${extra[@]}" --test public_flush_barrier "$case" -- --exact --nocapture --test-threads=1 2>&1 | tee "$log"
              grep -F 'test result: ok. 1 passed; 0 failed;' "$log"
            done
            for pair in public_flush_barrier:cancelled_flush_does_not_consume_other_waiter_error:BASELINE_CANCELLED_ERROR_LOST public_flush_retirement:public_flush_waits_for_retired_worker_retry_handoff:BASELINE_RETIREMENT_FLUSH_COMPLETED_EARLY; do
              IFS=: read -r test_binary case marker <<< "$pair"
              log="$evidence/$mode-$case.log"
              set +e
              timeout 600 cargo +stable test --locked "${extra[@]}" --test "$test_binary" "$case" -- --exact --nocapture --test-threads=1 2>&1 | tee "$log"
              result=${PIPESTATUS[0]}
              set -e
              test "$result" -eq 101
              test "$(grep -Fc "$marker" "$log")" -eq 1
              grep -F 'test result: FAILED. 0 passed; 1 failed;' "$log"
              echo "EXPECTED_BASELINE_NEGATIVE $mode $case $marker"
            done
          done
      - name: Check control formatting
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +stable --edition 2021 --check tests/public_flush_barrier.rs tests/public_flush_retirement.rs 2>&1 | tee "$RUNNER_TEMP/public-flush-barrier/rustfmt.log"
      - name: Retain controls, patches, provenance and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: public-flush-barrier-${{ github.run_id }}
          path: ${{ runner.temp }}/public-flush-barrier
          if-no-files-found: error
          retention-days: 30
