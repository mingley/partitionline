name: Admin poll test references
on:
  push:
    branches:
      - work/admin-poll-refs-20261108
permissions:
  contents: read
jobs:
  refs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Search tracked files outside retained evidence
        shell: bash
        run: |
          set +e
          git grep -n -F -e 'extending_many_described_topics_does_not_hold_the_caller' -e 'indexing_many_described_producers_does_not_hold_the_caller' -- . ':(exclude)docs/evidence/**' ':(exclude).github/workflows/admin-poll-refs.yml'
          result=$?
          set -e
          if [ "$result" -eq 1 ]; then printf 'No references outside retained evidence.\n'; elif [ "$result" -ne 0 ]; then exit "$result"; fi
