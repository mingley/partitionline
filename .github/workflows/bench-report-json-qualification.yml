name: Benchmark report malformed-input controls
on:
  push:
    branches: [qualification/bench-report-json-20261110]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned validation dependencies
        run: python -m pip install -r benchmarks/requirements.txt
      - name: Record source
        run: |
          git rev-parse HEAD
          python --version
          sha256sum scripts/benchmark-report.py benchmarks/tests/test_report.py benchmarks/result-schema.json
      - name: Run reporter controls
        run: python -B -m unittest discover -s benchmarks/tests -p test_report.py -v
      - name: Run existing matrix tests
        run: python -B -m unittest discover -s benchmarks/tests -p test_matrix.py -v
