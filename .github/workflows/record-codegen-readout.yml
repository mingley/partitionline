name: Inspect retained record encoder instructions

on:
  push:
    branches: [qualification/record-codegen-readout-20261108]

permissions:
  contents: read
  actions: read

jobs:
  readout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13610647012" > "$RUNNER_TEMP/artifact.json"
          python3 - "$RUNNER_TEMP/artifact.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f: a=json.load(f)
          assert (a["id"], a["workflow_run"]["id"], a["workflow_run"]["head_sha"], a["digest"]) == (
              13610647012, 42462618286, "cd447624953a09a4fe1eba54bcc233e278a2b56e",
              "sha256:5fda2ae97ea3df622dcf94fc30408231f882126d67ba3ac09029c0bfe39bca96")
          assert not a["expired"]
          print(json.dumps({"artifact_id":a["id"],"digest":a["digest"],"expires":a["expires_at"]}))
          PY
      - name: Download retained disassembly
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: 13610647012
          run-id: 42462618286
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retained-codegen
          digest-mismatch: error
      - name: Inspect record encoder hot-path branches
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/retained-codegen" <<'PY'
          import re, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          hdr=re.compile(r"^([0-9a-f]+) <(.+)>:$")
          ins=re.compile(r"^\s*([0-9a-f]+):\s")
          for label, ranges in [("baseline", [(0,0x160),(0x420,0x590)]),
                                ("candidate", [(0,0x160),(0x440,0x500),(0x610,0x750)])]:
              text=(root / (label+".asm")).read_text(encoding="utf-8").splitlines()
              start=None
              print("###", label)
              for line in text:
                  m=hdr.match(line)
                  if m and start is None and m.group(2)=="partitionline::protocol::records::encode_record":
                      start=int(m.group(1),16)
                      print(line)
                      continue
                  if start is None: continue
                  if m: break
                  m=ins.match(line)
                  if m:
                      offset=int(m.group(1),16)-start
                      if any(a<=offset<b for a,b in ranges):
                          print(f"+0x{offset:03x} {line}")
              if start is None: raise SystemExit("encoder symbol missing")
          PY
          echo "valgrind: $(command -v valgrind || echo unavailable)"
          echo "perf: $(command -v perf || echo unavailable)"
          if [ -r /proc/sys/kernel/perf_event_paranoid ]; then cat /proc/sys/kernel/perf_event_paranoid; fi
          if command -v perf >/dev/null 2>&1; then perf stat -e instructions true 2>&1 || true; fi
