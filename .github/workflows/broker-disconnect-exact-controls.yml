name: Broker exact disconnect event controls
on:
  push:
    branches: [qualification/broker-disconnect-exact-controls-20261108]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verify exact formatted source
        run: |
          set -euo pipefail
          rustc -Vv
          test "$(git rev-parse HEAD^)" = "619c38da19c05dff8aa7e4f3b300ca1ab32a8f76"
          test "$(git rev-parse HEAD:partitionline-broker/src/transport.rs)" = "913ebb4caef03382bf4dfd0a02f249c2b6c5c1ef"
          test "$(git hash-object partitionline-broker/src/transport.rs)" = "913ebb4caef03382bf4dfd0a02f249c2b6c5c1ef"
          cargo fmt --manifest-path partitionline-broker/Cargo.toml -- --check
          cp partitionline-broker/src/transport.rs /tmp/disconnect-event-clean.rs
      - name: Existing disconnect and flood checks in both profiles
        run: |
          set -euo pipefail
          for profile in default all; do
            args=()
            if [[ "$profile" == all ]]; then args=(--all-features); fi
            cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib "${args[@]}" transport::disconnect_tests:: -- --nocapture | tee /tmp/disconnect-event-positive.log
            grep -qE '^test result: ok\. 3 passed; 0 failed;' /tmp/disconnect-event-positive.log
            test "$(grep -c 'disconnect-check started=true observed=true stopped_before_cleanup=1 joined=true' /tmp/disconnect-event-positive.log)" -eq 2
          done
      - name: No EOF cancellation mutant
        run: |
          set -euo pipefail
          cp /tmp/disconnect-event-clean.rs partitionline-broker/src/transport.rs
          python3 - <<'PY'
          from pathlib import Path
          p=Path("partitionline-broker/src/transport.rs")
          s=p.read_text()
          old="            Ok(0) => return Exit::PeerClosed,"
          assert s.count(old)==1
          p.write_text(s.replace(old,"            Ok(0) => return std::future::pending::<Exit>().await,",1))
          PY
          for name in client_disconnect_stops_the_handler pipelined_disconnect_stops_the_handler; do
            if cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib "$name" -- --nocapture > /tmp/disconnect-event-mutant.log 2>&1; then cat /tmp/disconnect-event-mutant.log; exit 1; fi
            cat /tmp/disconnect-event-mutant.log
            grep -F 'disconnect-check started=true observed=false stopped_before_cleanup=0 joined=true' /tmp/disconnect-event-mutant.log
            grep -F 'disconnect did not stop the handler before cleanup' /tmp/disconnect-event-mutant.log
          done
          cp /tmp/disconnect-event-clean.rs partitionline-broker/src/transport.rs
      - name: Premature notice plus no EOF cancellation mutant
        run: |
          set -euo pipefail
          cp /tmp/disconnect-event-clean.rs partitionline-broker/src/transport.rs
          python3 - <<'PY'
          from pathlib import Path
          p=Path("partitionline-broker/src/transport.rs")
          s=p.read_text()
          eof="            Ok(0) => return Exit::PeerClosed,"
          guard="                let _guard = Guard(stopped, stopped_notice);"
          started="                started.fetch_add(1, Ordering::SeqCst);"
          assert s.count(eof)==1 and s.count(guard)==1 and s.count(started)==1
          s=s.replace(eof,"            Ok(0) => return std::future::pending::<Exit>().await,",1)
          s=s.replace(guard,"                let _guard = Guard(stopped, Arc::clone(&stopped_notice));",1)
          s=s.replace(started,started+"\n                stopped_notice.notify_one();",1)
          p.write_text(s)
          PY
          if cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib client_disconnect_stops_the_handler -- --nocapture > /tmp/disconnect-false-notice.log 2>&1; then cat /tmp/disconnect-false-notice.log; exit 1; fi
          cat /tmp/disconnect-false-notice.log
          grep -F 'disconnect-check started=true observed=true stopped_before_cleanup=0 joined=true' /tmp/disconnect-false-notice.log
          grep -F 'client disconnect did not stop the handler before cleanup' /tmp/disconnect-false-notice.log
          cp /tmp/disconnect-event-clean.rs partitionline-broker/src/transport.rs
      - name: Missing handler-start notification mutant
        run: |
          set -euo pipefail
          cp /tmp/disconnect-event-clean.rs partitionline-broker/src/transport.rs
          python3 - <<'PY'
          from pathlib import Path
          p=Path("partitionline-broker/src/transport.rs")
          s=p.read_text()
          old="                started_notice.notify_one();"
          assert s.count(old)==1
          p.write_text(s.replace(old,"                let _ = &started_notice;",1))
          PY
          cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib --no-run
          for name in client_disconnect_stops_the_handler flooded_request_stops_the_handler; do
            if timeout 15s cargo test --locked --manifest-path partitionline-broker/Cargo.toml --lib "$name" -- --nocapture > /tmp/disconnect-no-start.log 2>&1; then cat /tmp/disconnect-no-start.log; exit 1; fi
            cat /tmp/disconnect-no-start.log
            grep -F 'handler did not start before the test setup deadline' /tmp/disconnect-no-start.log
            if [[ "$name" == client_disconnect_stops_the_handler ]]; then
              grep -E 'disconnect-check started=false observed=false stopped_before_cleanup=[0-9]+ joined=true' /tmp/disconnect-no-start.log
            else
              grep -F 'disconnect-setup joined=true' /tmp/disconnect-no-start.log
            fi
          done
          cp /tmp/disconnect-event-clean.rs partitionline-broker/src/transport.rs
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify exact source and run strict all-target Clippy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "619c38da19c05dff8aa7e4f3b300ca1ab32a8f76"
          test "$(git rev-parse HEAD:partitionline-broker/src/transport.rs)" = "913ebb4caef03382bf4dfd0a02f249c2b6c5c1ef"
          test "$(git hash-object partitionline-broker/src/transport.rs)" = "913ebb4caef03382bf4dfd0a02f249c2b6c5c1ef"
          cargo fmt --manifest-path partitionline-broker/Cargo.toml -- --check
          cargo clippy --locked --manifest-path partitionline-broker/Cargo.toml --all-targets --all-features -- -D warnings
