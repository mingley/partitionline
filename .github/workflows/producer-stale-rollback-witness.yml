name: Stale producer rollback baseline witness

on:
  push:
    branches: [qualification/producer-stale-rollback-20261109]

permissions:
  contents: read

jobs:
  witness:
    name: Stale rollback witness (${{ matrix.profile }}, stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: default
            flags: ""
          - profile: all-features
            flags: "--all-features"
    env:
      FLAGS: ${{ matrix.flags }}
      RUSTFLAGS: "--cfg stale_identity_witness --check-cfg=cfg(stale_identity_witness)"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          persist-credentials: false
          sparse-checkout: |
            .cargo
            src
            tests
            examples
      - uses: dtolnay/rust-toolchain@stable
      - name: Baseline witness
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          git hash-object src/producer.rs tests/common/mod.rs tests/stale_identity_rollback.rs
          set +e
          cargo test --locked $FLAGS --test stale_identity_rollback -- --nocapture > "$RUNNER_TEMP/stale.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/stale.log"
          test "$result" -eq 101
          grep -F 'STALE_IDENTITY after=0 first_base=0' "$RUNNER_TEMP/stale.log"
          grep -F 'stale rollback rewound the new generation' "$RUNNER_TEMP/stale.log"
