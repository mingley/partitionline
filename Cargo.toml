[package]
name = "partitionline"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A Kafka client in pure Rust. No C, no librdkafka."
repository = "https://github.com/mingley/partitionline"
homepage = "https://github.com/mingley/partitionline"
readme = "README.md"
authors = ["Michael Ingley"]
keywords = ["kafka", "client", "async", "producer"]
categories = ["network-programming", "asynchronous"]
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "docs/design.md",
    "docs/gaps.md",
    "docs/benchmark.md",
    "Cargo.toml",
    "Cargo.lock",
    "clippy.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "NOTICE",
]

[workspace]

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_must_use = "deny"
unused_results = "deny"

[workspace.lints.clippy]
# Failure paths must be written down, not inferred. These are the lints that
# turn "someone should have noticed" into "the build said no".
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
mem_forget = "deny"

await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
await_holding_invalid_type = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"

indexing_slicing = "deny"

cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
lossy_float_literal = "deny"

[lints]
workspace = true

[dependencies]
base64 = "0.22"
bytes = "1"
crc32c = "0.6"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.2"
hmac = "0.12"
lz4_flex = "0.11"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
sha2 = "0.10"
snap = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
parking_lot = "0.12"
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.13"

[[example]]
name = "produce"

[[example]]
name = "bench_produce"

[[example]]
name = "roundtrip"

[[example]]
name = "bench_fetch"

[profile.release]
lto = "thin"
codegen-units = 1
