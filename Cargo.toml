[package]
name = "partitionline"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A Kafka client in pure Rust. No C, no librdkafka."
repository = "https://github.com/mingley/partitionline"
homepage = "https://github.com/mingley/partitionline"
documentation = "https://docs.rs/partitionline"
readme = "README.md"
authors = ["Michael Ingley <michael.ingley@gmail.com>"]
keywords = ["kafka", "client", "async", "producer", "streaming"]
categories = ["network-programming", "asynchronous"]
# Anchor every path: bare filenames also match nested benchmark peer files.
include = [
    "/src/**",
    "/tests/**",
    "!/tests/conformance/broker/**",
    "/examples/**",
    "/docs/*.md",
    "/docs/latency-baseline.json",
    "/CHANGELOG.md",
    "/deny.toml",
    "/Cargo.toml",
    "/Cargo.lock",
    "/clippy.toml",
    "/README.md",
    "/SECURITY.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/NOTICE",
]

[workspace]
exclude = ["benchmarks/nullbroker", "benchmarks/codec", "benchmarks/runtime", "fuzz", "partitionline-schema", "partitionline-broker"]

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_must_use = "deny"
unused_results = "deny"

[workspace.lints.clippy]
# Restriction/pedantic lints (allow by default). Not listed: lints that
# Clippy already denies, e.g. let_underscore_lock.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
mem_forget = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
await_holding_invalid_type = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
lossy_float_literal = "deny"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["zlib-rs"]
# gzip through zlib-rs: pure Rust, but it uses unsafe and SIMD internally.
# Without it, gzip uses miniz_oxide (forbids unsafe; CRC-32 from crc32fast).
# docs/gzip-backend.md
zlib-rs = ["flate2/zlib-rs"]
# Optional OpenTelemetry-friendly spans on produce-ack, fetch, rebalance, and txn boundaries.
tracing = ["dep:tracing"]

[dependencies]
base64 = "0.23"
bytes = "1"
crc32c = "0.6"
flate2 = { version = "1", default-features = false, features = ["rust_backend", "runtime_detection"] }
getrandom = "0.4"
hmac = "0.13"
lz4_flex = "0.14"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"
snap = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
parking_lot = "0.12"
tracing = { version = "0.1", optional = true }
webpki-roots = "1"

[dev-dependencies]
# Intentionally empty: mock TLS fixtures use the openssl CLI (see
# tests/common/mod.rs) so we do not pull rcgen→time (RUSTSEC-2026-0009).

[[example]]
name = "produce"

[[example]]
name = "bench_produce"

[[example]]
name = "roundtrip"

[[example]]
name = "bench_fetch"

[[example]]
name = "consume"

[[example]]
name = "group"

[[example]]
name = "kip848"

[[example]]
name = "txn"

[[example]]
name = "admin"

[[example]]
name = "sasl"

[[example]]
name = "oauth"

[[example]]
name = "tls"

[[example]]
name = "eos"

[[example]]
name = "intercept"

[[example]]
name = "consume_intercept"

[[example]]
name = "bench_latency"

[[example]]
name = "share"

[[example]]
name = "cooperative"

[[example]]
name = "metrics"

[[example]]
name = "offsets"

[[example]]
name = "pause"

[[example]]
name = "wakeup"

[[example]]
name = "verifiable_producer"

[[example]]
name = "verifiable_consumer"

[profile.release]
lto = "thin"
codegen-units = 1
